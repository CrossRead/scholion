<!-- Pico CSS, vendored locally (no CDN, no build step — served by server.py
     exactly like chart.min.js) so the app keeps working with no internet
     connection at all. It supplies sane defaults for elements this file does
     not already style by hand; every custom class below still wins, because
     a class selector always outranks Pico's element-level default. -->
<link rel="stylesheet" href="/pico.min.css">
<style>
  /* ── Design tokens (task 195) ────────────────────────────────────────────
     One scale for everything on the page. The audit of 14.09.2026 counted
     nineteen font sizes and 303 inline styles: each tab had been drawn on its
     own, so the same kind of thing looked different from tab to tab and every
     new feature added a variant. Five sizes, six spacings, two radii. */
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#ffffff; --ink-2:#c9c8be; --muted:#a09e96;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --accent:#3987e5;
    --t-xs:12.5px; --t-s:14px; --t-m:16px; --t-l:19px; --t-xl:24px;
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
    --r:14px; --r-s:10px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;

    /* Pico reads its own look from these --pico-* variables; mapped onto the
       tokens above so its defaults for bare elements land in this palette. */
    --pico-background-color: var(--plane);
    --pico-color: var(--ink);
    --pico-h1-color: var(--ink); --pico-h2-color: var(--ink); --pico-h3-color: var(--ink);
    --pico-h4-color: var(--ink); --pico-h5-color: var(--ink); --pico-h6-color: var(--ink);
    --pico-muted-color: var(--muted);
    --pico-muted-border-color: var(--grid);
    --pico-card-background-color: var(--surface);
    --pico-card-border-color: var(--border);
    --pico-card-sectioning-background-color: var(--surface-2);
    --pico-table-border-color: var(--grid);
    --pico-code-background-color: var(--surface-2);
    --pico-code-color: var(--ink-2);
    --pico-form-element-background-color: var(--surface-2);
    --pico-form-element-border-color: var(--border);
    --pico-form-element-color: var(--ink);
    --pico-form-element-placeholder-color: var(--muted);
    --pico-primary: var(--accent);
    --pico-primary-background: var(--accent);
    --pico-primary-border: var(--accent);
    --pico-primary-hover: var(--accent);
    --pico-primary-hover-background: var(--accent);
    --pico-primary-underline: rgba(57,135,229,.5);
    --pico-primary-hover-underline: rgba(57,135,229,.7);
    --pico-primary-focus: rgba(57,135,229,.35);
    --pico-primary-inverse: #fff;
    --pico-border-radius: var(--r);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);font-size:var(--t-m);line-height:1.55}
  a{color:var(--accent)}

  /* ── The frame: header, tabs, page, footer ───────────────────────────────
     The header is one line: the name, who the profile is, and on the right the
     local badge, the language and a menu for the pages that are not about
     health (the Guide, the Assistant). The disclaimer is said once, in the
     footer: pinned above the tabs it covered them on a phone, and the page
     spent 440 px on chrome before the first word of content. */
  header{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:var(--t-l);margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  header .sub{color:var(--muted);font-size:var(--t-s)}
  .hdr-right{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
  #localbadge{font-size:var(--t-xs);cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap;color:var(--ink-2)}
  #langswitch{display:inline-flex;gap:4px}
  .menu{position:relative}
  .menubtn{font-size:var(--t-m);line-height:1;padding:6px 10px}
  .menu-panel{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:6px;min-width:230px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  .menu-panel button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
    padding:9px 12px;border-radius:8px;font-size:var(--t-m);cursor:pointer}
  .menu-panel button:hover,.menu-panel button.active{background:var(--surface-2)}
  .menu-panel .mnote{padding:6px 12px 4px;font-size:var(--t-xs);color:var(--muted);border-top:1px solid var(--grid);margin-top:4px}
  .menu-panel #mupd{border-top:0;margin-top:0;color:var(--ink-2);max-width:280px;white-space:normal}
  .ringload{display:inline-flex;align-items:center;gap:8px;margin-left:10px;font-weight:400;color:var(--muted)}
  .ringload .dna-bar{display:inline-block;width:90px;height:5px}
  .ringload .dna-fill{display:block}
  nav{display:flex;gap:2px;padding:6px 16px;border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;
      position:sticky;top:0;background:var(--plane);z-index:20;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent;border:1px solid transparent;color:var(--ink-2);padding:8px 15px;border-radius:999px;
      cursor:pointer;font-size:15px;white-space:nowrap;flex:0 0 auto}
  nav button:hover{background:var(--surface-2)}
  nav button.active{background:var(--surface-2);color:var(--ink);border-color:var(--border);font-weight:600}
  main{padding:22px 24px 32px;max-width:1100px;margin:0 auto}
  footer.disclaimer{color:var(--muted);font-size:var(--t-xs);padding:14px 24px;background:var(--surface);border-top:1px solid var(--border)}
  footer.disclaimer .sub{margin-left:8px;opacity:.8}
  .notice{margin:8px 16px}
  #demobanner{background:#3a2a12;border-bottom:1px solid #6b4c19;color:#f3d9a4;padding:9px 18px;font-size:var(--t-s);font-weight:600}

  /* ── The grammar of a page ───────────────────────────────────────────────
     Every tab in the same order: a title, the one question it answers, a strip
     of the three or four numbers worth seeing first, the sections, and the
     sources in one line at the bottom. */
  .ptitle{font-size:var(--t-xl);font-weight:700;margin:2px 0 2px;line-height:1.25}
  .pq{color:var(--ink-2);margin:0 0 var(--sp4);max-width:72ch}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 var(--sp5)}
  .fact{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;min-width:140px;
        text-align:left;color:var(--ink);font:inherit}
  .fact b{display:block;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .fact b small{font-size:var(--t-xs);font-weight:600;margin-left:4px}
  .fact span{display:block;font-size:var(--t-xs);color:var(--muted);margin-top:2px}
  button.fact{cursor:pointer}
  button.fact:hover{border-color:var(--accent)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 var(--sp4)}
  h2.section{font-size:var(--t-l);font-weight:650;color:var(--ink);margin:var(--sp6) 0 var(--sp3);line-height:1.3;
             display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
  h2.section.mt-0,.summary+h2.section,.toolbar+h2.section{margin-top:var(--sp4)}
  h2.section .muted{font-weight:400;font-size:var(--t-s)}
  .so-h{font-weight:650;margin:var(--sp5) 0 var(--sp2);font-size:var(--t-m);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .so-h .muted{font-weight:400;font-size:var(--t-s)}
  .srcfoot{margin-top:var(--sp6);padding-top:var(--sp3);border-top:1px solid var(--grid);font-size:var(--t-xs);color:var(--muted)}
  .srcfoot>summary{cursor:pointer;list-style:none}
  .srcfoot>summary::-webkit-details-marker{display:none}
  .srcfoot>summary::after{content:" ▸";color:var(--muted)}
  .srcfoot[open]>summary::after{content:" ▾"}
  .srcfoot b{color:var(--ink-2);font-weight:500}

  /* ── Surfaces and text ───────────────────────────────────────────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp4)}
  .card .label{font-size:13px;color:var(--muted)}
  .card .value{font-size:28px;font-weight:700;margin:4px 0 8px;line-height:1.2}
  .card .value small{font-size:var(--t-s);color:var(--muted);font-weight:400}
  .list-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:var(--sp2)}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .meta{color:var(--muted);font-size:13px;margin-top:6px}
  .why{color:var(--ink-2);font-size:var(--t-s);margin-top:4px}
  .spec{color:var(--muted);font-size:13px;margin-top:4px}
  .row-l{font-size:var(--t-s);line-height:1.5;color:var(--ink-2);margin:3px 0}
  .trend{color:var(--ink-2);font-size:13px;margin-left:4px}
  .glink{color:var(--accent);font-size:13px}
  .row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
  .ml-auto{margin-left:auto}
  .mt-0{margin-top:0}.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:24px}
  .mb-0{margin-bottom:0}.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
  code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:13px}
  .hidden{display:none}
  /* A long free-text note is cut at three lines and opens on a click: a note of
     twelve lines inside a card of a number made the number hard to find. */
  .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .clamp.open{display:block;-webkit-line-clamp:unset}
  .clampmore{font-size:var(--t-xs);color:var(--accent);cursor:pointer;background:none;border:0;padding:0;margin-top:2px}

  /* ── Status: five classes, one meaning each ──────────────────────────────
     good — in range, reached, favourable · warning — attention · critical —
     out of range · near — information, not a deviation (at the edge of the
     corridor, one copy of an allele, a mechanism) · unknown — no data, not read. */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;max-width:100%}
  .pnl-exp .badge,.match .badge,.list-item .row .badge{white-space:normal;border-radius:12px}
  .badge .dot{width:7px;height:7px;border-radius:50%}
  .b-critical{background:rgba(208,59,59,.14);color:#f0908f;border-color:rgba(208,59,59,.35)}
  .b-warning{background:rgba(250,178,25,.14);color:#f4c65a;border-color:rgba(250,178,25,.30)}
  .b-good{background:rgba(12,163,12,.13);color:#5ec95e;border-color:rgba(12,163,12,.30)}
  .b-near{background:rgba(72,133,214,.14);color:#8ab4f8;border-color:rgba(72,133,214,.32)}
  .b-unknown{background:rgba(137,135,129,.14);color:#bdbbb2;border-color:rgba(137,135,129,.30)}
  .c-good{color:var(--good)} .c-warning{color:var(--warning)} .c-critical{color:var(--critical)} .c-muted{color:var(--muted)}
  .warnbox{border-left:3px solid var(--warning)}
  .errbox{border-left:3px solid var(--critical)}
  /* «Nothing here», in one shape everywhere, with the reason in words. */
  .empty{color:var(--muted);font-size:var(--t-s);padding:10px 14px;border:1px dashed var(--grid);border-radius:var(--r-s)}

  /* ── Controls ────────────────────────────────────────────────────────── */
  input,select,button.act{font-family:inherit;font-size:15px}
  input,select{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:var(--r-s);padding:8px 12px}
  input::placeholder{color:var(--muted)}
  button.act{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:600;font-size:var(--t-s)}
  button.act:hover{filter:brightness(1.08)}
  button.act:disabled,button.ghost:disabled{opacity:.55;cursor:default}
  button.ghost,a.ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:var(--r-s);padding:8px 12px;cursor:pointer;font-size:var(--t-s);font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  button.ghost:hover,a.ghost:hover{border-color:var(--accent)}
  .btn-sm{font-size:13px !important;padding:4px 10px !important}
  .pickbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:var(--t-xs);line-height:1.4}
  .pickbtn:hover{border-color:var(--accent);color:var(--ink)}
  .pickbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:rgba(57,135,229,.14)}
  .drugchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .drugchips button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:var(--t-s)}
  .drugchips button:hover{color:var(--ink);border-color:var(--accent)}
  .drugchips button[style*="cursor:default"]:hover{border-color:var(--border);color:var(--ink-2)}
  /* The way into another tab, from inside a section: a small button that says
     where it goes, not a blue word with an arrow. */
  .tablink{font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap;margin-left:auto;
           border:1px solid var(--border);border-radius:999px;padding:2px 10px;background:var(--surface-2)}
  .tablink:hover{border-color:var(--accent);color:var(--ink)}
  .syslink{color:var(--accent);text-decoration:none;cursor:pointer;border-bottom:1px dotted rgba(57,135,229,.6)}
  .syslink:hover{border-bottom-style:solid}
  .form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:var(--sp4);margin-top:var(--sp2)}
  .form .fr{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:10px 18px;border-radius:var(--r-s);font-size:var(--t-s);opacity:0;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
  .toast.show{opacity:1}

  /* ── Folding: one shape ──────────────────────────────────────────────── */
  details.fold,details.pnl-fold{margin-top:var(--sp2)}
  details.fold>summary,details.pnl-fold>summary{cursor:pointer;color:var(--ink-2);font-size:var(--t-s);padding:6px 0;list-style:none}
  details.fold>summary::-webkit-details-marker,details.pnl-fold>summary::-webkit-details-marker{display:none}
  details.fold>summary::before,details.pnl-fold>summary::before{content:"▸ ";color:var(--muted)}
  details.fold[open]>summary::before,details.pnl-fold[open]>summary::before{content:"▾ "}
  details.lsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:10px}
  details.lsec>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  details.lsec>summary::-webkit-details-marker{display:none}
  details.lsec>summary::before{content:"▸";color:var(--muted);font-size:13px;transition:transform .15s}
  details.lsec[open]>summary::before{transform:rotate(90deg)}
  details.lsec .blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  details.lsec .blk:first-of-type{border-top:none;padding-top:4px}
  details.lsec .blk h4{margin:0 0 5px;font-size:15px;color:var(--ink)}
  details.lsec .blk p{margin:0 0 8px;font-size:var(--t-s);line-height:1.62;color:var(--ink-2);white-space:pre-wrap}

  /* ── Tables of values ────────────────────────────────────────────────── */
  .tblwrap{overflow-x:auto}
  table.dt{width:100%;border-collapse:collapse;font-size:var(--t-s)}
  table.dt th{font-weight:500;color:var(--muted);text-align:left;font-size:var(--t-xs);padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
  table.dt td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
  table.dt td.v{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.dt td.d{color:var(--muted);white-space:nowrap}
  table.dt.gentbl tr.genrow{cursor:pointer}
  table.dt.gentbl tr.genrow:hover td{background:rgba(127,127,127,.08)}
  table.dt.gentbl tr.gengroup td{font-size:var(--t-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:12px}
  table.dt.gentbl tr.gendet td{background:rgba(127,127,127,.05)}
  tr.labgen td{padding-top:2px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
  .why.localnote{border-left:3px solid var(--warning,#d9a441);padding-left:8px}
  table.dt tr:last-child td{border-bottom:0}
  table.dt tr[data-system]{cursor:pointer}
  table.dt tr[data-system]:hover td{background:var(--surface-2)}

  /* ── Small charts and stat tiles ─────────────────────────────────────── */
  .spark{margin-top:10px}
  .sparkwrap{margin-top:10px}
  .sparkdates{display:flex;justify-content:space-between;width:168px;font-size:11.5px;color:var(--muted);margin-top:3px}
  .sparkwrap .spark{margin-top:0}
  .sparkleg{display:flex;gap:10px;width:168px;font-size:11.5px;color:var(--muted);margin-top:2px}
  .sparkleg .lg-tg,.tgt{color:var(--warning)}
  .tgt-ask{color:var(--ink-2)}
  .stat{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:var(--sp4)}
  .stat .s{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 16px;min-width:120px}
  .stat .s b{font-size:22px;display:block;font-weight:700}
  .stat .s span{font-size:var(--t-xs);color:var(--muted)}
  .srcline{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.35}
  .srcline.warn{color:var(--warning)}
  .srcbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .srcchip{font-size:var(--t-xs);color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);padding:4px 10px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;line-height:1.4}
  .srcchip b{color:var(--ink-2);font-weight:600}
  .prs-cat{margin-bottom:16px}
  .prs-cat-h{font-weight:650;font-size:var(--t-s);color:var(--ink-2);margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
  .prs-row{display:flex;align-items:center;gap:10px;padding:4px 0}
  .prs-lbl{flex:0 0 44%;font-size:13.5px;min-width:0}
  .prs-bar{flex:1 1 auto}
  .prs-num{flex:0 0 44px;text-align:right;font-weight:700;font-size:13px;color:var(--ink-2)}
  .pbar{position:relative;height:8px;background:var(--surface-2);border-radius:999px;overflow:visible}
  .pbar-fill{height:100%;border-radius:999px}
  .pbar-mark{position:absolute;top:-2px;width:2px;height:12px;background:var(--ink-2);transform:translateX(-1px)}
  .subnav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;margin:0 0 var(--sp4);border-bottom:1px solid var(--grid);scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{background:transparent;border:0;border-bottom:2px solid transparent;
    color:var(--muted);padding:8px 12px;font-size:var(--t-s);cursor:pointer;border-radius:0;
    display:inline-flex;align-items:center;gap:7px;width:auto;white-space:nowrap}
  .subnav button:hover{color:var(--ink-2)}
  .subnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .subnav .cnt{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 7px}
  .gpane{margin-top:var(--sp4)}
  pre.log{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;max-height:160px;overflow:auto;margin-top:8px}
  .row4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
  .row4 .cell{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;font-size:var(--t-s);min-width:0}
  .row4 .cellhead{font-size:var(--t-xs);color:var(--muted);margin-bottom:4px}

  /* ---- focus of attention (the card on "Overview") ---- */
  .fc{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
      border-radius:var(--r);padding:16px 18px}
  .fc .fch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .fc .fch h3{margin:0;font-size:17px;font-weight:700}
  .fc .fcwhy{color:var(--ink-2);font-size:var(--t-s);line-height:1.6;margin:8px 0 0}
  .fc .fcnum{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px;flex-wrap:wrap}
  .fc .fcnum b{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .fc .fcnum span{color:var(--muted);font-size:var(--t-s)}
  .fctrack{position:relative;height:10px;background:var(--surface-2);border-radius:999px;margin:14px 0 6px}
  .fctrack .zn{position:absolute;top:0;height:100%;border-radius:999px;background:rgba(12,163,12,.20)}
  .fctrack .mk{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink-2);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
  .fctrack .dt{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface)}
  .fcscale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .fclv{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
  .fclv:first-of-type{border-top:none}
  .fclv .mk{font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
  .fclv .ti{font-size:var(--t-s);color:var(--ink)}
  .fclv .ex{color:var(--muted);font-size:12.5px;font-weight:400}
  .fclv .nw{font-size:13px;color:var(--ink-2);margin-top:2px}
  .fclv .ev{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
  .fcq li{font-size:var(--t-s);color:var(--ink-2);margin-bottom:6px;line-height:1.55}
  .fcform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .fcform label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .bltbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px}
  .bltgrp{font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
  .bltgrp:first-child{margin-top:0}
  .blt{display:grid;grid-template-columns:minmax(104px,150px) 1fr minmax(96px,auto);gap:14px;align-items:center;padding:6px 0}
  .blt .l{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
  .blt .t{position:relative;height:10px;background:var(--surface-2);border-radius:999px;cursor:default}
  .blt .z{position:absolute;top:0;height:100%;background:rgba(12,163,12,.20);border-radius:999px}
  .blt .d{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--surface)}
  .blt .m{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink-2);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
  .blt .v{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;white-space:nowrap}
  .blt .v s{color:var(--muted);text-decoration:none;font-size:12px}
  .bltlgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
  .bltlgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .lsact{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:14px 18px}
  .lsact ol{margin:8px 0 0;padding-left:20px}
  .lsact li{margin-bottom:7px;font-size:var(--t-s);line-height:1.55;color:var(--ink-2)}
  .lsact li::marker{color:var(--accent);font-weight:700}
  .lsrev{background:var(--surface);border:1px solid rgba(250,178,25,.35);border-left:3px solid var(--warning);border-radius:var(--r);padding:14px 18px}

  /* ---- the goal dashboard (Overview) ---- */

<header>
  <h1><img src="/dna.svg" alt="" style="height:22px;width:auto;vertical-align:-4px;margin-right:6px">Scholion</h1>
  <span class="sub" id="subhead"></span>

    <span id="langswitch"></span>
    <span class="menu"><button class="ghost menubtn" id="menubtn" aria-haspopup="true" aria-expanded="false">☰</button>
      <div class="menu-panel" id="menupanel" hidden></div></span>
  </span>
</header>
<div id="demobanner" hidden></div>
<div id="updatenote" class="card notice" hidden></div>
<div id="recomputebox" class="card notice" hidden></div>
<nav id="nav"></nav>
<main id="view"></main>
<footer class="disclaimer"><span id="disclaimer"></span><span class="sub" id="ver"></span></footer>
<div class="toast" id="toast"></div>

<script>
const API = "";
const $ = (s,el=document)=>el.querySelector(s);
const el = (h)=>{const tpl=document.createElement('template');tpl.innerHTML=h.trim();return tpl.content.firstChild;};
const esc = (s)=>String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));

// ---------------- Language ----------------
// The language is a display preference of THIS browser tab and of nothing else. It is
// kept in the address bar (so that a reload and a bookmark keep it) and in
// sessionStorage (so that it survives moving between tabs of the interface); the
// server is told which language to answer in on every call and forgets it as soon as
// the reply is sent. Two tabs may therefore read the same profile in two languages.
let LANG='en', LANGS=['en'], MSG={};

// The same lookup rule as in the Python catalogue: named placeholders only, and a key
// with no phrase behind it shows up as the identifier in brackets rather than as an
// empty space, so that a hole in the catalogue cannot be mistaken for a design choice.
function t(key,vars){
  const s=MSG[key];
  if(s==null) return '⟦'+key+'⟧';
  return vars ? s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?String(vars[k]):m) : s;
}
// Plural forms by suffix, the same three as in the catalogue: English takes two,
// Russian three, and the choice is made here so that no call site has to know the rule.
function plural(n,key,vars){
  let form;
  if(LANG==='ru'){
    const h=n%100, u=n%10;
    form=(h>=11&&h<=14)?'many':(u===1?'one':(u>=2&&u<=4?'few':'many'));
  }else{
    form=(n===1)?'one':'many';
  }
  return t(key+'.'+form,{n:n,...(vars||{})});
}
// Numbers: a decimal comma in Russian, a decimal point in English. A formatting rule,
// not a phrase — it has no place in the catalogue.
const fmtNum=v=>LANG==='ru'?String(v).replace('.',','):String(v);

// ---- The pieces every page is built from (task 195) ----------------------
// Dates as a person writes them: «3 сент 2026», never «2026-09-03T08:22». The
// machine form stays in the data and in a tooltip; the page prints this one.
function fmtDate(s){
  if(s==null||s==='') return '';
  const m=String(s).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(!m) return String(s);
  const y=+m[1], mo=+m[2]-1, d=m[3]?+m[3]:null;
  try{
    const dt=new Date(Date.UTC(y,mo,d||1));
    // A month alone is abbreviated like a full date: «с нояб 2025», never the
    // nominative «с ноябрь 2025» that a spelled-out month would put after a preposition.
    const o=d?{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}:{month:'short',year:'numeric',timeZone:'UTC'};
    return dt.toLocaleDateString(LANG==='ru'?'ru-RU':'en-GB',o).replace(/\s*г\.$/,'').replace(/\.(?=\s)/,'');
  }catch(e){ return String(s).slice(0,10); }
}
// «Nothing here» and «this failed», each in one shape everywhere.
function emptyHtml(text){ return `<div class="empty">${esc(text)}</div>`; }
function errorHtml(text){ return `<div class="card errbox">${esc(text)}</div>`; }
// One threshold for a score, wherever a score is coloured.
function scoreCls(v){ return v==null?'c-muted':v>=80?'c-good':v>=50?'c-warning':'c-critical'; }
const STATUS_BADGE={critical:'b-critical',warning:'b-warning',good:'b-good',nodata:'b-unknown'};
function statusBadge(st){ const k=STATUS_BADGE[st]?st:'nodata'; return badge(STATUS_BADGE[k],t('web.status.'+k)); }
// The head of every page: a title, the one question the page answers, and the
// three or four numbers worth seeing before anything else.
function pageHead(title,question,facts){
  const fs=(facts||[]).filter(Boolean);
  return `<h1 class="ptitle">${esc(title)}</h1>`+(question?`<p class="pq">${esc(question)}</p>`:'')
    +(fs.length?`<div class="summary">${fs.join('')}</div>`:'');
}
// `value` is markup the caller built from numbers; `goto` makes the tile a door.
function factHtml(value,label,cls,goto){
  const tag=goto?'button':'div';
  return `<${tag} class="fact"${goto?` data-goto="${esc(goto)}"`:''}><b class="${cls||''}">${value}</b><span>${esc(label)}</span></${tag}>`;
}
// ClinVar's significance tokens in the reader's language; a token the catalogue
// does not name is printed as it came, with its underscores opened.
function clnsigText(s){
  return String(s||'').split(/[|,/]/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const v=t('clinvar.sig.'+x.toLowerCase().replace(/[\s-]+/g,'_'));
    return v.startsWith('⟦')?x.replace(/_/g,' '):v;
  }).join(' / ');
}
const isRsid=s=>/^rs\d+$/.test(String(s||''));
// ClinVar names a drug-response record «warfarin response - Dosage». The drug
// stays as ClinVar spells it; the kind of response is said in the reader's
// language. Any other disease name is printed as the source gives it: a
// home-made translation of a medical term would be a claim with no source.
function diseaseText(s){
  const m=String(s||'').match(/^(.+?)\s+response\s*-\s*([A-Za-z/]+)$/i);
  if(!m) return String(s||'');
  const kinds=m[2].toLowerCase().split('/').map(k=>t('clinvar.response_kind.'+k));
  if(kinds.some(k=>k.startsWith('⟦'))) return String(s);
  return t('clinvar.response',{drug:m[1],kind:kinds.join(' / ')});
}
// A long free-text note, cut at three lines until it is clicked.
function noteHtml(text,cls){
  if(!text) return '';
  const long=String(text).length>220;
  return `<div class="${cls||'why'}${long?' clamp':''}"${long?` title="${esc(t('web.common.show_more'))}"`:''}>${esc(text)}</div>`;
}
// Markers as rows: the facts a marker card carries — flag, value, corridor,
// date — in the density of a list. A row that knows its system opens it.
function markerTable(list){
  if(!list||!list.length) return '';
  const rows=list.map(m=>{const f=flagOf(m);
    return `<tr${m.system?` data-system="${esc(m.system)}" title="${esc(t('system.open'))}"`:''}><td>${esc(m.name)}</td>`
      +`<td class="v">${esc(fmtNum(m.value))} <span class="muted small">${esc(m.unit||'')}</span></td>`
      +`<td class="d">${esc(refText(m))}</td><td class="d opt" title="${esc(m.date||'')}">${esc(fmtDate(m.date))}</td><td>${badge(f.cls,t(f.key))}</td></tr>`
      +markerGeneticsRow(m);}).join('');
  return `<div class="tblwrap"><table class="dt"><thead><tr><th>${esc(t('web.table.marker'))}</th><th>${esc(t('web.table.value'))}</th>`
    +`<th>${esc(t('web.table.ref'))}</th><th class="opt">${esc(t('web.table.date'))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// The third entry (task 199 G): a marker with positions behind it says so
// under its own row — gene, rsID, level, the direction the author expects —
// and the row is a door to the system card, where the person's state is.
function markerGeneticsRow(m){
  const ps=m.positions||[]; if(!ps.length) return '';
  const items=ps.map(p=>`${p.level?levelChip(p.level,p.level_short)+' ':''}<b>${esc(p.gene)}</b> <span class="muted">${esc(p.rsid||'')}</span>${p.direction?` <span class="muted small">${esc(t('system.panel.dir.'+p.direction))}</span>`:''}`+(p.system?` ${systemLinkHtml(p.system,p.system_label||t('radar.domain.'+p.system))}`:'')).join(' · ');
  return `<tr class="labgen"><td colspan="5" class="small"><span class="muted">${esc(t('labs.genetics_of',{n:ps.length}))}:</span> ${items}</td></tr>`;
}
function wantedLang(){

const _net={started:0,done:0};

// switching tabs used to refetch every answer, and the radar's answers take
// seconds. Reads are remembered by their path; every write from the page and
// every finished background job empty the memory, and the answers that
// describe a running job are never remembered. A reader gets a copy.
const _apiCache=new Map();
const NO_CACHE=[/\/api\/update-status/,/\/api\/recompute\/status/,/\/api\/version\/check/,/\/api\/diag/,/\/api\/ping/];
function forgetAnswers(){_apiCache.clear();}
async function api(path,opts){
  const isGet=!opts||!opts.method||opts.method==='GET';
  const key=withLang(path);
  if(isGet&&_apiCache.has(key)){_net.started++;_net.done++;return JSON.parse(_apiCache.get(key));}
  _net.started++;
  try{const r=await fetch(API+key,opts);const j=await r.json();
    if(isGet&&r.ok&&!NO_CACHE.some(re=>re.test(path))) _apiCache.set(key,JSON.stringify(j));
    return j;}
  finally{_net.done++;}
}
let _loaderTimer=null;
function loaderHtml(){
  const rungs=Array.from({length:10},(_,i)=>`<span class="dna-rung" style="animation-delay:-${(i*0.16).toFixed(2)}s"><i></i><i></i></span>`).join('');
  return `<div class="dna-loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-s="${esc(String(_net.started))}" data-d="${esc(String(_net.done))}">
    <div class="dna-helix" aria-hidden="true">${rungs}</div>
    <div class="dna-bar"><div class="dna-fill"></div></div>
    <div class="muted dna-text">${esc(t('web.common.loading'))}</div></div>`;
}
function tickLoaders(){
  const els=document.querySelectorAll('.dna-loader');
  if(!els.length){clearInterval(_loaderTimer);_loaderTimer=null;return;}
  els.forEach(el=>{
    const s=_net.started-(+el.dataset.s||0), d=Math.min(s,_net.done-(+el.dataset.d||0));
    // Never backwards: a view that starts more requests after the first ones
    // return lowers the share, and a bar that shrinks reads as a fault. It
    // stops short of full until the view replaces it.
    const shown=Math.max(+el.dataset.p||0, s?Math.round(95*d/s):0);
    el.dataset.p=String(shown);
    const fill=el.querySelector('.dna-fill'); if(fill) fill.style.width=shown+'%';
    el.setAttribute('aria-valuenow',String(shown));
    const txt=el.querySelector('.dna-text');
    // A server started before this page was updated has no phrase for the count;
    // the plain word is shown then, never the catalogue's marker for a missing key.
    // The count only grows, as the bar does: «4 of 17» beside a bar at 71% was
    // true of both and read as a contradiction, because the total grows too.
    const parts=d?t('web.common.loading_parts',{done:d}):'';
    if(txt) txt.textContent=parts&&!parts.startsWith('⟦')?parts:t('web.common.loading');
  });
}

// the chart window: the last ~3 years, but never fewer than the last 3 points
function windowSeries(series){
  if(!series||series.length<=3) return series||[];
  const s=series.slice().sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  const latest=s[s.length-1].date;
  const cutoff=(parseInt(latest.slice(0,4),10)-3)+latest.slice(4);   // "2026-03" -> "2023-03"
  const within=s.filter(p=>p.date>=cutoff).length;
  return s.slice(-Math.max(3,within));
}
// `marks` (task 170): {ref_low, ref_high, target} — drawn only when a clinician's
// target exists, so every other sparkline stays exactly as it was. The corridor
// is a faint solid band and the target a dashed band or line in another colour:
// two kinds of «normal» on one chart must not share a stroke, or the reader
// cannot tell the laboratory's range from the treatment's aim.
function sparkline(series,win,marks){
  if(win!==false) series=windowSeries(series);
  if(!series||series.length<2) return '';
  const w=168,h=40,pad=5;
  const tg=marks&&marks.target;
  const ys=series.map(p=>p.value);
  // the scale stretches to the target so its line is on the chart, never to the
  // corridor — a wide reference range would flatten the series to a stroke
  const tv=tg?[tg.low,tg.high,tg.value].filter(v=>v!=null).map(Number):[];
  const mn=Math.min(...ys,...tv),mx=Math.max(...ys,...tv),rng=(mx-mn)||1;
  const X=i=>pad+(w-2*pad)*(i/(series.length-1));
  const Y=v=>h-pad-(h-2*pad)*((v-mn)/rng);
  const clampY=v=>Math.max(pad,Math.min(h-pad,Y(v)));
  const pts=series.map((p,i)=>`${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
  // points with the date on hover — the date each measurement was taken
  const dots=series.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${i===series.length-1?3.2:2.3}" fill="var(--accent)"><title>${esc(fmtDate(p.date))}: ${esc(fmtNum(p.value))}</title></circle>`).join('');
  let bands='', legend='';
  if(tg){
    const lo=marks.ref_low!=null?clampY(Number(marks.ref_low)):h-pad, hi=marks.ref_high!=null?clampY(Number(marks.ref_high)):pad;
    if(marks.ref_low!=null||marks.ref_high!=null)
      bands+=`<rect x="${pad}" y="${hi.toFixed(1)}" width="${w-2*pad}" height="${Math.max(0,lo-hi).toFixed(1)}" fill="var(--muted)" opacity=".14"/>`;
    const dash=(v)=>`<line x1="${pad}" x2="${w-pad}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--warning)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    if(tg.low!=null&&tg.high!=null)
      bands+=`<rect x="${pad}" y="${Y(Number(tg.high)).toFixed(1)}" width="${w-2*pad}" height="${Math.max(0,Y(Number(tg.low))-Y(Number(tg.high))).toFixed(1)}" fill="var(--warning)" opacity=".16"/>`;
    [tg.low,tg.high,tg.value].filter(v=>v!=null).forEach(v=>bands+=dash(Number(v)));
    legend=`<div class="sparkleg">${(marks.ref_low!=null||marks.ref_high!=null)?`<span class="lg-corr">▮ ${esc(t('web.target.lg_corridor'))}</span>`:''}<span class="lg-tg">╌ ${esc(t('web.target.lg_target'))} ${esc(targetSpec(tg))}</span></div>`;
  }
  const d0=series[0].date, dN=series[series.length-1].date;
  return `<div class="sparkwrap">
    <svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${bands}
      <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      ${dots}
    </svg>
    <div class="sparkdates"><span>${esc(fmtDate(d0))}</span><span>${esc(fmtDate(dN))}</span></div>
    ${legend}
  </div>`;
}
// The figures of a clinician's target as one token — «1–2», «≤2», «16.7» —
// the same four shapes the report prints, from the same catalogue keys.
function targetSpec(tg){
  const f=v=>String(Number(v));
  if(tg.low!=null&&tg.high!=null) return t('target.spec_range',{low:f(tg.low),high:f(tg.high)});
  if(tg.high!=null) return t('target.spec_max',{high:f(tg.high)});
  if(tg.low!=null) return t('target.spec_min',{low:f(tg.low)});
  if(tg.value!=null) return t('target.spec_value',{value:f(tg.value)});

function goalSetup(){

      const {ctx,chartArea:a,scales}=chart;

          y:{grid:GGRID,suggestedMin:m.min,suggestedMax:m.max,ticks:{color:"#a9a89f",maxTicksLimit:4}}}})}));

  [['fit','#gcFIT'],['la','#gcLA']].forEach(([k,sel])=>{ const d=C[k]; if(!d||!d.l||!d.l.length) return;

// ---------------- Focus of attention ----------------
// The single task the owner is concentrating on right now. The track shows the path
// "baseline -> now -> target"; the green zone is the stretch already covered.
// The levers are observations from the owner's own data, not prescriptions: the
// assistant does not change therapy.
const FCMARK={primary:'▶',secondary:'·',hypothesis:'?'};
function fcTrack(m){
  const lo=m.baseline, hi=m.target, cur=(m.mean_30!=null?m.mean_30:m.raw);
  if(lo==null||hi==null||cur==null) return '';
  const min=Math.min(lo,hi,cur), max=Math.max(lo,hi,cur), pad=(max-min)*0.15||1;
  const a=min-pad, b=max+pad, pc=v=>Math.max(0,Math.min(100,(v-a)/(b-a)*100));
  const better = m.dir!=='lower' ? cur>=lo : cur<=lo;
  const col = better? 'var(--good)':'var(--critical)';
  const z0=Math.min(pc(lo),pc(cur)), z1=Math.max(pc(lo),pc(cur));
  return `<div class="fctrack" title="${esc(t('web.focus.track_tip',{base:lo,now:cur,target:hi}))}">
      <div class="zn" style="left:${z0.toFixed(1)}%;width:${(z1-z0).toFixed(1)}%"></div>
      <div class="mk" style="left:${pc(lo).toFixed(1)}%"></div>
      <div class="mk" style="left:${pc(hi).toFixed(1)}%"></div>
      <div class="dt" style="left:${pc(cur).toFixed(1)}%;background:${col}"></div>
    </div>
    <div class="fcscale"><span>${esc(t('web.focus.baseline',{value:m.baseline_txt||lo}))}</span><span>${esc(t('web.focus.target',{value:m.target_txt||hi,unit:m.unit||''}))}</span></div>`;
}

  const levers=(f.levers||[]).slice().sort((x,y)=>({primary:0,secondary:1,hypothesis:2}[x.status]??3)-({primary:0,secondary:1,hypothesis:2}[y.status]??3));

        <div class="ti">${esc(l.title||'')} <span class="ex">· ${(l.expected||'').trim().startsWith('+')?esc(t('web.focus.expected_prefix')):''}${esc(l.expected||'—')}</span></div>

// ---------------- Overview ----------------
// ---- going to the tab that owns a block ------------------------------------
// `Overview` and `Second opinion` are compilations by design: they show pieces
// that another tab owns. The rule this encodes is that a compiled block never
// pretends to be the original — it names its owner and goes there on a click.
function goTab(key){const i=TABS.findIndex(x=>x[0]===key);if(i>=0)mount(i);}
function tabLink(key){return `<a href="#" class="tablink" data-goto="${esc(key)}">${esc(t('web.common.go_tab',{tab:t(key)}))}</a>`;}
function bindTabLinks(root){root.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{
  e.preventDefault();goTab(a.getAttribute('data-goto'));});}

async function viewOverview(root){
  const [g,o,sb,f,radar,mx,lim] = await Promise.all([api('/api/goal'), api('/api/overview'),
    overviewSourceBar(), api('/api/focus'), api('/api/radar'), api('/api/metrics'),
    api('/api/limits').catch(()=>({items:[]}))]);
  // Built from parts rather than one format string: a profile with no subject id
  // came out as «subject ?», and a count of unread genes needs its plural form.
  const parts=[];
  if(o.subject_id) parts.push(t('web.header.subject',{subject:o.subject_id}));
  parts.push(plural(o.medications_count,'count.prescriptions'));
  if(o.genome_gaps.length) parts.push(plural(o.genome_gaps.length,'count.genes_unread'));
  $('#subhead').textContent = parts.join(' · ');
  const doms=(radar.domains||[]).filter(d=>d.score!=null);
  const attention=doms.filter(d=>d.status==='warning'||d.status==='critical');
  const flagged=(o.flagged||o.high_flags||[]);
  // Ordered by priority rather than filtered by it: the tile counts every
  // pending suggestion, and the list prints the same ones.
  const PRI={high:0,moderate:1,low:2};
  const pending=(o.pending_suggestions||o.high_suggestions||[])
    .slice().sort((a,b)=>(PRI[a.priority]??3)-(PRI[b.priority]??3));
  const oa=dArrow(radar.overall_delta);
  const facts=[
    radar.overall!=null?factHtml(`${radar.overall}${radar.prev_overall!=null&&oa.txt?`<small style="color:${oa.col}">${esc(oa.txt)}</small>`:''}`,
      t('web.overview.fact_index'),scoreCls(radar.overall),'web.tab.second_opinion'):'',
    factHtml(`${o.abnormal_count}<small class="muted">/${o.markers_total}</small>`,t('web.overview.fact_abnormal'),o.abnormal_count?'c-critical':'','web.tab.labs'),
    factHtml(String(attention.length),t('web.overview.fact_systems'),attention.length?'c-warning':'c-good','web.tab.second_opinion'),
    factHtml(String(pending.length),t('web.overview.fact_tests'),'','web.tab.second_opinion'),
  ];
  const missing=((lim&&lim.items)||[]).filter(i=>i.kind==='profile');
  // The reading order (task 195): the numbers first, then the body as a whole,
  // what is outside the corridor now, what to take next, the one thing being
  // worked on, the goal — and the person's own profile and measurements last.
  // A precondition the profile lacks is the exception: it is said at the top,
  // because every number below it may depend on it.
  root.innerHTML = `${pageHead(t('web.tab.overview'),t('web.page.overview.q'),facts)}
    <div id="ov-missing"></div>
    <h2 class="section mt-0">${esc(t('web.body.title'))}</h2>
    <div id="ov-systems"></div>
    <h2 class="section">${esc(t('web.overview.red_h'))} <span class="muted">· ${esc(t('web.overview.red_window'))}</span>${tabLink('web.tab.labs')}</h2>
    ${o.stale_abnormal_count?`<div class="meta mb-2">${esc(t('web.overview.stale_hidden',{count:plural(o.stale_abnormal_count,'count.abnormal')}))}</div>`:''}
    <div id="ov-red"></div>
    <h2 class="section">${esc(t('web.overview.tests_h'))}${tabLink('web.tab.second_opinion')}</h2>
    <div id="ov-tests"></div>
    ${f&&f.available?`<h2 class="section">${esc(t('web.overview.focus_h'))}</h2><div id="ov-focus"></div>`:''}
    <h2 class="section">${esc((g&&g.title)||t('web.goal.title'))}${g&&g.as_of?` <span class="muted">· ${esc(t('web.goal.as_of',{date:fmtDate(g.as_of)}))}</span>`:''}</h2>
    <div id="ov-goal"></div>
    <h2 class="section">${esc(t('web.overview.person_h'))}</h2>
    <div id="ov-person"></div>
    <h2 class="section">${esc(t('web.overview.metrics_h'))}</h2>

  if(missing.length){

      ${missing.map(i=>`<div class="why mt-2">⚠ ${esc(i.what)}</div>`).join('')}</div>`;

  if(fill) fill.onclick=()=>{const pf=$('#mprof',root); if(pf){pf.classList.remove('hidden'); pf.scrollIntoView({behavior:'smooth',block:'center'});}};

  // `high_flags`: a value below its floor belongs here as much as one above.
  const red = $('#ov-red',root);
  const SHOWN=12;
  red.innerHTML = flagged.length
    ? markerTable(flagged.slice(0,SHOWN))+(flagged.length>SHOWN?`<div class="meta">${esc(t('web.overview.more_in_labs',{n:flagged.length-SHOWN}))}</div>`:'')

// The flag, taking the "at the edge" level into account (within range, but in the last
// 10 % before the wall of the corridor).
function flagOf(m){ return (m && m.near_limit && m.flag==='ok') ? FLAG.near : (FLAG[m&&m.flag]||FLAG.ok); }
function decisionNote(m, context){
  const ds=(m&&m.decisions)||[]; const hit=ds.filter(d=>d.crossed);
  if(hit.length) return hit.map(d=>`<div class="why" style="color:var(--critical)">❗${esc(t('web.decision.crossed',{label:d.label,sign:d.side==='high'?'≥':'≤',value:d.value}))} — ${esc(d.action||'')} <span class="muted">[${esc(d.source||'')}]</span></div>`).join('');
  if(context && ds.length){const d=ds[0];return `<div class="why muted">${esc(t('web.decision.not_reached',{value:d.value,label:d.label}))}</div>`;}
  return '';
}
function nearNote(m){
  const nl = m && m.near_limit; if(!nl || m.flag!=='ok') return '';
  const side = t(nl.side==='high' ? 'near.upper' : 'near.lower');
  const cp = nl.corridor_pct!=null ? ', '+t('web.near.corridor',{pct:nl.corridor_pct}) : '';
  const mv = nl.movement ? `; ${esc(nl.movement)}` : '';
  return `<span class="trend">${esc(t('web.near.margin',{pct:nl.margin_pct,side:side,bound:nl.bound}))}${esc(cp)}${mv}</span>`;
}
function refText(m){
  const base=(m.ref_low!=null&&m.ref_high!=null)?t('ref.range',{low:m.ref_low,high:m.ref_high})
    :(m.ref_high!=null?t('ref.max',{high:m.ref_high})
    :(m.ref_low!=null?t('ref.min',{low:m.ref_low}):''));
  // Whose corridor: the marker's recorded range answering for a form that
  // printed none is a weaker claim than the range printed beside the number.
  return base+(base&&m.ref_origin==='profile'?' '+t('ref.origin_profile'):'');
}

// ---------------- Labs ----------------
// Where a marker is going, in one span. It used to live inside `markerCard`, which
// meant the same marker said less about itself on «Second opinion» than on
// «Overview» — the movement that made it worth flagging was visible on one tab and
// not the other. A shared helper is the only way the two densities stay two
// densities rather than two answers.
function trendNote(m){
  if(m&&m.trend){const a={up:'↑',down:'↓',flat:'→'}[m.trend.direction];
    const pct=m.trend.pct!=null?` ${m.trend.pct>0?'+':''}${m.trend.pct}%`:'';
    return `<span class="trend">${a}${pct} (${esc(fmtDate(m.trend.from_date))} – ${esc(fmtDate(m.trend.to_date))})</span>`;}
  return nearNote(m);
}
function markerCard(m){
  const f = flagOf(m);
  const tr=trendNote(m);
  // The free-text notes under the corridor line, cut at three lines: a note of
  // twelve lines inside a card made the number the card is about hard to find.
  const notes=[m.note,m.corridor_note].filter(Boolean).join(' · ');
  return el(`<div class="card">
    <div class="label">${esc(m.name)}</div>
    <div class="value">${esc(fmtNum(m.value))} <small>${esc(m.unit)}</small></div>
    <div class="row">${badge(f.cls,t(f.key))}${m.date?`<span class="muted small" title="${esc(m.date)}">${esc(fmtDate(m.date))}</span>`:''}${tr}</div>
    ${m.series&&m.series.length>1?sparkline(m.series,undefined,m.target?{ref_low:m.ref_low,ref_high:m.ref_high,target:m.target}:null):''}
    <div class="meta">${esc(refText(m))}${targetText(m)}${m.genome_link?` · ${ownerNoteHtml(m)}`:''}${m.system?` · ${systemLinkHtml(m.system)}`:''}</div>
    ${noteHtml(notes,'meta')}

async function viewLabs(root){
  const [d,catR,sb,cfgR]=await Promise.all([api('/api/labs'),api('/api/markers'),sourceBar(['labs']),api('/api/source-config')]);
  // the series for the sparklines are pulled from the catalogue
  const cat=catR.markers;
  const docs=(cfgR.folders||{}).labs_docs;
  // Out of range first, furthest outside its corridor leading; everything inside
  // keeps the alphabetical order it had — and is folded (task 195): 370 cards of
  // values in range were most of the tab's 76 screens.
  const OUT={high:0,low:0};
  const dist=m=>{
    const v=Number(m.value);
    if(!isFinite(v)) return 0;
    if(m.flag==='high'&&m.ref_high!=null&&Number(m.ref_high)!==0)
      return (v-Number(m.ref_high))/Math.abs(Number(m.ref_high));
    if(m.flag==='low'&&m.ref_low!=null&&Number(m.ref_low)!==0)
      return (Number(m.ref_low)-v)/Math.abs(Number(m.ref_low));
    return 0;
  };
  const flagged=d.markers.filter(m=>m.flag in OUT).sort((a,b)=>dist(b)-dist(a));
  const rest=d.markers.filter(m=>!(m.flag in OUT));
  const latest=d.markers.map(m=>String(m.date||'')).sort().pop()||'';
  const facts=[
    factHtml(`${d.abnormal_count}<small class="muted">/${d.count}</small>`,t('web.labs.fact_abnormal'),d.abnormal_count?'c-critical':'c-good'),

    <div id="ingest-res" class="mb-3"></div>
    <div id="add-lab" class="hidden"></div>
    <div id="targets-box"></div>
    <h2 class="section">${esc(t('web.labs.out_h'))} <span class="muted">· ${flagged.length}</span></h2>
    <div class="grid" id="labgrid"></div>
    ${rest.length?`<details class="fold mt-4" id="labrest"><summary>${esc(t('web.labs.within_h',{n:rest.length}))}</summary><div class="grid mt-2" id="labrestgrid"></div></details>`:''}
    ${sb}`;
  renderTargets($('#targets-box',root), cat);
  const g = $('#labgrid',root);
  flagged.forEach(m=>g.appendChild(markerCard(m)));
  if(!flagged.length) g.innerHTML=emptyHtml(d.count?t('web.labs.none_out'):t('web.overview.no_red_nodata'));
  // Drawn when opened: the cards inside the corridor are built on the first open.
  const rd=$('#labrest',root);
  if(rd) rd.addEventListener('toggle',()=>{ const rg=$('#labrestgrid',root); if(rd.open&&!rg.childElementCount) rest.forEach(m=>rg.appendChild(markerCard(m))); });
  // the add form

    const r=await post('/api/pick-folder',{domain:'labs_docs'});

    if(r&&r.ok){toast(t('web.common.folder_chosen'));viewLabs($('#view'));}
    else toast(t('web.common.error_prefix')+((r&&r.error)||t('web.common.failed')));

    if(!r.ok){box.innerHTML=errorHtml(r.error||t('web.common.error'));return;}

// ---------------- Drug check ----------------
function refLink(d){return d.reference?` · <a href="${esc(d.reference)}" target="_blank" rel="noopener">RxNav ↗</a>`:'';}
// The verdict about the decision, and the classes of link that carry no rule.
// The page says them in the engine's words: a face that paraphrases a refusal is
// a face that will one day soften it.
function verdictLine(v){
  if(v.kind==='rule_fires')return t('decision.rule_fires',{genes:(v.genes||[]).join(', ')});
  if(v.kind==='rule_silent')return t('decision.rule_silent',{genes:(v.genes||[]).join(', ')});
  return t('decision.no_rule',{why:t('decision.why.'+(v.why||'no_pair'))});
}
// Four states, and none of them says a gene is absent: everybody has the gene.
// Read and matching the reference is a finding; held and unread is a gap; held
// nowhere is a statement about this build.
function variantStateLine(v){
  if(!v||!v.state)return '';
  if(v.state==='variant_called')return t('decision.variant.variant_called',{n:v.called||0});
  if(v.state==='no_variant_called'){
    const lo=v.depth_min,hi=v.depth_max;
    const span=(lo==null||hi==null)?'—':(lo===hi?lo+'\u00d7':lo+'\u2013'+hi+'\u00d7');
    let s=t('decision.variant.no_variant_called',{n:v.confirmed_ref||0,total:v.positions||0,depth:span});
    if(v.unread)s+='; '+t('decision.variant.and_unread',{n:v.unread});
    return s;
  }
  if(v.state==='not_read')return t('decision.variant.not_read',{n:v.positions||0});
  return t('decision.variant.no_positions');
}
function contextHtml(ctx){
  if(!ctx||!ctx.blocks)return '';
  let out='';
  for(const kind of ['mechanism','asked_about','no_variant'])
    for(const row of (ctx.blocks[kind]||[]))
      out+=`<div class="list-item"><div><b>${esc(row.gene)}</b> — ${esc(t('decision.kind.'+kind))}: ${esc(row.text||t('decision.not_written_yet'))}</div>`
         + (variantStateLine(row.variant)?`<div class="why muted">${esc(variantStateLine(row.variant))}</div>`:'')
         + `<div class="why muted">${esc(t('decision.source',{source:row.source}))}</div></div>`;
  for(const row of (ctx.named||[]))
    out+=`<div class="list-item"><div><b>${esc(row.gene)}</b> — ${esc(t('decision.kind.unassigned'))}</div>`
       + `<div class="why muted">${esc(t('decision.source',{source:row.source}))}</div></div>`;
  const cur=ctx.curated||{};
  if(!cur.asked)out+=`<div class="why muted">${esc(t('decision.no_context_list'))}</div>`;
  else if(cur.refused)out+=`<div class="why muted">${esc(t('decision.entries_without_source',{n:cur.refused}))}</div>`;
  return out;
}
// The same four states the engine has, in the same words. A page that reduces
// them to one grey line un-does the work of separating them.
function coverageLine(c){

  // 🧬 the patient's genome

  }else{

      const lvl=ge.cpic_level===t('web.rx.curated_value')?esc(t('source.local')):('CPIC '+esc(ge.cpic_level));
      let body;
      if(ge.computable){
        body=`${esc(t('web.rx.your_phenotype'))} <b>${esc(ge.phenotype)}</b>${ge.label?' — <span class="muted">'+esc(ge.label)+'</span>':''}`;
      }else{
        const mk=(ge.markers||[]).map(m=>`<code>${esc(m.rsid)}</code> ${esc(m.genotype||'')}`).join(', ');
        body=(mk?(esc(t('web.rx.your_variants'))+' '+mk+'<div class="meta mt-3">'+esc(ge.label||'')+'</div>'):'<span class="muted">'+esc(ge.label||'')+'</span>');
      }
      // How well this gene was read, under the answer about it. Silent only
      // when the gene is read like the rest of the file — and that is not the
      // same claim as «enough», which depends on a question we do not have.
      const cv=ge.coverage||{}, cvTxt=(cv.state&&cv.state!=='fine')?coverageLine(cv):'';
      return `<div class="list-item"><div class="row"><b>${esc(ge.gene)}</b> <span class="badge b-unknown">${lvl}</span>${ge.actionable?' '+badge('b-warning',t('web.rx.actionable')):''}</div><div class="why">${body}</div>${cvTxt?`<div class="why muted">${esc(cvTxt)}</div>`:''}</div>`;
    }).join('');
  }
  // 🧪 the patient's labs
  const lb=r.labs||{};
  let labsHtml;
  if(!lb.markers||!lb.markers.length){
    const lbb=lb.basis||{};
    labsHtml=!(lbb.classes||[]).length
      ?`<div class="muted">${esc(t('web.rx.labs_class_unknown'))}</div>`
      :(!(lbb.with_rules||[]).length
        ?`<div class="muted">${esc(t('web.rx.labs_no_rule',{classes:r.class_display||'—'}))}</div>`
        :`<div class="muted">${esc(t('web.rx.no_lab_control'))}</div>`);
  }else{
    labsHtml=lb.markers.map(m=>{const f=m.present?flagOf(m):FLAG.unknown;
      const val=m.present?`${m.value} ${esc(m.unit)}`:esc(t('web.rx.not_taken_yet'));
      return `<div class="list-item"><div class="row">${badge(f.cls,t(f.key))}<b>${esc(m.name)}</b> <span class="muted">${val}</span></div>${m.present?nearNote(m)+decisionNote(m,true):''}</div>`;}).join('');
    if(lb.reason)labsHtml=`<div class="meta mb-2">${esc(t('web.rx.monitor_while',{text:lb.reason}))}</div>`+labsHtml;
    if(lb.near&&lb.near.length)labsHtml=`<div class="why" style="margin-bottom:8px">🔵 ${t('web.rx.near_note',{names:'<b>'+esc(lb.near.map(w=>w.name).join(', '))+'</b>'})}</div>`+labsHtml;
    if(lb.watch&&lb.watch.length)labsHtml=`<div class="why" style="margin-bottom:8px;color:var(--warning)">⚠ ${t('web.rx.watch_note',{names:'<b>'+esc(lb.watch.map(w=>w.name).join(', '))+'</b>'})}</div>`+labsHtml;
  }
  // 🔗 interactions with the current prescriptions
  const inter=(r.interactions&&r.interactions.interactions)||[];
  let interHtml;
  if(inter.length){
    interHtml=inter.map(it=>{const s=SEV[it.severity]||SEV.low;
      return `<div class="list-item"><div class="row">${badge(s.cls,t(s.key))}<b>${esc(it.effect)}</b></div>
        <div class="why">${esc(t('web.rx.with_yours'))} <b>${esc((it.with_meds||[]).join(', ')||it.with_class)}</b> · ${esc(t('web.rx.mechanism',{text:it.mechanism||''}))}</div>
        <div class="spec">${esc(t('web.rx.what_to_do',{text:it.manage||''}))}</div></div>`;}).join('');
  }else if(r.interactions&&(r.interactions.status==='no_rules'||r.interactions.status==='unknown_class')){
    interHtml=`<div class="muted">${esc(r.interactions.message||'')}</div>`;
  }else{
    // Named, not merely counted: a comparison that skipped part of the list may not
    // print the same sentence as one that covered all of it.
    const unrec=((r.interactions||{}).baseline||{}).unclassified||[];
    interHtml=`<div class="muted">${esc(unrec.length
      ?t('web.rx.no_interactions_partial',{names:unrec.slice(0,6).join(', ')})
      :t('web.rx.no_interactions'))}</div>`;
  }
  // 🧬 ClinVar findings for this drug (drug_response and the rest)
  const cv=(r.clinvar&&r.clinvar.hits)||[];
  let cvHtml='';
  if(cv.length){
    cvHtml=cv.slice(0,12).map(h=>{
      const via=h.gene?t('web.rx.via_gene',{gene:h.gene}):t('web.rx.via_drug_name');
      const sig=clnsigText(h.clnsig);
      return `<div class="list-item"><div class="row"><code>${esc(isRsid(h.rsid)?h.rsid:'—')}</code> ${badge(h.tier==='pathogenic'?'b-critical':'b-warning',sig)} <span class="muted">${esc(t('web.rx.genotype',{genotype:h.genotype||'?'}))} · ${esc(via)}</span></div>${h.disease?`<div class="why">${esc(diseaseText(h.disease))}</div>`:''}</div>`;
    }).join('');
  }
  const cvSection=cvHtml?`<div class="so-h">${esc(t('web.rx.clinvar_h'))} <span class="muted">· ${esc(t('web.rx.clinvar_note'))}</span></div>${cvHtml}`:'';
  return `<div class="card mb-3">
      <div class="row"><b style="font-size:18px">${esc(t('web.rx.title',{drug:r.drug}))}</b> ${badge(ov.cls,t('web.rx.overall',{level:t(ov.key)}))}</div>
      <div class="meta mt-1">${esc(t('web.rx.class',{name:r.class_display||'—'}))} · ${idLine}</div>
      ${(r.unresolved&&r.unresolved.length)?`<div class="meta mt-2"><b>${esc(t('prescription.unresolved_h'))}</b><ul style="margin:4px 0 0;padding-left:18px">${r.unresolved.map(u=>`<li>${esc(u.gene?t('prescription.unresolved_gene',{detail:u.detail||u.what,gene:u.gene}):(u.detail||u.what))}</li>`).join('')}</ul></div>`:''}
    </div>
    ${flagsHTML(r.safety_flags)}
    <div class="so-h">${esc(t('web.rx.h_genome'))}</div>${genomeHtml}
    <div class="so-h">${esc(t('web.rx.h_labs'))}</div>${labsHtml}
    <div class="so-h">${esc(t('web.rx.h_meds'))}</div>${interHtml}
    ${cvSection}
    ${doseHTML(r.dose_context)}
    <div class="meta mt-3">${esc(r.disclaimer||'')}</div>`;
}
function flagsHTML(flags){
  if(!flags||!flags.length) return '';
  const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return flags.map(f=>{
    const red=f.severity==='red_flag';
    const rows=[['prescription.safety_factor',f.factor],
                ['prescription.safety_why',f.why_it_matters],
                ['prescription.safety_pro',f.what_is_known_in_favour],
                ['prescription.safety_unknown',f.uncertainty],
                ['prescription.safety_action',f.action],
                ['prescription.safety_source',f.source]]
      .filter(x=>x[1]).map(x=>`<li style="margin:3px 0">${bold(t(x[0],{text:x[1]}))}</li>`).join('');
    return `<div class="card" style="margin-bottom:14px;border-left:4px solid var(--${red?'critical':'warning'})">
      <div class="row"><b>${esc(t('prescription.safety_h'))}</b>${f.medication?` <span class="muted">· ${esc(f.medication)}</span>`:''}</div>
      <ul style="margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.5">${rows}</ul>
    </div>`;
  }).join('');
}
// Medicines, one tab (task 195, owner 14.09.2026): what is prescribed now, what

    <div id="m-form" class="hidden"><div class="form mb-3"><div class="fr">
      <label>${esc(t('web.meds.drug'))}<input id="m-name" placeholder="${esc(t('web.meds.drug_placeholder'))}"></label>
      <label>${esc(t('web.meds.dose'))}<input id="m-dose" placeholder="${esc(t('web.meds.dose_placeholder'))}" size="10"></label>
      <label>${esc(t('web.meds.comment'))}<input id="m-note" placeholder="${esc(t('web.meds.comment_placeholder'))}" size="18"></label>
      <label>${esc(t('web.meds.status'))}<select id="m-status">
        <option value="active">${esc(t('web.meds.status_active'))}</option>
        <option value="paused">${esc(t('web.meds.status_paused'))}</option>
        <option value="stopped">${esc(t('web.meds.status_stopped'))}</option>
      </select></label>
      <button class="act" id="m-add">${esc(t('web.meds.add'))}</button>

    <div id="m-check" class="mt-3"></div>
    <div id="mlist">${listHtml(cur,sys)||emptyHtml(t('web.meds.empty'))}</div>
    ${past.length?`<details class="fold mt-4"><summary>${esc(t('web.meds.past_h'))} · ${past.length}</summary><div class="mt-2">${listHtml(past,sys)}</div></details>`:''}
    ${sb}`;
  $('#m-toggle',root).onclick=()=>$('#m-form',root).classList.toggle('hidden');
  // the check of a drug by name
  $('#drug-go',root).onclick=doFull;
  $('#drug-pgx',root).onclick=doPgx;
  $('#drug-in',root).addEventListener('keydown',e=>{if(e.key==='Enter')doFull();});
  async function maybeDiag(d){
    // the drug was not found — check whether the network is to blame (SSL/certificates on a Mac)
    const pgx=d.pharmacogenetics||d;
    if(pgx&&pgx.status==='not_found'){
      const dg=await api('/api/diag');
      if(dg&&!dg.ok){
        return `<div class="card warnbox"><b>⚠ ${esc(t('web.diag.no_internet'))}</b>
          <div class="meta mt-2">${esc(t('web.diag.online_search_off'))} <code>${esc(dg.error||'')}</code></div>
          ${dg.hint?`<div class="meta mt-2">${esc(dg.hint)}</div>`:''}</div>`;
      }
    }
    return '';
  }
  async function doFull(){
    const name=$('#drug-in',root).value.trim();if(!name)return;
    showLoader($('#drug-res',root));
    const d=await api('/api/prescription-check?name='+encodeURIComponent(name));
    const diag=await maybeDiag(d);
    $('#drug-res',root).innerHTML=diag+rxCard(d);
  }
  async function doPgx(){
    const name=$('#drug-in',root).value.trim();if(!name)return;
    showLoader($('#drug-res',root));
    const d=await api('/api/drug?name='+encodeURIComponent(name));
    const diag=await maybeDiag(d);
    $('#drug-res',root).innerHTML=diag+pgxCard(d);
  }
  // adding a prescription: a second opinion on it first (interactions with the list)
  $('#m-add',root).onclick=async()=>{
    const name=$('#m-name',root).value.trim();if(!name){toast(t('web.meds.enter_name'));return;}
    const chk=await api('/api/prescription-check?name='+encodeURIComponent(name));
    const r=await post('/api/medications',{name,dose:$('#m-dose',root).value,note:$('#m-note',root).value,status:$('#m-status',root).value});
    if(!r.ok){toast(t('web.common.error_prefix')+(r.error||''));return;}
    toast(chk.overall&&chk.overall!=='low'?t('web.meds.added_attention'):t('web.common.added'));
    claimNotice(r);
    // refresh the list without losing the check that is on screen
    const [d2,sys2]=await Promise.all([api('/api/medications'), systemsIndex().catch(()=>null)]);
    $('#mlist',root).innerHTML=listHtml(d2.medications.filter(m=>m.current!==false),sys2)||emptyHtml(t('web.meds.empty'));

  };

    const r=await post('/api/medications/remove',{name:b.getAttribute('data-rm')});
    // A refusal is said, not swallowed: the button used to do nothing visible.
    if(r&&r.ok){toast(t('web.meds.removed'));viewMedicines($('#view'));}
    else toast(t('web.common.error_prefix')+((r&&r.error)||t('web.common.failed')));
  });}
  bindRemove();
}

// ---------------- Second opinion ----------------
const DSTAT={good:'var(--good)',warning:'var(--warning)',critical:'var(--critical)',nodata:'var(--muted)'};
function dArrow(dl){ // the delta of the score: ↑ better, ↓ worse
  if(dl==null||dl===0)return {txt:'',col:'var(--muted)',word:t('web.delta.unchanged')};
  return dl>0?{txt:'▲'+dl,col:'var(--good)',word:t('web.delta.better',{n:dl})}
             :{txt:'▼'+Math.abs(dl),col:'var(--critical)',word:t('web.delta.worse',{n:Math.abs(dl)})};
}

function systemLinkHtml(key, label){

// The genetics ring as two numbers: read and unread. `null` when the system
// has no composed genetic half — drawn as an absence, not as zero read.
function genRingOf(g){
  if(!g||g.status!=='composed') return null;
  const total=(g.read_count||0)+(g.unread_count||0);
  return {read:g.read_count||0, total:total, frac: total?(g.read_count||0)/total:0};
}
function genRingTip(g){
  if(g===undefined) return t('web.body.rings_loading');
  const r=genRingOf(g);
  // The scores, as a third line of the tip and never as a share of either
  // ring: mapped by the file, scored on this profile.
  const poly=(g&&g.polygenic&&g.polygenic.mapped)?'\n'+t('systems.polygenic',{scored:g.polygenic.scored||0,mapped:g.polygenic.mapped}):'';
  if(r) return t('system.ring.genetics',{read:r.read,total:r.total})+poly;
  const st=g&&g.status==='no_genetic_half'?t('systems.genetics.no_half'):t('systems.genetics.not_composed');
  return t('system.ring.genetics_none',{status:st})+poly;
}
// The common variation of a system as SCORES under their own head — never
// interleaved with the gene rows (task 178). The registers differ in density:
// the clinician's adds the model id, the evidence tier and the notes.
function systemPolygenicHtml(poly, register){
  if(!poly||!poly.status||poly.status==='no_genetic_half') return '';
  let b=`<div class="row-l" style="margin-top:8px"><b>${esc(t('system.polygenic.title'))}</b></div>`;
  if(poly.status!=='ok') return b+`<div class="row-l muted">${esc(poly.why||'')}</div>`;

    if(register==='clinician'){

  return b+`<div class="row-l muted"><i>${esc(poly.caveat||t('system.polygenic.caveat'))}</i></div>`;

// The genetic half as a TABLE, by chain link where the system has links and by

  const geneRow=g=>{

      +`<td>${geneStateBadge(g)}</td><td class="opt muted small">${esc((g.moi_codes||[]).join(', ')||'')}</td>`
      +`<td>${esc(short(g.text||g.file_says_text||''))}</td>`;
    const detail=`<div class="pnl k-c">${g.text?`<div class="pnl-text">${esc(g.text)}</div>`:''}`
      +`${g.file_says_text?`<div class="why muted">${esc(g.file_says_text)}</div>`:''}`
      +`${g.read===false?`<div class="why muted">${esc(t('system.row.unread',{why:g.read_why_text||g.read_why||'—'}))}</div>`:''}`
      +`${register==='clinician'?geneRowDetail(g):''}</div>`;
    return genTableRow(id,cells,detail);
  };
  let body='';
  // Groups (task 199): one row for N positions — name, count, level, one
  // sentence — opening into the members' own rows.
  const grouped=new Set();
  (gen.groups||[]).forEach(g=>{
    (g.positions||[]).forEach(rs=>grouped.add(rs));
    const id='grp:'+g.key;
    const st=g.states||{}; const stTxt=Object.keys(st).map(k=>`${t('system.panel.state.'+k)} ${st[k]}`).join(', ');
    const cells=`<td><b>${esc(g.label)}</b> <span class="muted small">${esc(plural(g.count||0,'count.positions'))}</span></td>`
      +`<td>${g.level?levelChip(g.level,g.level_short):''}</td><td class="muted small">${esc(stTxt)}</td><td class="opt"></td><td>${esc(short(g.text||''))}</td>`;
    const detail=`<div class="pnl k-b"><div class="pnl-text">${esc(g.text||'')}</div>`
      +(g.source?`<div class="why muted">${esc(t('decision.source',{source:g.source}))}</div>`:'')
      +`<table class="dt">${(g.members||[]).map(p=>`<tr><td><b>${esc(p.gene)}</b> <span class="muted small">${esc(p.rsid||'')}</span></td><td>${p.level?levelChip(p.level,p.level_short):''}</td><td>${pnlStateBadge(p)}</td><td>${esc(short(p.text||''))}${ladderHtml(p)}</td></tr>`).join('')}</table></div>`;
    body+=genTableRow(id,cells,detail);
  });
  const linked=states.filter(p=>p.link_text&&!grouped.has(p.rsid)), plain=states.filter(p=>!p.link_text&&!grouped.has(p.rsid));
  if(linked.length){
    const order=[];
    linked.forEach(p=>{ if(order.indexOf(p.link_text)<0) order.push(p.link_text); });
    order.forEach(link=>{
      body+=`<tr class="gengroup"><td colspan="5">${esc(link)}</td></tr>`
        +linked.filter(p=>p.link_text===link).map(posRow).join('');

  body+=plain.slice().sort((a,b)=>String(a.gene).localeCompare(String(b.gene))).map(posRow).join('');
  if(genes.length){
    body+=`<tr class="gengroup"><td colspan="5">${esc(t('web.gen.group_base',{n:genes.length}))}</td></tr>`
      +genes.map(geneRow).join('');
  }
  return `<div class="tblwrap"><table class="dt gentbl">${head}<tbody>${body}</tbody></table></div>`
    +`<div class="why muted">${esc(t('web.gen.table_hint'))}</div>`;
}
// The panel of a segment as a picture rather than a paragraph: a summary of
// the whole panel, the line «what to look at», a card per position where the
// named allele was found (coloured by the kind of link, the genotype as a chip,
// the author's expectation beside the measured value and the number of the
// question it raised), and the rest — not found, not read — folded by name.
// No verdict is drawn here: whether an expectation and a value agree is the
// question the card already asks, and it stays a question.
const PNL_KIND={guideline:'k-a',pair:'k-a',mechanism:'k-b',asked_about:'k-c'};
const PNL_KIND_BADGE={guideline:'b-warning',pair:'b-warning',mechanism:'b-near',asked_about:'b-unknown'};
function pnlStateBadge(p){
  // Taken by the reference (task 201): a value with its caveat inside the
  // sentence, never a reading — one muted badge, never the colour of a state.
  if(p.presumed) return badge('b-unknown',t('system.gen.state.presumed'),p.read_why_text||'');
  if(p.read!==true) return badge('b-unknown',t('system.panel.state.unread'),p.read_why_text||p.read_why||'');
  const st=p.state||'None';
  // Read from the file, the depth unverified: the state keeps its colour and a
  // second, muted badge says what is not known about it.
  if(p.depth_note) return badge(st==='hom'?'b-warning':st==='het'?'b-near':'b-unknown',t('system.panel.state.'+st))
    +' '+badge('b-unknown',t('system.gen.state.file_only'),p.depth_note);
  return badge(st==='hom'?'b-warning':st==='het'?'b-near':'b-unknown',t('system.panel.state.'+st));
}
function pnlExpect(ec,qn){
  if(!ec) return '';
  const dir=t('system.panel.dir.'+(ec.direction||'lower'));
  let s;
  if(ec.gap) s=t('system.panel.expect_gap',{name:ec.name||ec.marker,direction:dir});
  else{
    const mv=ec.from_value!=null?t('system.panel.movement',{from:fmtNum(ec.from_value),to:fmtNum(ec.value)}):'';
    s=t('system.panel.expect',{name:ec.name||ec.marker,direction:dir,value:ec.value!=null?fmtNum(ec.value):'—',unit:ec.unit||'',date:fmtDate(ec.date),position:t('system.panel.pos.'+(ec.position||'unknown')),movement:mv});
  }
  const pos=ec.gap?'b-unknown':ec.position==='within'?'b-good':ec.position==='unknown'?'b-unknown':'b-warning';
  return `<div class="pnl-exp">${badge(pos,s)}${qn?`<span class="muted">${esc(t('system.panel.question_ref',{n:qn}))}</span>`:''}</div>`;
}
function panelHtml(gen,card,register){
  // Every position of the panel as a card, by gene: found ones bright, the rest
  // muted with the sentence that says what «not found» means for this one — and
  // the scores of the system, folded. The conclusion, the comparison with the
  // measurements and the prescribing line are `genSummaryHtml`'s (task 195): one
  // place says them, and this is what sits under it when a reader asks for more.
  const states=gen.positions||[];
  if(!states.length) return '';
  const rows=(gen.rows||[]).filter(x=>x.unit==='position');
  const byId=Object.fromEntries(rows.map(x=>[x.gene+'|'+x.rsid,x]));
  const found=states.filter(p=>p.read===true&&(p.state==='het'||p.state==='hom'));
  const absent=states.filter(p=>p.read===true&&p.state==='absent');
  const unread=states.filter(p=>p.read!==true);
  const other=states.filter(p=>!found.includes(p)&&!absent.includes(p)&&!unread.includes(p));
  let h=`<div class="sys-sec">${esc(t('system.panel.h'))} <span class="muted small">· ${esc(t('system.panel.checked',{positions:plural(states.length,'count.positions')}))}</span></div>`;
  const cardOf=(p,dim)=>{const r=byId[p.gene+'|'+p.rsid]||{};
    return `<div class="pnl ${PNL_KIND[p.kind]||'k-c'}${dim?' pnl-dim':''}"><div class="pnl-head">${levelChip(p.level,p.level_short)}<b>${esc(p.gene)}</b> <span class="muted">${esc(p.rsid||'')}</span>${pnlStateBadge(p)}<span class="muted small">${esc(t('system.panel.kind.'+(p.kind||'unassigned')))}</span>${p.link_text?`<span class="muted small">· ${esc(t('system.panel.link',{link:p.link_text}))}</span>`:''}${r.signature==='open'?`<span class="muted small">· ${esc(t('system.row.signature_open'))}</span>`:''}</div>
      ${(p.text||r.text)?`<div class="pnl-text">${esc(p.text||r.text)}</div>`:''}${levelNoteHtml(p)}${routeHtml(p)}${underLoadHtml(p)}${ladderHtml(p)}${register==='clinician'?geneRowDetail(r):''}</div>`;};
  const byGene=list=>{const g={}; list.forEach(p=>{(g[p.gene]=g[p.gene]||[]).push(p);}); return Object.keys(g).sort().flatMap(k=>g[k]);};
  h+=byGene(found).map(p=>cardOf(p,false)).join('')+byGene(other).map(p=>cardOf(p,false)).join('')+byGene(absent).map(p=>cardOf(p,true)).join('')+byGene(unread).map(p=>cardOf(p,true)).join('');
  // the polygenic scores of the system, folded (owner, 14.09.2026)
  const poly=gen.polygenic||{};
  if(poly.status==='ok'&&(poly.rows||[]).length)
    h+=`<details class="pnl-fold"><summary>${esc(t('system.panel.polygenic_fold',{scored:poly.scored||0}))}</summary>${systemPolygenicHtml(poly,register)}</details>`;
  return h;
}
// The genetic half of one system, in the words a person reads (task 195): what

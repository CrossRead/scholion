// ---------------- Navigation ----------------
// Six tabs, and two pages in the menu (task 195, owner 14.09.2026). The Guide and
// the Assistant explain the product rather than the person, and nine tabs of one
// level took three rows on a phone. «Drugs» and «Prescriptions» were one subject
// under two names on two tabs; they are «Medicines» now. One list holds all eight
// pages so that every one of them is mounted the same way; MENU_KEYS says which
// of them live in the menu rather than on the bar.
const TABS=[
  ['web.tab.overview',viewOverview],['web.tab.second_opinion',viewSecond],
  ['web.tab.labs',viewLabs],['web.tab.genome',viewGenome],
  ['web.tab.medicines',viewMedicines],['web.tab.lifestyle',viewLifestyle],
  ['web.tab.guide',viewGuide],['web.tab.assistant',viewAssistant],
];
const MENU_KEYS=['web.tab.guide','web.tab.assistant'];
let current=0;
function buildNav(){
  $('#nav').innerHTML=TABS.map(([key],i)=>MENU_KEYS.includes(key)?'':`<button data-tab="${i}">${esc(t(key))}</button>`).join('');
  $('#nav').querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>mount(+b.dataset.tab));
  const mp=$('#menupanel');
  mp.innerHTML=TABS.map(([key],i)=>MENU_KEYS.includes(key)?`<button data-tab="${i}">${esc(t(key))}</button>`:'').join('')
    +`<button data-menu="check">${esc(t('web.menu.check_update'))}</button>`
    +`<button data-menu="recompute">${esc(t('web.menu.recompute'))}</button>`
    +`<div class="mnote">${esc(_version?t('web.header.build',{version:_version}):'')}</div>`
    +`<div class="mnote" id="mupd" hidden></div>`;
  mp.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>{closeMenu();mount(+b.dataset.tab);});
  // An update is found and installed outside the page — the app does not rewrite
  // itself — so the menu asks the registry on request and says the command; the
  // recompute an update may ask for is one click from the same place.
  $('[data-menu="check"]',mp).onclick=async e=>{
    e.stopPropagation();
    const out=$('#mupd',mp); out.hidden=false; out.textContent=t('web.menu.checking');
    const r=await askRegistry();
    out.textContent=r.text;
    // A newer build found here can be installed from here — after a confirmation,
    // into the environment this server runs from; the server says what it did.
    if(r.newer){
      const b=document.createElement('button'); b.className='act btn-sm mt-2'; b.textContent=t('web.menu.install');
      b.onclick=async ev=>{
        ev.stopPropagation();
        if(!confirm(t('web.menu.install_confirm',{latest:r.latest}))) return;
        b.disabled=true; out.textContent=t('web.menu.installing');
        const res=await post('/api/update',{confirm:true});
        out.textContent=(res&&(res.report||res.error))||t('web.common.failed');
      };
      out.appendChild(document.createElement('br')); out.appendChild(b);
    }
  };
  $('[data-menu="recompute"]',mp).onclick=()=>{closeMenu(); openRecompute();};
}
function closeMenu(){const mp=$('#menupanel'),mb=$('#menubtn'); if(mp) mp.hidden=true; if(mb) mb.setAttribute('aria-expanded','false');}
function mount(i){
  current=i;
  document.querySelectorAll('#nav button[data-tab],#menupanel button[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===i));
  const v=$('#view');showLoader(v);
  return TABS[i][1](v).catch(e=>v.innerHTML=errorHtml(t('web.common.error_prefix')+e.message));
}

// The parts of the page that live outside the tabs. Redrawn on a language switch, so
// that switching does not require a reload and does not lose the tab one is reading.
let _version=null;
let _synthetic=false;
function renderDemoBanner(){
  const b=$('#demobanner'); if(!b) return;
  b.hidden=!_synthetic;
  b.textContent=_synthetic?t('web.header.demo_banner'):'';
}
// The update note: shown when the data was last used with another build, until a
// person presses «Understood». Nothing is asked of the registry unless the person
// presses «Check for a newer version» — the one request, and it is theirs.
let _update=null;
// The one place the page asks the package registry, and only from a button a
// person pressed: the update note's and the menu's. Nothing is asked on load.
async function askRegistry(){
  const r=await api('/api/version/check').catch(()=>null);
  const key={offline:'version.check_offline',unreachable:'version.check_unreachable',newer:'version.check_newer',current:'version.check_current'}[r&&r.status]||'version.check_unreachable';
  return {text:t(key,{installed:(r&&r.installed)||_version||'—',latest:(r&&r.latest)||'—'}),
          newer:!!(r&&r.status==='newer'), latest:(r&&r.latest)||''};
}
function renderUpdateNote(){
  const box=$('#updatenote'); if(!box) return;
  const u=_update;
  if(!u||!u.changed){box.hidden=true;box.innerHTML='';return;}
  const pend=u.pending||[];
  const count=pend.length?t('web.update.pending',{entries:plural(pend.length,'count.entries')}):t('web.update.nothing');
  const items=pend.map(e=>`<div class="row-l"><b>v${esc(e.version)}</b> <span class="muted">${esc(e.date)}</span></div>`+
    (e.news||[]).map(n=>`<div class="row-l">✦ ${esc(t('version.news',{news:n}))}</div>`).join('')+
    (e.actions||[]).map(a=>`<div class="row-l">· ${a.manual?esc(t('version.by_hand',{condition:a.condition})):esc(t('version.run',{commands:(a.commands||[]).map(c=>'`'+c+'`').join(', '),condition:a.condition}))}</div>${a.text?`<div class="why muted">${esc(a.text)}</div>`:''}`).join('')).join('');
  box.hidden=false;
  box.innerHTML=`<div class="row"><b>${esc(t('web.update.note',{from:u.last_used,to:u.installed}))}</b> <span>${esc(count)}</span>
    ${pend.length?`<button class="ghost" id="upd-show">${esc(t('web.update.show'))}</button>`:''}
    <button class="act" id="upd-seen">${esc(t('web.update.seen'))}</button>
    <button class="ghost" id="upd-check">${esc(t('web.update.check'))}</button>
    <button class="ghost" id="upd-recompute">${esc(t('web.recompute.open'))}</button></div>
    <div id="upd-items" hidden>${items}</div><div id="upd-check-out" class="why"></div>`;
  const sh=$('#upd-show'); if(sh) sh.onclick=()=>{const it=$('#upd-items'); it.hidden=!it.hidden;};
  $('#upd-recompute').onclick=()=>openRecompute();
  $('#upd-seen').onclick=async()=>{await post('/api/version/seen',{}); _update=null; renderUpdateNote();};
  $('#upd-check').onclick=async()=>{$('#upd-check-out').textContent=(await askRegistry()).text;};
}
// Recompute after an update, and the genome steps the data lacks (task 183).
// The plan and the progress come from the server, and the progress is a file
// there: a reload finds a running job where it left it, and a terminal running
// `scholion recompute --status` sees the same numbers as this page.
let _recompute=null, _rcOpen=false, _rcDismissed=false, _rcTimer=null;
async function loadRecompute(){try{_recompute=await api('/api/recompute');}catch(e){_recompute=null;} renderRecompute();}
function openRecompute(){_rcOpen=true; _rcDismissed=false; loadRecompute(); const b=$('#recomputebox'); if(b) b.scrollIntoView({behavior:'smooth',block:'nearest'});}
function rcClock(s){s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}
function rcWhy(s){if(!s.why) return ''; const d=s.detail||{};
  return t('recompute.why.'+s.why,{file:d.file||'—',engine:d.engine||'—',domain:d.domain||'—',positions:typeof d.positions==='number'?plural(d.positions,'count.positions'):'—'});}
function rcStep(s){
  const head=s.kind==='by_hand'?t('recompute.step.by_hand',{condition:(s.conditions||[]).join('; ')}):s.command;
  const src=(s.versions||[]).length?t('recompute.from_releases',{versions:s.versions.map(v=>'v'+v).join(', ')}):t('recompute.from_data');
  const why=rcWhy(s);
  return `<div class="row-l"><b>${esc(head)}</b> — ${esc(t('recompute.state.'+s.state))}${why?': '+esc(why):''} <span class="muted">(${esc(src)})</span></div>`
    +(s.text&&(s.state==='by_hand'||s.state==='not_run_here')?`<div class="why muted">${esc(s.text)}</div>`:'');}
function rcJob(j){
  const steps=j.steps||[];
  let h=`<div class="why"><b>${esc(t('recompute.status.'+(j.status||'none'),{started:j.started||'—',finished:j.finished||'—'}))}</b></div>`;
  steps.forEach((s,i)=>{
    const pct=s.total?Math.min(100,Math.round(100*(s.done||0)/s.total)):(s.state==='done'?100:0);
    const parts=[t('recompute.progress.step',{i:i+1,n:steps.length,command:s.command})];
    if(s.total) parts.push(s.total>1000?t('recompute.progress.percent',{pct}):t('recompute.progress.items',{done:s.done||0,total:s.total}));
    if(s.item) parts.push(s.item);
    if(s.elapsed!=null) parts.push(t('recompute.progress.elapsed',{time:rcClock(s.elapsed)}));
    if(s.left!=null) parts.push(t('recompute.progress.left',{time:rcClock(s.left)}));
    parts.push(t('recompute.job_step.'+(s.state||'waiting')));
    h+=`<div class="row-l">${esc(parts.join(' · '))}</div><progress max="100" value="${esc(pct)}" style="width:100%;height:8px"></progress>`;
    const err=(s.summary||{}).error||(s.summary||{}).message||(s.summary||{}).reason;
    if(s.state==='failed'&&err) h+=`<div class="why">${esc(String(err))}</div>`;
  });
  if(j.backup) h+=`<div class="why muted">${esc(t('recompute.backup',{path:j.backup}))}</div>`;
  if(j.recorded) h+=`<div class="why">${esc(t('recompute.recorded',{version:j.recorded}))}</div>`;
  else if(j.not_recorded==='since_unknown') h+=`<div class="why">${esc(t('recompute.not_recorded_since_unknown'))}</div>`;
  return h;}
function rcAttention(p){
  if(!p||_rcDismissed) return false; const j=p.job||{};
  if(j.status==='running'||j.status==='interrupted') return true;
  const fp=rcFingerprint(p);
  return !!fp&&fp!==rcSeen();}
// What is ready to recompute RIGHT NOW, as one string. A finished job is not a
// reason to open anything: the panel used to reappear at full height on every
// reload after a run, showing the report of a run the person had just watched.
// Attention is owed to a step that is ready and has not been shown yet.
function rcFingerprint(p){
  return (p.steps||[]).filter(s=>s.source==='data'&&s.state==='ready')
    .map(s=>s.command).sort().join('|');}
function rcSeen(){try{return localStorage.getItem('scholion.rc.seen')||'';}catch(e){return '';}}
function rcRemember(p){try{localStorage.setItem('scholion.rc.seen',rcFingerprint(p));}catch(e){}}
function renderRecompute(){
  const box=$('#recomputebox'); if(!box) return; clearTimeout(_rcTimer);
  const p=_recompute;
  if(!p||!(_rcOpen||rcAttention(p))){box.hidden=true;box.innerHTML='';return;}
  const j=p.job||{}, running=j.status==='running', steps=p.steps||[];
  if(!_rcOpen&&!running&&j.status!=='interrupted'){
    box.hidden=false;
    box.innerHTML=`<div class="row"><b>${esc(t('web.recompute.h'))}</b> <span>${esc(t('web.recompute.pending',{steps:plural(p.ready||0,'count.steps')}))}</span>`
      +`<button class="ghost btn-sm" id="rc-open">${esc(t('web.recompute.open'))}</button>`
      +`<button class="ghost btn-sm" id="rc-later">${esc(t('web.recompute.later'))}</button></div>`;
    $('#rc-open').onclick=()=>{_rcOpen=true; renderRecompute();};
    $('#rc-later').onclick=()=>{rcRemember(p); _rcDismissed=true; box.hidden=true; box.innerHTML='';};
    return;
  }
  let h=`<div class="row"><b>${esc(t('web.recompute.h'))}</b> <span class="muted">${esc(t('web.recompute.cli'))}</span></div>`;
  if(j.status&&j.status!=='none') h+=rcJob(j);
  if(running) h+=`<div class="row"><button class="ghost" id="rc-stop">${esc(t('web.recompute.stop'))}</button></div>`;
  else{
    h+=steps.length?steps.map(rcStep).join(''):`<div class="why">${esc(t('recompute.nothing'))}</div>`;
    h+=`<div class="row">${p.ready?`<button class="act" id="rc-start">${esc(t('web.recompute.start'))}</button>`:''}<button class="ghost" id="rc-close">${esc(t('web.recompute.close'))}</button></div><div id="rc-out" class="why"></div>`;
  }
  box.hidden=false; box.innerHTML=h;
  const st=$('#rc-start'); if(st) st.onclick=async()=>{
    if(!confirm(t('web.recompute.confirm',{steps:plural(p.ready,'count.steps')}))) return;
    st.disabled=true;
    const r=await post('/api/recompute',{confirm:true});
    if(r&&r.started){_rcOpen=true; pollRecompute();}
    else{st.disabled=false; $('#rc-out').textContent=t(r&&r.reason==='busy'?'recompute.busy':'recompute.nothing_ready');}
  };
  const cl=$('#rc-close'); if(cl) cl.onclick=()=>{rcRemember(p); _rcOpen=false; _rcDismissed=true; box.hidden=true; box.innerHTML='';};
  const sp=$('#rc-stop'); if(sp) sp.onclick=async()=>{sp.disabled=true; await post('/api/recompute/stop',{});};
  if(running) _rcTimer=setTimeout(pollRecompute,1500);
}
async function pollRecompute(){
  let j;
  try{ j=await api('/api/recompute/status'); }catch(e){ _rcTimer=setTimeout(pollRecompute,3000); return; }
  if(j.status==='running'){ _recompute=Object.assign({steps:[]},_recompute||{},{job:j}); renderRecompute(); return; }
  try{ _recompute=await api('/api/recompute'); _update=await api('/api/version'); renderUpdateNote(); }catch(e){}
  _recompute=Object.assign({steps:[]},_recompute||{},{job:j}); _rcOpen=true; rcRemember(_recompute); renderRecompute();
  if(j.status==='finished'){ forgetAnswers(); _systems=null; _sources=null; try{ mount(current); }catch(e){} }
}
document.addEventListener('click',e=>{ if(e.target.closest('[data-recompute-open]')) openRecompute(); });
// A row of the genetic table opens into the card it used to be.
document.addEventListener('click',e=>{
  const tr=e.target.closest('tr.genrow'); if(!tr) return;
  const id=tr.getAttribute('data-genrow');
  const det=tr.parentNode.querySelector(`tr.gendet[data-gendet="${CSS.escape(id)}"]`);
  if(det){ det.hidden=!det.hidden; tr.classList.toggle('open',!det.hidden); }
});
function renderChrome(){
  renderDemoBanner();
  renderUpdateNote();
  $('#subhead').textContent=t('web.header.subtitle');
  const lb=$('#localbadge');
  lb.innerHTML='🔒 <span class="lb-text">'+esc(t('web.header.local_badge_short'))+'</span>';
  lb.title=t('web.header.local_badge')+' — '+t('web.header.local_badge_hint');
  $('#disclaimer').textContent=t('web.header.disclaimer');
  $('#ver').textContent=_version?t('web.header.build',{version:_version}):'';
  $('#langswitch').innerHTML=LANGS.map(c=>
    `<button class="pickbtn" data-lang="${esc(c)}" title="${esc(t('web.lang.'+c))}" aria-pressed="${c===LANG}">${esc(c.toUpperCase())}</button>`).join('');
  $('#menubtn').title=t('web.header.menu');
  $('#menubtn').setAttribute('aria-label',t('web.header.menu'));
}
async function switchLang(code){
  if(code===LANG) return;
  await loadLang(code);
  const u=new URL(location.href); u.searchParams.set('lang',LANG);
  history.replaceState(null,'',u.pathname+u.search+u.hash);
  forgetAnswers();                    // the answers were worded in the other language
  _sources=null;                      // the source chips are worded from the catalogue too
  _systems=null;                      // and so are the systems' labels
  renderChrome(); buildNav(); mount(current);
}

// picking a source folder from disk (the native macOS dialog) — a delegated handler
document.addEventListener('click',async e=>{
  if(!e.target.closest('.menu')) closeMenu();
  const cl=e.target.closest('.clamp'); if(cl) cl.classList.toggle('open');
  const pick=e.target.closest('[data-pick]');
  const clr=e.target.closest('[data-clear]');
  const lng=e.target.closest('[data-lang]');
  const sysl=e.target.closest('[data-system]');
  const pnl=e.target.closest('[data-panel]');
  if(pnl){ e.preventDefault(); viewPanel(pnl.getAttribute('data-panel')); return; }
  if(lng){ switchLang(lng.getAttribute('data-lang')); return; }
  // «system: X →» anywhere on the page — a marker card, a gene card, a
  // prescription — opens the system's card; one handler, every face of it.
  if(sysl){ e.preventDefault(); viewSystem(sysl.getAttribute('data-system')); return; }
  if(pick){
    const domain=pick.getAttribute('data-pick');
    pick.disabled=true;toast(t('web.common.opening_picker'));
    try{
      const r=await post('/api/pick-folder',{domain});
      if(r&&r.canceled){toast(t('web.common.canceled'));}
      else if(r&&r.ok){toast(t('web.common.folder_chosen'));_sources=null;mount(current);}
      else{toast(t('web.common.error_prefix')+((r&&r.error)||t('web.common.failed')));}
    }catch(err){toast(t('web.common.error_prefix')+err.message);}
    pick.disabled=false;
  }else if(clr){
    const domain=clr.getAttribute('data-clear');
    const r=await post('/api/clear-folder',{domain});
    if(r&&r.ok){toast(t('web.common.folder_reset'));_sources=null;mount(current);}
  }
});

(async function start(){
  // The catalogue is loaded BEFORE the first render: a page that flashes identifiers
  // and only then acquires words looks broken even when it is not.
  await loadLang(wantedLang());
  renderChrome();
  buildNav();
  {const lb=$('#localbadge');if(lb)lb.onclick=()=>goTab('web.tab.assistant');}
  {const mb=$('#menubtn'), mp=$('#menupanel');
   if(mb) mb.onclick=e=>{e.stopPropagation(); mp.hidden=!mp.hidden; mb.setAttribute('aria-expanded',String(!mp.hidden));};
   document.addEventListener('keydown',e=>{if(e.key==='Escape') closeMenu();});}
  mount(0);
  api('/api/ping').then(p=>{
    if(!p)return;
    if(p.version){_version=p.version;$('#ver').textContent=t('web.header.build',{version:_version});
      const mn=$('#menupanel .mnote:not(#mupd)'); if(mn) mn.textContent=t('web.header.build',{version:_version});}
    _synthetic=!!p.synthetic; renderDemoBanner();
  }).catch(()=>{});
  api('/api/version').then(u=>{_update=u; renderUpdateNote();}).catch(()=>{});
  loadRecompute();
})();
</script>

// not carry and one for what was not read, and whether the genotype and the
// measurements tell the same story — a question, never a verdict. The cards of
// every position, the composed list and the scores sit under it, folded.
function genSummaryHtml(gen, card){
  const st=gen.positions||[];
  if(!st.length){
    let why;
    if(gen.status==='composed') why=t('web.second.gen_list',{read:gen.read_genes||0,total:(gen.base||{}).genes||0,findings:gen.finding_count||0});
    else if(gen.status==='not_composed') why=t('system.genetics.not_composed',{why:gen.why_empty||t('screen.why.no_panel')});
    else why=t('screen.why.no_genetic_half');
    return `<div class="sys-sec">${esc(t('system.layer.genetics'))}</div><div class="gen-rest">${esc(why)}</div>`;
  }
  const rows=(gen.rows||[]).filter(x=>x.unit==='position');
  const byId=Object.fromEntries(rows.map(x=>[x.gene+'|'+x.rsid,x]));
  const found=st.filter(p=>p.read===true&&(p.state==='het'||p.state==='hom'));
  const absent=st.filter(p=>p.read===true&&p.state==='absent');
  const unread=st.filter(p=>p.read!==true);
  const foundGenes=new Set(found.map(p=>p.gene));
  const names=list=>{const c={}; list.forEach(p=>{const k=foundGenes.has(p.gene)?p.gene+' '+(p.rsid||''):p.gene; c[k]=(c[k]||0)+1;});
    return Object.keys(c).sort().map(g=>c[g]>1?g+' ×'+c[g]:g).join(', ');};
  let h=`<div class="sys-sec">${esc(t('system.panel.conclusion_h'))} <span class="muted small">· ${esc(t('web.second.gen_h',{found:found.length,positions:plural(st.length,'count.positions')}))}</span></div>`;
  h+=found.map(p=>{const r=byId[p.gene+'|'+p.rsid]||{}; const txt=String(p.text||r.text||'');
    return `<div class="gen-find">${levelChip(p.level,p.level_short)}<b>${esc(p.gene)}</b>${pnlStateBadge(p)}<span class="txt${txt.length>160?' clamp':''}">${esc(txt)}</span>${badge(PNL_KIND_BADGE[p.kind]||'b-unknown',t('system.panel.kind.'+(p.kind||'unassigned')))}</div>`;}).join('');
  if(absent.length) h+=`<div class="gen-rest">${esc(t('web.second.gen_absent',{genes:names(absent)}))}</div>`;
  if(unread.length) h+=`<div class="gen-rest">${esc(t('web.second.gen_unread',{genes:names(unread)}))}</div>`;
  // Positions read as «not read» only because the catalogue positions were never
  // genotyped from the alignment: the step that closes it, where the gap is seen.
  const assumed=st.filter(x=>x.read===false&&x.read_why==='assumed_ref').length;
  if(assumed) h+=`<div class="gen-rest">${esc(t('system.genetics.assumed_ref_hint',{positions:plural(assumed,'count.positions')}))} <button class="ghost btn-sm" data-recompute-open>${esc(t('web.recompute.open'))}</button></div>`;
  const qs=(card.questions||{}).rows||[];
  const qnum=Object.fromEntries(qs.map((q,i)=>[(q.gene||'')+'|'+(q.rsid||''),i+1]));
  const cmp=found.filter(p=>(byId[p.gene+'|'+p.rsid]||{}).expect_check);
  let m;
  if(cmp.length) m=cmp.map(p=>`<div class="mt-1"><b>${esc(p.gene)}</b> ${pnlExpect(byId[p.gene+'|'+p.rsid].expect_check,qnum[p.gene+'|'+p.rsid])}</div>`).join('');
  else{
    // The expectations the panel holds for alleles this person does not carry:
    // the check happened, and this is what did not apply (owner, 14.09.2026).
    const na={}; absent.filter(p=>p.expect).forEach(p=>{const k=p.expect.name||p.expect.marker; (na[k]=na[k]||[]).push(p.gene+' '+(p.rsid||''));});
    m=esc(t('system.panel.compare_none'))+Object.keys(na).sort().map(k=>`<div class="muted small mt-1">${esc(t('system.panel.compare_absent',{name:k,positions:na[k].join(', ')}))}</div>`).join('');
  }
  h+=`<div class="match"><b>${esc(t('system.panel.compare_h'))}.</b> ${m}</div>`;
  // What a guideline weighs when a drug is chosen. Not a prescription, and
  // nothing here says a drug is being taken.
  const rx=found.filter(p=>p.kind==='guideline'||p.kind==='pair');
  if(rx.length) h+=`<div class="gen-rest">${esc(t('system.panel.prescribing_h'))}: ${esc(rx.map(p=>p.gene).join(', '))} · ${esc(t('system.panel.prescribing_note'))}</div>`;
  return h;
}
function systemGeneRow(r, register){
  const mode=t('system.mode.'+(r.mode||'unknown'));
  const head = r.unit==='position'
    ? t('system.row.position',{gene:r.gene,rsid:r.rsid||'—',mode:mode,state:t('system.state.'+(r.state||(r.genotype||{}).state||'None'))})
    : t('system.row.gene',{gene:r.gene,mode:mode,classifications:(r.classifications||[]).join(', ')||'—',
                           moi:(r.moi_codes||[r.moi||'—']).join(', ')});
  const marks=[];
  if(r.findings) marks.push(t('system.row.finding',{n:r.findings}));
  if(r.carrier) marks.push(t('system.row.carrier'));
  if(r.pending) marks.push(t('system.row.pending'));
  if(r.signature==='open') marks.push(t('system.row.signature_open'));
  if(r.read===false) marks.push(t('system.row.unread',{why:r.read_why_text||r.read_why||'—'}));
  if(r.unit==='position'&&!r.level) marks.unshift(t('system.row.level_none'));
  if(r.needs_confirmation) marks.push(t('system.row.needs_confirmation'));
  if(r.not_a_finding_why==='level') marks.push(t('system.row.not_finding_level'));
  if(r.not_a_finding_why==='kind') marks.push(t('system.row.not_finding_kind',{kind:t('system.kind.'+(r.kind||'unassigned'))}));

    + (marks.length?` <span class="muted">· ${esc(marks.join(' · '))}</span>`:'')+`</div>`;
  if(r.text) out+=`<div class="why">${esc(r.text)}</div>`;
  if(r.file_says_text) out+=`<div class="why muted">${esc(r.file_says_text)}</div>`;
  out+=ladderHtml(r);
  if(register==='clinician') out+=geneRowDetail(r);
  return out+`</div>`;
}
// A system's long panel and its ratios (task 200): shown, never scored. A ratio

      +cr.adds_nothing.map(line).join('');
  }
  return h;
}
// The seven layers in the order of the brief, every one of them present — with
// its rows or with the reason it is empty — and the three baskets after them.
function systemCardHtml(r){
  const L=[]; const layer=(n,key,body)=>L.push(`<div class="layer"><h3>${n}. ${esc(t(key))}</h3>${body}</div>`);
  if(r.on_demand){
    // A panel without a radar domain (task 199 F): no score, no figure, the
    // same rows through the same gate — and the reason at the top. The
    // laboratory layers do not exist for it and are not drawn.
    L.push(`<div class="layer"><h3>${esc(t('system.on_demand.head'))}</h3><div class="why">${esc(t('system.on_demand.why',{why:r.why_no_domain||'—'}))}</div>`
      +(r.unread_line?`<div class="why muted">${esc(r.unread_line)}</div>`:'')+`</div>`);
    const gen=r.genetics||{};
    let b=genSummaryHtml(gen,r)+genTableHtml(gen,r,r.register);
    L.push(`<div class="layer"><h3>${esc(t('system.layer.on_demand_genetics'))}</h3>${b}</div>`);
    return L.join('');
  }
  const lab=r.labs||{};
  let b='';
  if(lab.status==='absent') b=`<div class="row-l">${esc(t('system.labs.absent'))}</div>`;
  else if(lab.status==='nodata') b=`<div class="row-l">${esc(t('system.labs.nodata',{total:lab.total||0}))}</div>`;
  else{
    b=`<div class="row-l">${esc(t('system.labs.line',{score:lab.score,level:t('system.level.'+(lab.level||'nodata')),measured:lab.measured||0,total:lab.total||0}))}</div>`;
    b+=(lab.abnormal||[]).map(m=>`<div class="row-l">${badge((FLAG[m.flag]||FLAG.ok).cls,t((FLAG[m.flag]||FLAG.ok).key))} <b>${esc(m.name)}</b>: ${esc(fmtNum(m.value))} ${esc(m.unit||'')} <span class="muted" title="${esc(m.date||'')}">${esc(fmtDate(m.date))}</span></div>`).join('');
  }
  if((lab.missing||[]).length) b+=`<div class="row-l muted">${esc(t('system.labs.missing',{markers:(lab.missing_names||lab.missing).join(', ')}))}</div>`;
  if((lab.stale||[]).length) b+=`<div class="row-l muted">${esc(t('system.labs.stale',{markers:lab.stale.map(s=>s.name||s.key).join(', ')}))}</div>`;
  if(lab.panel_term) b+=`<div class="row-l">${esc(t('system.panel_labs.term',{outside:lab.panel_term.outside,judged:lab.panel_term.judged,score:lab.panel_term.score}))}</div>`;
  b+=panelLabsHtml(lab.panel);
  layer(1,'system.layer.labs',b);
  const dyn=r.dynamics||{};
  if(dyn.status==='ok'){
    const d=dyn.delta||0;
    b=`<div class="row-l">${esc(t('system.dynamics.line',{prev:dyn.prev_score,score:dyn.compared_score,delta:(d>0?'+':'')+d,date:fmtDate(dyn.prev_date)||'—',compared:dyn.compared||0}))}</div>`
     +(dyn.moved||[]).map(m=>`<div class="row-l">· ${esc(t('system.dynamics.moved',{name:m.name,from_value:m.from_value,to_value:m.to_value,unit:m.unit||''}))}</div>`).join('');
  } else b=`<div class="row-l">${esc(t('system.dynamics.'+(dyn.status||'absent')))}</div>`;
  layer(2,'system.layer.dynamics',b);
  const gen=r.genetics||{};
  // The genotype of the system first, in the words a person reads; the list it
  // was composed from, every position's card and the scores fold under it —
  // open in the clinician's register, where they are the point.
  const summary=genSummaryHtml(gen,r);
  b='';
  if(gen.status==='composed'){
    const base=gen.base||{};
    b=`<div class="row-l">${esc(t('system.genetics.composed',{source:base.source||'—',version:base.version||'—',base_genes:base.genes||0,positions:(gen.curated||{}).positions||0,read_genes:gen.read_genes||0,read_positions:gen.read_positions||0,findings:gen.finding_count||0,carriers:gen.carrier_count||0,pending:gen.pending_count||0}))}</div>`
      +(gen.signature_author_count?`<div class="row-l">${esc(t('system.genetics.signature_author',{n:gen.signature_author_count,date:gen.signature_author_date||'—'}))}</div>`:'')
      +(gen.signature_open_count?`<div class="row-l">${esc(t('system.genetics.signature_open',{n:gen.signature_open_count}))}</div>`:'')
      +(gen.level_counts?`<div class="row-l">${esc(t('system.genetics.levels',{levels:['A','B','C','D','E'].filter(k=>gen.level_counts[k]).map(k=>k+' — '+gen.level_counts[k]).join(', ')||'—',none:gen.level_counts.none||0}))}</div>`:'');
    if(gen.withheld_by_classification) b+=`<div class="row-l muted">${esc(t('system.genetics.withheld',{n:gen.withheld_by_classification}))}</div>`;
    if((gen.excluded||[]).length) b+=`<div class="row-l muted">${esc(t('system.genetics.excluded',{genes:gen.excluded.map(e=>e.gene).join(', ')}))}</div>`;
    if((gen.refused||{}).total) b+=`<div class="row-l muted">${esc(t('system.genetics.refused',{n:gen.refused.total}))}</div>`;
    (gen.unreadable||[]).forEach(u=>{ b+=`<div class="row-l">${esc(t('system.genetics.unreadable',{gene:u.gene,reason:u.reason||'—'}))}</div>`; });
    b+=genTableHtml(gen,r,r.register);
    if(gen.rows_withheld_as_detail) b+=`<div class="row-l muted">${esc(t('system.row.patient_withheld',{n:gen.rows_withheld_as_detail}))}</div>`;
  }
  if(!(gen.positions||[]).length) b+=systemPolygenicHtml(gen.polygenic, r.register);
  b=summary+(b?`<details class="fold"${r.register==='clinician'?' open':''}><summary>${esc(t('web.system.genetics_detail'))}</summary>${b}</details>`:'');
  layer(3,'system.layer.genetics',b);
  b=correctionRoutesHtml(r.correction_routes);
  // Not a numbered layer: the seven layers are the brief's own frame, and this
  // block answers a decision that is not the product's to make.
  if(b) L.push(`<div class="layer"><h3>${esc(t('system.routes.layer'))}</h3>${b}</div>`);
  const med=r.medications||{};
  b=(med.rows||[]).map(m=>`<div class="row-l">· ${esc(t('system.meds.row',{name:m.name,dose:m.dose||'',classes:(m.via||[]).join(', ')}))}</div>`).join('');
  if(med.empty_reason) b+=`<div class="row-l muted">${esc(med.empty_reason)}</div>`;
  if((med.unmapped||[]).length) b+=`<div class="row-l muted">${esc(t('system.meds.unmapped',{names:med.unmapped.map(x=>x.name).join(', ')}))}</div>`;
  if((med.unclassified||[]).length) b+=`<div class="row-l muted">${esc(t('system.meds.unclassified',{names:med.unclassified.map(x=>x.name).join(', ')}))}</div>`;
  layer(4,'system.layer.medications',b);
  const tg=r.target||{};
  b=(tg.rows||[]).map(x=>{
    if(!x.current) return `<div class="row-l">· ${esc(t('system.target.no_value',{name:x.name,spec:x.spec,unit:x.unit||'',set_by:x.set_by||'',set_on:x.set_on||''}))}</div>`;
    const side=x.outside_target?t(x.side==='above'?'target.side_above':'target.side_below'):t('system.target.within');
    return `<div class="row-l">· ${esc(t('system.target.row',{name:x.name,spec:x.spec,unit:x.unit||'',set_by:x.set_by||'',set_on:x.set_on||'',value:x.current.value,date:x.current.date||'—',side:side}))}</div>`;
  }).join('');
  if(tg.empty_reason) b+=`<div class="row-l muted">${esc(tg.empty_reason)}</div>`;
  layer(5,'system.layer.target',b);
  const tests=r.tests||{};
  b=(tests.rows||[]).map(s=>testItem(s).outerHTML).join('');
  if(tests.empty_why) b+=`<div class="row-l muted">${esc(t('system.why.'+tests.empty_why))}</div>`;
  layer(6,'system.layer.tests',b);
  const qs=r.questions||{};
  b=(qs.rows||[]).length?`<ol>${qs.rows.map(q=>`<li>${esc(q.text)}</li>`).join('')}</ol>`:'';
  if(qs.empty_why) b+=`<div class="row-l muted">${esc(t('system.why.'+qs.empty_why))}</div>`;
  layer(7,'system.layer.questions',b);
  const nxt=r.next||{};
  b=['lab','genome','ask'].map(k=>{const bk=nxt[k]||{};
    return `<div class="basket"><h4>${esc(t('system.next.'+k))}</h4>${(bk.rows||[]).map(basketRowHtml).join('')}${bk.empty_reason?`<div class="row-l muted"><i>${esc(bk.empty_reason)}</i></div>`:''}${(bk.full_genome&&bk.full_genome.text)?`<div class="row-l">${esc(bk.full_genome.text)}</div>`:''}</div>`;}).join('');
  L.push(`<div class="layer"><h3>${esc(t('web.system.next_h'))}</h3>${b}</div>`);
  return L.join('');
}

    <div class="meta mt-4">${esc(r.disclaimer||'')}</div>

// ── The figure on the Overview ───────────────────────────────────────────────
// The same numbers the radar draws, plus the one it cannot show. A point on the
// radar says how a system scores; the ring around an organ says how much of that
// system was measured at all. Liver at 100/100 on one marker out of three is the
// case this exists for: on the radar it sits at the edge of the web, on the body
// it is a ring closed a third of the way round.
//
// Only three of the systems have a place on a body. The rest say so instead of
// being scattered onto organs they do not belong to — `knowledge/body_map.json`
// holds that decision with a reason beside each entry, and the engine sends it
// down with the radar, so nothing anatomical is decided in this file.
const SILHOUETTE = {male:{f:'/body-male.webp',w:245,h:440},
                    female:{f:'/body-female.webp',w:220,h:440}};
// Fractions of the silhouette's own box, so the marks follow whichever figure is
// drawn. Approximate on purpose: this is a schematic, not an atlas, and the
// callout carries the number that actually matters.
const ORGAN_SPOT = {pituitary:[[0.470,0.095]], thyroid:[[0.500,0.250]],
                    heart:[[0.540,0.365]],
                    liver:[[0.318,0.430]], pancreas:[[0.530,0.480]],
                    adrenals:[[0.392,0.565],[0.608,0.565]],
                    kidneys:[[0.392,0.665],[0.608,0.665]],
                    gonads:[[0.500,0.800]]};

function bodySVG(domains, sex){
  const im = SILHOUETTE[sex];
  // No third silhouette exists and the profile may not say. Refusing to draw is
  // the same answer this application gives everywhere else it does not know.
  if(!im) return `<div class="nosex">${esc(t('web.body.no_sex'))}</div>`;
  const W=700,H=470,x0=(W-im.w)/2,y0=14;
  const at=([fx,fy])=>[x0+fx*im.w, y0+fy*im.h];
  let defs=`<mask id="silh" mask-type="alpha"><image href="${im.f}" x="${x0}" y="${y0}"`
    +` width="${im.w}" height="${im.h}"/></mask>`
    +`<filter id="silhedge"><feMorphology operator="dilate" radius="1.6"/></filter>`
    +`<filter id="silhsoft" x="-70%" y="-70%" width="240%" height="240%">`
    +`<feGaussianBlur stdDeviation="10"/></filter>`;
  ['good','warning','critical'].forEach(st=>{
    defs+=`<radialGradient id="gl-${st}">`
      +`<stop offset="0" stop-color="${DSTAT[st]}" stop-opacity="1"/>`
      +`<stop offset="45%" stop-color="${DSTAT[st]}" stop-opacity=".42"/>`
      +`<stop offset="100%" stop-color="${DSTAT[st]}" stop-opacity="0"/></radialGradient>`;});
  let s=`<defs>${defs}</defs>`
    +`<g filter="url(#silhedge)"><rect class="bodyedge" x="0" y="0" width="${W}" height="${H}"`
    +` mask="url(#silh)"/></g>`
    +`<rect class="bodyfill" x="0" y="0" width="${W}" height="${H}" mask="url(#silh)"/>`;
  // One mark per place rather than per system. A system whose markers are made in
  // different glands cannot honestly be drawn at one point, so the engine hands
  // it `parts` — a place, and the score of the markers made there — and each part
  // gets its own mark. Two marks landing on the same organ are drawn as rings
  // about one centre with their labels stacked, so neither hides under the other.
  const marks=[];
  domains.forEach(d=>{
    const pl=d.place||{};
    if(pl.parts) pl.parts.forEach(p=>{
      if(p.score!=null&&ORGAN_SPOT[p.place])
        marks.push({dom:d, place:p.place, label:p.label, score:p.score, status:p.status,
                    measured:p.measured, total:p.total, part:true});
    });
    else if(pl.place&&d.score!=null&&ORGAN_SPOT[pl.place])
      marks.push({dom:d, place:pl.place, label:d.label, score:d.score, status:d.status,
                  measured:d.measured, total:d.total, part:false});
  });
  const byPlace={}, order=[];
  marks.forEach(m=>{ if(!byPlace[m.place]){byPlace[m.place]=[]; order.push(m.place);}
                     byPlace[m.place].push(m); });
  // Geometry first, drawing second. Seven places on one figure put the callouts
  // of two neighbouring organs on the same line, and a label covering a label
  // hides a number — the one thing this picture exists to show. So every mark is
  // measured, each side is laid out top to bottom with a minimum gap, and only
  // then is anything drawn. The leader line takes up the difference.
  const R0=20, STEP=8, GAP=38;
  const placed=[];
  order.forEach(place=>{
    const P=ORGAN_SPOT[place].map(at);
    const right = P[P.length-1][0] >= x0+im.w/2;
    const [rx,ry] = right ? P[P.length-1] : P[0];
    byPlace[place].forEach((m,i)=>{
      placed.push(Object.assign({}, m, {P:P, right:right, rx:rx, ry:ry,
        r:R0+i*STEP, blobr:(P.length>1?22:32)+i*STEP, want:ry-12+i*GAP}));
    });
  });
  [true,false].forEach(side=>{
    const col=placed.filter(m=>m.right===side).sort((a,b)=>a.want-b.want);
    let prev=-1e9;
    col.forEach(m=>{ m.ly=Math.max(m.want, prev+GAP); prev=m.ly; });
  });
  placed.forEach(m=>{
    const d=m.dom, r=m.r, C=2*Math.PI*r, right=m.right, rx=m.rx, ry=m.ry, ly=m.ly;
    const frac = m.total ? Math.max(0,Math.min(1,m.measured/m.total)) : 0;
    const col = DSTAT[m.status]||DSTAT.nodata;
    const tip = (m.part
      ? t('web.body.tip_part',{dom:d.label, label:m.label, place:t('web.body.place.'+m.place),
                               score:m.score, measured:m.measured, total:m.total})
      : (m.measured!=null && m.measured<m.total
          ? t('web.radar.tip_partial',{label:d.label,score:m.score,ok:d.ok,
                                       measured:m.measured,total:m.total})
          : t('web.radar.tip',{label:d.label,score:m.score,ok:d.ok,total:m.total})))
      +'\n'+genRingTip(d.genetics)+'\n'+t('system.open');
    let g=`<g class="organ" data-dom="${esc(d.key)}" tabindex="0" role="button"`
      +` aria-label="${esc(m.label)}"><title>${esc(tip)}</title>`;
    m.P.forEach(([x,y])=>{g+=`<circle class="blob" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"`
      +` r="${m.blobr}" fill="url(#gl-${m.status})" filter="url(#silhsoft)"/>`;});
    g+=`<circle class="ringbg" cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${r}"/>`
      +`<circle class="ringfg" cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${r}" stroke="${col}"`
      +` stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}"`
      +` transform="rotate(-90 ${rx.toFixed(1)} ${ry.toFixed(1)})"/>`
      +genRingSVG(d.genetics, rx, ry, r+4)
      +`<circle class="pick" cx="${rx.toFixed(1)}" cy="${ry.toFixed(1)}" r="${r+9}"/>`;
    const ex = right ? x0+im.w+30 : x0-30, lx = right ? ex+10 : ex-10;
    const an = right ? '' : ' text-anchor="end"';
    g+=`<path class="organlead" d="M${(rx+(right?r:-r)).toFixed(1)} ${ry.toFixed(1)}`
      +` L${ex.toFixed(1)} ${ly.toFixed(1)} L${(right?ex+4:ex-4).toFixed(1)} ${ly.toFixed(1)}"/>`
      +`<circle fill="var(--baseline)" cx="${(right?ex+4:ex-4).toFixed(1)}" cy="${ly.toFixed(1)}" r="2"/>`
      +`<text x="${lx.toFixed(1)}" y="${(ly-5).toFixed(1)}"${an} fill="var(--ink)" font-size="13"`
      +` font-weight="600">${esc(m.label)}</text>`
      +`<text x="${lx.toFixed(1)}" y="${(ly+12).toFixed(1)}"${an} fill="${col}" font-size="12.5">`
      +`${esc(m.score+'/100 · '+t('web.body.of',{measured:m.measured,total:m.total}))}</text></g>`;
    s+=g;
  });

// The genetics ring, drawn OUTSIDE the laboratory ring and never merged with it.
// A system with no composed genetic half gets a dotted absence rather than an
// empty ring: «nothing read» and «nothing to read» are different facts.
function genRingSVG(g, cx, cy, r){
  if(g===undefined) return '';          // still on its way: drawn when the listing arrives
  const gr=genRingOf(g);
  const at=`cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}"`;
  if(!gr) return `<circle class="ringgen-none" ${at}/>`;
  const C=2*Math.PI*r;
  return `<circle class="ringgen-bg" ${at}/><circle class="ringgen" ${at}`
    +` stroke-dasharray="${(C*gr.frac).toFixed(1)} ${C.toFixed(1)}"`
    +` transform="rotate(-90 ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`;
}

// Both pictures answer about the same systems, so picking one system marks
// it in both. Without this they are two charts that happen to sit side by side.
// A click OPENS the system's card (task 168): the figure and the radar are the
// two doors to it; hovering still shows the tip, and the note under the
// pictures says so.
function wireSystems(box, domains){
  const by = Object.fromEntries(domains.map(d=>[d.key,d]));
  const note = $('#sys-note', box);
  const pick = k => {
    box.querySelectorAll('[data-dom]').forEach(el=>el.classList.toggle('on', el.dataset.dom===k));
    box.querySelectorAll('.rdot').forEach(el=>{const c=el.querySelector('.rdotc'); if(c) c.setAttribute('r', el.dataset.dom===k?7:4.5);});
    const d = by[k]; if(!d||!note) return;
    const pl = d.place||{};
    const where = pl.parts
      ? t('web.body.where_organs',{places:pl.parts.map(p=>t('web.body.place.'+p.place)).join(', ')})
      : (pl.place ? t('web.body.where_organ')
         : (pl.whole_body ? t('web.body.where_whole') : t('web.body.where_blood')));
    note.textContent = t('web.body.picked',
      {label:d.label, score:d.score, measured:d.measured, total:d.total, where:where});
  };
  const open = k => { pick(k); viewSystem(k); };
  box.querySelectorAll('[data-dom]').forEach(el=>{
    el.addEventListener('click', ()=>open(el.dataset.dom));
    el.addEventListener('mouseenter', ()=>pick(el.dataset.dom));
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault(); open(el.dataset.dom);}
    });
  });
}

async function renderSystems(box, radar){
  const doms = (radar.domains||[]).filter(d=>d.score!=null);
  if(doms.length<3){ box.innerHTML=emptyHtml(t('web.radar.not_enough')); return; }
  // `radar.sex` is already normalised by the engine — 'male', 'female' or null.
  const sex = radar.sex || '';
  // The figure and the radar come from the radar's own answer and are drawn at
  // once. The second ring — how much of each system's genetic half was read —
  // comes from the systems listing, the slowest answer on the page (seconds on a
  // cold server), so it is drawn in when it arrives, with a bar beside the
  // pictures meanwhile (owner, 14.09.2026). The ring is never folded into the score.
  const draw = loading => {
    const bar = loading ? `<span class="ringload" role="progressbar" aria-label="${esc(t('web.body.rings_loading'))}"><span>${esc(t('web.body.rings_loading'))}</span><span class="dna-bar"><span class="dna-fill"></span></span></span>` : '';
    box.innerHTML = `<div class="sysrow">
        <div class="syspane"><div class="sysh">${esc(t('web.body.figure_h'))}${bar}</div>
          <div class="sysbox">${bodySVG(doms, sex)}</div>
          ${SILHOUETTE[sex]?`<div class="syscredit">${esc(t('web.body.credit'))}</div>`:''}</div>
        <div class="syspane"><div class="sysh">${esc(t('web.body.radar_h'))}</div>
          <div class="sysbox">${radarSVG(doms)}</div></div>
      </div>
      <div class="muted small mt-2" id="sys-note">${esc(t('web.body.hint'))} · ${esc(t('system.open'))}</div>`;
    wireSystems(box, doms);
  };
  const join = sys => {
    const gen = Object.fromEntries(((sys&&sys.systems)||[]).map(s=>[s.key,s.genetics]));
    doms.forEach(d=>{ d.genetics = gen[d.key]||null; });
  };
  if(_systems){ join(_systems); draw(false); return; }
  doms.forEach(d=>{ d.genetics = undefined; });
  draw(true);
  // The bar moves with the time waited and stops short of full: one request has
  // no parts to count, and a bar that reached the end and kept waiting would lie.
  const t0 = Date.now();
  const timer = setInterval(()=>{
    const f = box.querySelector('.ringload .dna-fill');
    if(!f){ clearInterval(timer); return; }
    f.style.width = (95*(1-Math.exp(-(Date.now()-t0)/2500))).toFixed(1)+'%';
  }, 150);
  const sys = await systemsIndex().catch(()=>null);
  clearInterval(timer);
  if(!box.isConnected) return;                       // the reader has left the tab
  join(sys);
  draw(false);
}

function radarLabelLines(label){
  const s=String(label||'');
  if(s.length<=18||s.indexOf(' ')<0) return [s];
  const mid=s.length/2; let best=-1;
  for(let i=0;i<s.length;i++) if(s[i]===' '&&(best<0||Math.abs(i-mid)<Math.abs(best-mid))) best=i;
  return [s.slice(0,best),s.slice(best+1)];
}
function radarSVG(domains){

  const ang=i=>(-90+i*360/N)*Math.PI/180;

  let axes='',labels='';
  d.forEach((dom,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+20);
    const anchor=Math.abs(lx-cx)<12?'middle':(lx>cx?'start':'end');
    const a=dArrow(dom.delta);
    // The label is a door too (owner, 14.09.2026): the dot's hit area was
    // 18 px and the label beside it opened nothing, so a click on «Lipids 56»
    // looked like a hang. The label carries the same key as the dot.
    const padX=anchor==='start'?lx-6:anchor==='end'?lx-114:lx-60;
    // A long name («Опорно-двигательная система») is split at the space nearest
    // its middle, so it does not run off the edge of the picture.
    const lines=radarLabelLines(dom.label);
    const extra=(lines.length-1)*15;
    labels+=`<g class="rlabel" data-dom="${esc(dom.key)}" tabindex="0" role="button" aria-label="${esc(dom.label)}" style="cursor:pointer"><title>${esc(t('system.open'))}</title>`
      +`<rect x="${padX.toFixed(1)}" y="${(ly-12).toFixed(1)}" width="120" height="${38+extra}" fill="transparent"/>`
      +`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="var(--ink-2)" font-size="13" text-anchor="${anchor}" dominant-baseline="middle">${lines.map((l,k)=>`<tspan x="${lx.toFixed(1)}" dy="${k?15:0}">${esc(l)}</tspan>`).join('')}</text>`
      +`<text x="${lx.toFixed(1)}" y="${(ly+16+extra).toFixed(1)}" font-size="12.5" font-weight="700" text-anchor="${anchor}" dominant-baseline="middle">`
      +`<tspan fill="${DSTAT[dom.status]}">${dom.score}</tspan>`
      +(a.txt?`<tspan fill="${a.col}" font-size="11.5"> ${a.txt}</tspan>`:'')+`</text></g>`;
  });
  // the previous measurement — a dashed outline behind
  const withPrev=d.filter(x=>x.prev_score!=null);
  let prevPoly='';
  if(withPrev.length){
    const ppts=d.map((dom,i)=>pt(i,R*(dom.prev_score!=null?dom.prev_score:dom.score)/100).map(n=>n.toFixed(1)).join(',')).join(' ');
    prevPoly=`<polygon points="${ppts}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>`;
  }
  const dpts=d.map((dom,i)=>pt(i,R*dom.score/100).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=d.map((dom,i)=>{
    const [x,y]=pt(i,R*dom.score/100);
    const a=dArrow(dom.delta);
    const mv=(dom.moved||[]).map(m=>`\n  · ${m.name}: ${m.from_value} → ${m.to_value} ${m.unit||''}`).join('');
    const dyn=dom.prev_score!=null?'\n'+t('web.radar.was',{score:dom.prev_score,compared:dom.compared,date:dom.prev_date||t('web.radar.prev_measurement'),word:a.word})+mv:'\n'+t('web.radar.no_previous');
    // Two rings about every dot, the same two as on the figure: the share of
    // the laboratory panel measured (inner), the share of the genetic half
    // read (outer). Two numbers, never one.
    const frac=dom.total?Math.max(0,Math.min(1,(dom.measured||0)/dom.total)):0, rl=8, C=2*Math.PI*rl;
    const rings=`<circle class="ringbg" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rl}"/>`
      +`<circle class="ringfg" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rl}" stroke="${DSTAT[dom.status]}" stroke-width="1.8"`
      +` stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${x.toFixed(1)} ${y.toFixed(1)})"/>`
      +genRingSVG(dom.genetics, x, y, rl+4);
    const tip=(dom.measured!=null&&dom.measured<dom.total?t('web.radar.tip_partial',{label:dom.label,score:dom.score,ok:dom.ok,measured:dom.measured,total:dom.total}):t('web.radar.tip',{label:dom.label,score:dom.score,ok:dom.ok,total:dom.total}))
      +'\n'+genRingTip(dom.genetics)+dyn+'\n'+t('system.open');
    return `<g class="rdot" data-dom="${esc(dom.key)}" tabindex="0" role="button" aria-label="${esc(dom.label)}" style="cursor:pointer"><title>${esc(tip)}</title><circle class="rhit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="24" fill="transparent"/>${rings}<circle class="rdotc" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${DSTAT[dom.status]}"/></g>`;
  }).join('');
  const legend=`<g font-size="12" dominant-baseline="middle">
    <line x1="188" y1="404" x2="216" y2="404" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="222" y="404" fill="var(--ink-2)">${esc(t('web.radar.now'))}</text>
    <line x1="288" y1="404" x2="316" y2="404" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="322" y="404" fill="var(--ink-2)">${esc(t('web.radar.previous'))}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:600px">${rings}${axes}${prevPoly}
    <polygon points="${dpts}" fill="rgba(57,135,229,.18)" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}${withPrev.length?legend:''}</svg>`;
}

  // qualifier («ultrarapid metaboliser — ASSUMED»); the code would lose both.
  const drugs=d.drug_flags.map(x=>{const lv=LEVEL[x.level]||LEVEL.unknown;
    const ph=x.phenotype_label||String(x.phenotype||'').replace(/_/g,' ');
    return `<div class="list-item"><div class="row">${badge(lv.cls,t(lv.key))}<b>${esc(x.drug)}</b> · ${esc(x.gene)}</div><div class="why" title="${esc(t('web.guide.term_pgx_body'))}"><b>${esc(ph)}</b></div>${noteHtml(x.recommendation)}</div>`;}).join('');
  const rest=pending.filter(x=>!usedTests.has(x.id));
  const tests=rest.map(s=>testItem(s).outerHTML).join('');
  const testsEmpty=emptyHtml(t(usedTests.size?'web.second.tests_all_placed':'web.tests.none_pending'));
  const testsRoutine=done.length?`<details class="fold"><summary>${esc(t('web.tests.routine_h'))} · ${done.length}</summary>${done.map(s=>testItem(s).outerHTML).join('')}</details>`:'';
  // Nothing flagged among the drugs is not the same statement as nothing checkable.
  const drugsEmpty=emptyHtml(d.drugs_answerable
    ? t('web.second.no_drug_flags',{n:d.drugs_answerable})
    : t('web.second.no_drug_data',{n:d.drugs_checked||0}));
  const drugsBasis=d.drugs_checked?`<div class="meta mb-2">${esc(d.drugs_answerable
    ? t('web.second.pgx_basis',{k:d.drugs_answerable,n:d.drugs_checked})
    : t('web.second.pgx_basis_none',{n:d.drugs_checked}))}</div>`:'';
  // The reader may have left the tab while the cards were on their way.
  const slb=$('#sl-blocks',root); if(!slb) return;
  slb.innerHTML=(blocks||emptyHtml((radar.domains||[]).some(x=>x.status!=='nodata')
      ? t('web.second.no_domain_issues',{n:(radar.domains||[]).filter(x=>x.status!=='nodata').length})
      : t('web.second.no_domain_data')))+silentLine;
  $('#sl-pgx',root).innerHTML=drugsBasis+(drugs||drugsEmpty);
  $('#sl-tests',root).innerHTML=(tests||testsEmpty)+testsRoutine;
  const qf=$('#sl-qfact b',root); if(qf) qf.textContent=String(questions);
  bindTabLinks(root);
}

// ---------------- Prescriptions ----------------
// «acts on: system» comes from the class→system map through the systems
// listing, joined by name; a current prescription the map does not place says
// so rather than showing nothing.
function actsOnHtml(m, sys){
  if(!sys||m.current===false) return '';
  const p=(sys.prescriptions||[]).find(x=>x.name===m.name);
  if(!p) return '';
  if(p.systems&&p.systems.length)
    return `<div class="why">${esc(t('system.acts_on',{systems:''}))}${p.systems.map(k=>systemLinkHtml(k,t('radar.domain.'+k))).join(', ')}</div>`;
  return `<div class="why muted">${esc(t('system.acts_on_none',{status:p.map_status}))}</div>`;
}
// A status as words and a date — «stopped 10 Sep 2026» — never «stopped_2026-09-10».
function medStatusText(s){
  const m=String(s||'').match(/^([a-z_]*?)_?(\d{4}-\d{2}(?:-\d{2})?)?$/);
  if(!m) return String(s||'—');
  const word=m[1]?t('web.meds.status.'+m[1]):'';
  const w=(!word||word.startsWith('⟦'))?String(m[1]||'').replace(/_/g,' '):word;
  return [w,m[2]?fmtDate(m[2]):''].filter(Boolean).join(' ')||'—';
}
function medItem(m, sys){
  // `current` is the server's verdict by the one rule in core — the page does not
  // re-decide which words mean «taking it».
  const st=m.current===false?` ${badge('b-unknown',medStatusText(m.status))}`:'';
  return `<div class="list-item"><div class="row"><b>${esc(m.name)}</b> ${m.dose?`<span class="muted">${esc(m.dose)}</span>`:''}${st} <button class="ghost btn-sm ml-auto" data-rm="${esc(m.name)}">${esc(t('web.meds.remove'))}</button></div>${noteHtml(m.note)}${actsOnHtml(m,sys)}</div>`;
}

// ---------------- Personal health metrics ----------------
// Two stores answer for some of these numbers — what the person typed in and
// what their watch recorded — and the card names which one it is showing. The
// other one is printed under it rather than instead of it: a weight entered by
// hand on the 25th and a monthly mean from the scales are both true, and the
// reader is the one who knows which they meant.
function metricOrigin(m){
  if(!m.origin) return '';
  const dev = m.device&&t('web.life.device.'+m.device.source)||'';
  const head = m.origin==='device'
    ? t('web.metrics.from_device',{device:dev,date:m.device.date})
    : t('web.metrics.from_hand',{date:(m.manual&&m.manual.date)||m.date});
  const other = m.origin==='device'
    ? (m.manual?t('web.metrics.also_hand',{value:m.manual.value,date:m.manual.date}):'')
    : (m.device?t('web.metrics.also_device',{device:dev,value:m.device.value,date:m.device.date}):'');
  return `<div class="meta">${esc(head)}${other?' · '+esc(other):''}</div>`;
}
function metricCard(m){
  const f = FLAG[m.flag]||FLAG.unknown;
  const has = m.value!=null;
  let tr='';
  if(m.trend){const a={up:'↑',down:'↓',flat:'→'}[m.trend.direction];const pct=m.trend.pct!=null?` ${m.trend.pct>0?'+':''}${m.trend.pct}%`:'';tr=`<span class="trend">${a}${pct}</span>`;}
  return el(`<div class="card">
    <div class="label">${esc(m.name)}</div>
    <div class="value">${has?esc(m.value):'—'} <small>${esc(m.unit)}</small></div>
    <div class="row">${has?badge(f.cls==='b-good'||f.cls==='b-critical'||f.cls==='b-warning'?f.cls:'b-good', t(f.key)):badge('b-unknown',t('web.flag.unknown'))}${tr}</div>
    ${m.series&&m.series.length>1?sparkline(m.series):''}
    <div class="meta">${esc(refText(m))}${has&&m.date?` · ${esc(m.date)}`:''}</div>
    ${metricOrigin(m)}

}
// The person: who the data belong to, their own numbers, and the two forms that

async function renderPerson(root, given){

  // engine already computes it — `limits` answers «what cannot be said here and
  // what would close it», and a missing precondition is exactly that — but no
  // page had ever asked that route for anything, so the whole layer reached the
  // command line and the assistant and never a person in a browser.
  // The whole first screen asks for its data at once. This one used to be
  // fetched here, after everything else had already come back, and it is the
  // second slowest route in the product — the person's own block then waited on

  let missing=[];

  pf.innerHTML=`<div class="form"><div class="fr">

// ---------------- Lifestyle: a single dashboard ----------------
// The reading order of the page: how things are -> what to do -> how far the goal is ->
// the detail per metric -> the reasoning -> the alarms called off -> the workouts.
// The workout types come from Garmin as identifiers, so the key is the identifier.
const WKT=['Running','Tennis','Swimming','Cycling','Walking','Hiking','SnowSports',
  'HighIntensityIntervalTraining','TraditionalStrengthTraining','FunctionalStrengthTraining',
  'Pickleball','Golf','Rowing','Yoga','Pilates','MindAndBody','MixedCardio','Elliptical',
  'PaddleSports','Other'];
const wkName=type=>WKT.indexOf(type)>=0?t('web.workout.'+type):type;

// --- the bullet bar "now -> goal" -------------------------------------------
// The shape is chosen for the question "how far is the goal across many metrics":
// one track = one metric, the fill = the current value, the notch = the goal.
// Three status levels, not four: the pair warning<->serious is indistinguishable to
// normal vision (dE 13.6 < 15). Colour is never the only carrier — a number, a caption
// and the goal always stand next to it.
function bulletStatus(s){
  // Three levels, and each of them means something concrete:
  //   good — the goal is reached, or there is no goal and the value is within range;
  //   warn — within the corridor, but the goal is not reached;
  //   crit — outside the laboratory reference corridor.
  // The thresholds are not invented: the red one is set by the laboratory, the yellow
  // one by the distance to the goal.
  if(s.raw==null) return 'none';
  const bad = (s.status==='high'||s.status==='low'||s.status==='bad');
  if(bad) return 'crit';
  if(s.target_value==null) return 'good';          // no goal — judged by the corridor alone
  const better=s.dir==='higher';
  return (better? s.raw>=s.target_value : s.raw<=s.target_value) ? 'good' : 'warn';
}
// Where the goal comes from is worth showing: some goals are personal (the shape of
// 2021–2022), some are the walls of the laboratory corridor, some are general advice.
const SRCTXT={goal:'web.bullet.src_goal',ref:'web.bullet.src_ref',norm:'web.bullet.src_norm',own:'web.bullet.src_own'};
const BLTCOL={good:'var(--good)',warn:'var(--warning)',crit:'var(--critical)',none:'var(--muted)'};
const BLTTXT={good:'web.bullet.good',warn:'web.bullet.warn',crit:'web.bullet.crit',none:'web.bullet.none'};
function bulletRow(s){
  const st=bulletStatus(s), col=BLTCOL[st];
  const pct=v=>(v==null||s.min==null||s.max==null)?null
    :Math.max(0,Math.min(100,(v-s.min)/((s.max-s.min)||1)*100));
  const pv=pct(s.raw), pt=pct(s.target_value);
  // The goal zone: the side of the scale on which the metric counts as good is filled in.
  // "Longer" then stops reading as "better" — the direction is visible from the zone itself.
  let zone='';
  if(pt!=null) zone = s.dir==='higher'
    ? `<div class="z" style="left:${pt.toFixed(1)}%;right:0"></div>`
    : `<div class="z" style="left:0;width:${pt.toFixed(1)}%"></div>`;
  const tgt = s.target_value==null ? t('web.bullet.no_target')
    : t('web.bullet.target',{value:fmtNum(s.target_value)})+(s.source?' — '+t(SRCTXT[s.source]||'web.bullet.src_norm'):'');
  const tip=`${s.label}: ${fmtNum(s.raw)} ${s.unit} · ${tgt} · ${t(BLTTXT[st])}${s.date?' · '+s.date:''}${s.note?'\n'+s.note:''}`;
  const track = pv==null
    ? `<div class="t"></div>`
    : `<div class="t" title="${esc(tip)}">${zone}
         ${pt==null?'':`<span class="m" style="left:${pt.toFixed(1)}%"></span>`}
         <span class="d" style="left:${pv.toFixed(1)}%;background:${col}"></span>
       </div>`;
  return `<div class="blt">
    <div class="l">${esc(s.label)}</div>
    ${track}
    <div class="v">${s.raw==null?'—':esc(fmtNum(s.raw))} <s>${esc(s.unit)} · ${s.target_value==null?esc(t('web.bullet.no_target')):esc(t('web.bullet.target',{value:fmtNum(s.target_value)}))}</s></div>
  </div>`;
}
// The grouping matches the LABELS that arrive from the profile, so the lists of labels
// are a matching table and not a phrase: they read identically in both catalogues, and
// only the group headings are translated.
const BLTGROUPS=[
  ['web.bullet.group.body',       'web.bullet.match.body'],
  ['web.bullet.group.metabolism', 'web.bullet.match.metabolism'],
  ['web.bullet.group.bones',      'web.bullet.match.bones'],
  ['web.bullet.group.fitness',    'web.bullet.match.fitness'],
];
function bulletBoard(snap){
  if(!snap||!snap.length) return '';
  const by=Object.fromEntries(snap.map(s=>[s.label,s]));
  const grouped=BLTGROUPS.map(([titleKey,matchKey])=>[titleKey,t(matchKey).split('|')]);
  let out='';
  grouped.forEach(([titleKey,labels])=>{
    const rows=labels.map(l=>by[l]).filter(Boolean);
    if(!rows.length) return;
    out+=`<div class="bltgrp">${esc(t(titleKey))}</div>`+rows.map(bulletRow).join('');
  });
  const rest=snap.filter(s=>!grouped.some(([,ls])=>ls.includes(s.label)));
  if(rest.length) out+=`<div class="bltgrp">${esc(t('web.bullet.group.other'))}</div>`+rest.map(bulletRow).join('');
  const lgd=['good','warn','crit'].map(k=>`<span><i style="background:${BLTCOL[k]};border-radius:50%"></i>${esc(t(BLTTXT[k]))}</span>`).join('');
  return `<h2 class="section">${esc(t('web.bullet.title'))}</h2>
    <div class="bltbox">${out}
      <div class="bltlgd">${lgd}<span><i style="background:var(--ink-2);width:2px;height:12px;border-radius:1px"></i>${esc(t('web.bullet.legend_notch'))}</span><span><i style="background:rgba(12,163,12,.20)"></i>${esc(t('web.bullet.legend_zone'))}</span></div>
    </div>`;
}

// --- the metric card (as it was) --------------------------------------------
// Which device measured this. Shown whenever the number came from one at all —
// a card that says «HRV 64 ms» and nothing else is a card that invites the reader
// to compare it with a number from another strap. Where two devices report the
// same metric and nobody has said which one answers, the card says that too, and
// the value is greyed out of every conclusion on the page.
function srcTag(m){
  if(!m.source) return '';
  const also=(m.also_measured_by||[]);
  const name=esc(t('web.life.device.'+m.source));
  if(!also.length) return `<div class="srcline">${esc(t('web.life.measured_by',{device:name}))}</div>`;
  const others=also.map(d=>esc(t('web.life.device.'+d))).join(', ');
  const cls=m.counts_toward_conclusions?'ok':'warn';
  const tail=m.counts_toward_conclusions
    ? t('web.life.also_answers',{other:others})
    : t('web.life.also_unresolved',{other:others});
  return `<div class="srcline ${cls}">${esc(t('web.life.measured_by',{device:name}))} · ${esc(tail)}</div>`;
}

function lifeCard(m){
  const ST={ok:{cls:'b-good',key:'web.life.ok'},warn:{cls:'b-warning',key:'web.life.warn'},
            bad:{cls:'b-critical',key:'web.life.bad'},none:{cls:'b-unknown',key:'web.life.none'}};
  const s=ST[m.status]||ST.none;
  let trendTxt='→ '+t('web.life.stable'), tcol='var(--muted)';
  if(m.trend&&m.trend.direction!=='flat'){
    const ar=m.trend.direction==='up'?'↑':'↓';const dl=m.trend.delta;
    trendTxt=`${ar} ${t('web.life.trend_3m',{delta:(dl>0?'+':'')+dl})}`;
    tcol=m.trend_good===true?'var(--good)':(m.trend_good===false?'var(--critical)':'var(--ink-2)');
  }
  const statusBadge=(m.status&&m.status!=='none')?badge(s.cls,t(s.key)):'';
  return el(`<div class="card">
    <div class="label">${esc(m.label)}</div>
    <div class="value">${esc(m.value)} <small>${esc(m.unit)}</small></div>
    <div class="row">${statusBadge} <span class="trend" style="color:${tcol};font-weight:600">${esc(trendTxt)}</span></div>
    ${m.series&&m.series.length>1?sparkline(m.series,false):''}
    ${srcTag(m)}
    <div class="meta">${esc(t('web.life.card_meta',{date:fmtDate(m.date),smooth:m.value_smooth,since:fmtDate(m.first_date)}))}${m.why?' · '+esc(m.why):''}</div>
  </div>`);
}

// --- the sections of the brief ----------------------------------------------

function briefActions(b){

// The flag, beside the wording it is about, and with the one control that can
// lower it. It used to open the tab: a warning above the content, raised the
// first time a watched marker arrived after the text was written, and with no way
// to answer it from anywhere in the product. So it stayed on — and a permanent
// warning is not a warning, it is furniture. Saying «still true» is exactly what
// the `reviewed` date has always meant; it just had no door.
function briefReview(b){
  if(!b||!b.needs_review) return '';
  // The flag is a button now (owner, 14.09.2026): pressing it opens, for every
  // block due, what arrived after its wording was read — the one thing a
  // review has to look at — beside the two ways to answer it.
  return `<div class="lsrev" id="brief-review" style="margin:10px 0 16px">
    <div class="row"><button class="act" data-brv-all>⚠ ${esc(t('web.brief.needs_review'))} · ${esc(t('web.brief.review_all'))}</button>
      <span class="muted small">${esc(t('web.brief.new_data'))}</span></div>
    <div style="margin-top:8px">${b.stale_blocks.map(s=>
      `<div class="list-item" style="margin-bottom:8px"><div class="row"><b>${esc(s.title)}</b>

       ${s.review_hint?`<div class="why">${esc(s.review_hint)}</div>`:''}
       <div class="row mt-2"><button class="ghost" data-brv="${esc(s.id)}">${esc(t('web.brief.review_btn'))}</button>

function briefReviewHtml(r){
  const tone=s=>s==='ok'?'b-good':s==='unknown'?'b-unknown':'b-warning';
  const val=(p,u)=>`${esc(String(p.value))}${u?' '+esc(u):''} <span class="muted">(${esc(String(p.date).slice(0,10))})</span> ${badge(tone(p.status),t('brief.review.status.'+p.status))}`;
  const rows=(r.markers||[]).filter(m=>(m.after||[]).length).map(m=>{
    const last=m.after[m.after.length-1];
    const moved=m.status_changed&&m.before?` <span style="color:var(--warning)">${esc(t('web.brief.review_moved',{from:t('brief.review.status.'+m.before.status),to:t('brief.review.status.'+last.status)}))}</span>`:'';
    return `<div class="row-l"><b>${esc(m.name)}</b>: ${m.before?val(m.before,m.unit):esc(t('brief.review.no_before'))} → ${m.after.map(p=>val(p,m.unit)).join(' · ')}${moved}</div>`;}).join('');
  return `<div class="why mt-2"><b>${esc(t('web.brief.review_h',{reviewed:r.reviewed||'—'}))}</b></div>
    ${rows||`<div class="muted">${esc(t('brief.review.no_changes'))}</div>`}

    <div class="row mt-2"><button class="ghost" data-brq>${esc(t('web.brief.review_copy'))}</button><span class="muted" data-brq-info></span></div>

}

// ---------------- Genome ----------------
function genomeCard(r){
  if(r.status==='unknown_rsid') return `<div class="card muted">${esc(r.message)}</div>`;
  if(r.status==='unknown_gene') return `<div class="card muted">${esc(t('web.genome.unknown_gene'))}</div>`;
  if(r.status==='no_genome'){const l=r.locus||{};return `<div class="card"><div class="row">⚪ <b>${esc(r.rsid)}</b> <span class="muted">${esc(l.gene||'')} · ${esc(l.chrom)}:${esc(l.pos)}</span></div><div class="meta">${esc(r.message||'')}</div></div>`;}
  if(r.gene&&r.loci){return `<div class="card"><b>${esc(r.gene)}</b> — ${esc(t('web.genome.loci'))}<ul class="meta">${r.loci.map(x=>{const rs=x.result||{};const g=rs.confidence==='assumed_ref'?null:rs.genotype;return `<li><code>${esc(x.rsid)}</code>${x.star?' '+esc(x.star):''} ${x.chrom?esc(x.chrom)+':'+esc(x.pos):''} — ${g?esc(t('web.genome.genotype'))+' <b>'+esc(g)+'</b>':'—'}</li>`;}).join('')}</ul></div>`;}
  const res=r.result||{};
  // All three confidence levels are named, and the note about THIS read is shown.
  // `res.note` ("depth is low (4 reads) — the call is unreliable") reached no
  // channel at all; `r.note` is the catalogue's remark and is the same for
  // everybody. The measurement leads, because it changes what the remark is worth.
  const CONF={called:'genome.called',confirmed_ref:'genome.confirmed_ref_short',assumed_ref:'web.genome.assumed_ref'};
  const conf=CONF[res.confidence]?t(CONF[res.confidence]):'';
  const dp=res.depth!=null?', '+t('web.genome.coverage',{value:res.depth}):'';
  // The weakest state is not rendered in the shape of the strongest. The engine
  // hands `assumed_ref` a genotype string — the reference bases, because that is
  // what «no row» would mean IF the site was read — and the card printed it in the
  // large answer slot with the caveat in small type beside it. The CLI already
  // refuses that shape; the page did not. No row, no genotype.
  const gt=res.confidence==='assumed_ref'?'—':(res.genotype||'?');
  return `<div class="card">
    <div class="row">🧬 <b style="font-size:17px">${esc(r.rsid)}</b>${r.star?' <span class="muted">'+esc(r.star)+'</span>':''} → ${esc(t('web.drug.gene'))} <b>${esc(r.gene)}</b> <span class="muted">${esc(r.chrom)}:${esc(r.pos)}</span></div>
    <div class="value" style="margin:10px 0">${esc(gt)} <small title="${esc(t('web.guide.term_confidence_body'))}">${esc(conf)}${esc(dp)}</small></div>
    ${res.conflict?`<div class="meta" style="color:var(--critical)">⚠ ${esc(t('genome.conflict',{reported:res.conflict.reported,called:res.conflict.called}))}</div>`:''}
    ${res.confirmed_by==='profile'?`<div class="meta" style="color:var(--good)">${esc(t('genome.confirmed_by_report'))}</div>`:''}
    ${res.note?`<div class="meta">⚠ ${esc(res.note)}</div>`:''}
    ${r.note?`<div class="meta">${esc(r.note)}</div>`:''}
  </div>`;
}
function pctBar(p,reliable){
  if(p==null)return `<div class="muted small">${esc(t('web.prs.no_model'))}</div>`;
  const col=p>=80?'var(--warning)':(p<=20?'var(--good)':'var(--accent)');
  const op=reliable?1:0.4;
  return `<div class="pbar" style="opacity:${op}"><div class="pbar-fill" style="width:${Math.max(2,Math.min(100,p))}%;background:${col}"></div><span class="pbar-mark" style="left:${Math.max(0,Math.min(100,p))}%"></span></div>`;
}
// ---- render helpers (they return HTML) for the combined "Genome" tab ----
function renderPRS(d){
  if(!d||!d.available)return `<div class="card muted">${esc((d&&d.message)||t('web.prs.not_ready'))}</div>`;
  const s=d.stats;
  // Twelve percentiles a centimetre below «Full genome (VCF): no data» read as a
  // contradiction. Both are true — a polygenic score is a stored result, computed
  // once from a file that need not still be attached — and the reader has no way
  // to tell which to believe unless the block says so itself.
  const prov=(d.provenance&&d.provenance.note)
    ?`<div class="card muted" style="margin-bottom:10px">⚠ ${esc(d.provenance.note)}</div>`:'';
  // The panel these numbers are a position inside. Printed here, beside them,
  // because a percentile computed against another population is not this
  // person's position — and the sentence that says so was reaching the command
  // line and the assistant while the page, where most people meet the number,
  // showed nothing at all.
  const panelNote=(d.method_caveats||[]).filter(c=>String(c.key||'').indexOf('panel_')===0)
    .map(c=>`<div class="card" style="margin-bottom:10px;border-color:var(--warning)">⚠ ${esc(c.note)}</div>`).join('');
  // «P94» is the Guide's material, and the Guide is a tab away. A reader meeting
  // the badge for the first time has to leave the page to learn that it is a
  // position in a population and not a probability — so the badge says it where
  // it stands. The wording is the Guide's own, not a second one written here.
  const high=d.high.map(tr=>`<div class="list-item"><div class="row"><b>${esc(tr.label)}</b> ${badge('b-warning','P'+Math.round(tr.percentile),t('web.guide.term_prs_body'))} <span class="muted">${esc(tr.category)}</span></div><div class="why">${esc(t('web.prs.above_average',{pop:s.superpopulation||'EUR'}))}${tr.effect_size?' · '+esc(tr.effect_size):''}</div></div>`).join('');
  let cats='';
  d.categories.forEach(c=>{
    const rows=c.traits.map(tr=>{
      const rel=tr.reliable;const pv=(tr.percentile!=null)?Math.round(tr.percentile):null;
      const warn=(!rel&&tr.percentile!=null)?` <span class="muted" title="${esc(t('web.prs.low_coverage'))}">⚠</span>`:'';
      return `<div class="prs-row"><div class="prs-lbl">${esc(tr.label)}${warn}</div><div class="prs-bar">${pctBar(tr.percentile,rel)}</div><div class="prs-num" title="${esc(t('web.guide.term_prs_body'))}">${pv!=null?('P'+pv):'—'}</div></div>`;
    }).join('');
    cats+=`<div class="prs-cat"><div class="prs-cat-h">${esc(c.category)}</div>${rows}</div>`;
  });
  return `${prov}${panelNote}<div class="stat">
      <div class="s"><b>${s.total}</b><span>${esc(t('web.prs.stat_traits'))}</span></div>
      <div class="s"><b>${s.reliable}</b><span>${esc(t('web.prs.stat_reliable'))}</span></div>
      <div class="s"><b>${s.high}</b><span>${esc(t('web.prs.stat_high'))}</span></div>
    </div>
    <div class="meta mb-2">${esc(d.disclaimer)} ${esc(t('web.prs.scale_note'))}</div>
    ${high?`<div class="so-h">${esc(t('web.prs.high_h'))}</div>${high}`:''}
    <div class="so-h">${esc(t('web.prs.all_h'))}</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">${esc(t('web.prs.legend'))}</div>
    ${cats}`;
}
// What the tab found, in sentences. It used to print a gene, an rsID, a genotype
// and `note` — a field these rows do not carry, so the explanation line was empty
// on every one of them. The catalogue holds what each allele IS, what a second
// copy does, what it argues for and what it does not; all of it in both
// languages, and none of it was being read.
const _LVERDICT={plus:'b-good',plus_partial:'b-good',lean_plus:'b-good',good:'b-good',
                 neutral:'b-unknown',flag:'b-warning'};
function longevityRow(k){
  // The engine resolved both of these to sentences, or to nothing. It has the
  // token sets; the page has neither, and a page that composes a message key out
  // of a value from a stored file prints the key at the reader.
  const mk=badge(_LVERDICT[k.verdict_token]||'b-unknown', k.verdict_label||'—');
  const conf=k.confidence_label?`<span class="muted small">${esc(k.confidence_label)}</span>`:'';
  const pm=(k.pmids||[]).length?`<div class="meta">PMID: ${(k.pmids||[]).map(x=>
    `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(x)}/" target="_blank" rel="noreferrer noopener">${esc(x)}</a>`).join(', ')}</div>`:'';
  return `<div class="list-item"><div class="row">${mk}<b>${esc(k.gene)}</b>
      <span class="muted">${esc(t('web.genome.genotype'))} <b>${esc(k.genotype||'—')}</b></span>
      <code style="margin-left:auto">${esc(k.rsid)}</code></div>
    ${k.label?`<div class="why">${esc(k.label)}</div>`:''}
    ${k.zygosity_note?`<div class="why muted">${esc(k.zygosity_note)}</div>`:''}
    ${k.population_note?`<div class="why c-warning">⚠ ${esc(k.population_note)}</div>`:''}
    <div class="why muted">${esc(t('web.longevity.action_h'))}: ${esc(k.action||t('web.longevity.no_action'))}</div>
    ${conf}${pm}</div>`;
}
function renderLongevity(d){
  if(!d||!d.available)return `<div class="card muted">${esc((d&&d.message)||t('web.longevity.not_ready'))}</div>`;
  const ap=d.apoe;
  const e4=!!(ap&&ap.epsilon&&ap.epsilon.indexOf('ε4')>=0);
  const apNote=!ap?'':((ap.epsilon==='ε2/ε3'||ap.epsilon==='ε2/ε2')?t('web.longevity.apoe_favourable')
    :(e4?t('web.longevity.apoe_e4'):t('web.longevity.apoe_generic')));
  // The card led with «APOE — status» over two rsIDs, which tells a reader
  // nothing about what APOE is or what their own combination means. The

function renderClinvar(cv){

async function pollUpdate(root){

    box.innerHTML=`<div class="meta">${esc(t('web.updates.downloading'))}</div><pre class="log">${esc((s.tail||'').slice(-800))}</pre>`;

// The state of the genome in ONE place, refusal included. The page used to read
// three fields out of `/api/genome-status` — `ready`, `vcf`, `not_ours` — and
// drop `ambiguous`, which is the field that says WHY nothing is being read and
// carries the fix. So a folder holding the person's reads beside one extraction
// from them showed a grey badge here and «the positions have not been read» six
// blocks below, and the cause was printed nowhere. A signal nothing renders is
// not a signal.
function genomeState(st){
  const amb = st.ambiguous || null;
  const excl = (st.excluded || []);
  const aside = excl.length
    ? `<details class="fold"><summary>${esc(t('web.genome.set_aside_h'))}</summary><div class="meta">${esc(t('web.genome.set_aside'))} `
      + excl.map(x=>`<code>${esc((x.path||'').split('/').pop())}</code> <span class="muted">— `
      + `${esc(t('web.genome.why.'+(x.why||'')))}</span>`).join(', ') + `</div></details>`
    : '';
  if(st.not_ours){
    return `<div class="card warnbox" style="margin-bottom:8px"><div>${esc(st.not_ours.message||'')}</div>`
      + `<div class="meta mt-1">${esc(st.not_ours.fix||'')}</div></div>`;
  }
  if(amb && (amb.reason==='several_files'||amb.reason==='chosen_missing')){
    const gone = amb.reason==='chosen_missing'
      ? `<div class="meta mt-1">${esc(t('web.genome.chosen_gone',{path:amb.chosen||''}))}</div>` : '';
    const picks = (amb.choices||[]).map(p=>
      `<div class="row" style="gap:8px;margin-top:8px"><code>${esc(p.split('/').pop())}</code>`
      + `<button class="act" data-pick="${esc(p)}">${esc(t('web.genome.pick_btn'))}</button></div>`).join('');
    return `<div class="card warnbox" style="margin-bottom:8px">
        <div class="row">${badge('b-warning',t('web.genome.db_not_connected'))} <b>${esc(t('web.genome.pick_h'))}</b></div>
        ${gone}
        <div class="meta mt-1">${esc(t('web.genome.pick_why'))}</div>
        ${picks}${aside}</div>`;
  }
  const facts = [];
  if(st.assembly) facts.push(esc(t('web.genome.assembly',{name:st.assembly})));
  if(st.sample) facts.push(esc(t('web.genome.sample',{name:st.sample})));
  const badgeEl = st.ready?badge('b-good',t('web.genome.db_connected')):badge('b-unknown',t('web.genome.db_not_connected'));
  // The frame, on the page and not only on the command line. `/api/genome-status`
  // has carried `paths` since it was written and the page dropped it, so the tab
  // showed a green badge and a file name while `scholion genome-status` said which
  // questions this file opens and which it shuts. A person then asked the tab a
  // question the file cannot answer and read the refusal as a fact about their
  // genome. The route test cannot see this: the route WAS called, the field was
  // thrown away.
  const size = (st.catalogue_by_assembly||{}).total || 0;
  // Only for a file that is actually being read, exactly as the command line
  // does it: with no genome every path is shut for one reason, and the badge
  // above has already said it.
  const rows = (st.ready ? (st.paths||[]) : []).map(p=>{
    const name = t('paths.'+p.path, {n:size});
    return `<li>${esc(p.open ? t('web.genome.path_open',{name:name})
                             : t('web.genome.path_closed',{name:name,
                                 why:t('paths.why.'+(p.why||'no_genome'))}))}</li>`;
  }).join('');
  const frame = rows
    ? `<details class="fold"><summary>${esc(t('genome_status.paths_head'))}</summary>`
      + `<ul class="meta" style="margin:4px 0 0 18px;padding:0">${rows}</ul></details>`
    : '';
  return `<div class="card mb-2"><div class="row">${badgeEl}
      <span class="muted">${st.ready?esc((st.vcf||'').split('/').pop()):esc(t('web.genome.db_after_script'))}</span></div>
    ${facts.length?`<div class="meta mt-1">${facts.join(' · ')}</div>`:''}
    <div class="meta mt-1">${esc(t('web.genome.intro'))}</div>${frame}${aside}</div>`;
}
// The whole feed of the tab, built from the four answers the tab already has.
// The sections below are cut by SOURCE — ClinVar, polygenic, longevity, lipids —
// and a reader thinks by gene and by what to do about it. So the first pane is
// neither: one list, ordered by how much a line can change, each row saying which
// source it came from and opening the gene it is about.
function genomeFindings(cv, prs, lng, lip){
  const rows = [];
  const push = (rail, gene, badgeCls, badgeTxt, said, src) =>
    rows.push({rail, gene, badgeCls, badgeTxt, said, src});
  // 1. what a doctor would act on
  (cv && cv.status === 'ok' ? (cv.hits || []) : []).forEach(h => {
    if (h.tier !== 'pathogenic' && h.tier !== 'drug') return;
    const sig = clnsigText(h.clnsig);
    push(h.tier === 'pathogenic' ? 'crit' : 'warn', isRsid(h.rsid) ? h.rsid : [h.chrom, h.pos].filter(Boolean).join(':'),
         h.tier === 'pathogenic' ? 'b-critical' : 'b-warning', sig,
         diseaseText(h.disease), 'ClinVar' + (h.stars ? ' · ' + h.stars + '★' : ''));
  });
  // 2. the inherited half of the lipid profile
  if (lip && lip.status === 'ok') {
    (lip.pcsk9 || []).forEach(x => {
      if (x.status !== 'read') return;
      push(x.carrier ? 'good' : 'info', x.gene,
           x.carrier ? 'b-good' : 'b-unknown',
           t(x.carrier ? 'lipidgen.carrier' : 'lipidgen.not_carrier'),
           x.verdict || x.label || '', t('web.genome.nav_lipids'));
    });
    const l = (lip.lpa || {});
    if (!l.measured && l.what_to_do)
      push('warn', 'LPA', 'b-warning', t('lipidgen.unread'), l.what_to_do,
           t('web.genome.nav_lipids'));
    else if (l.measured && l.measured.above)
      push('crit', 'LPA', 'b-critical',
           t('lipidgen.lpa.above', {ref: l.measured.ref_high}),
           t('lipidgen.lpa.measured', {value: l.measured.value, unit: l.measured.unit,
                                       date: l.measured.date}),
           t('web.genome.nav_lipids'));
  }
  // 3. carriage worth knowing, which is not a risk and is marked as such
  ((lng && lng.available ? (lng.known || []) : [])).forEach(k => {
    if (k.carries_named_allele !== true) return;
    push('good', k.gene, 'b-good', t('web.longevity.carries'), k.note || '',
         t('web.genome.nav_longevity'));
  });
  // 4. a position in a population, last, because that is what it is
  ((prs && prs.available ? (prs.high || []) : [])).forEach(tr => {
    push('info', '', 'b-warning', 'P' + Math.round(tr.percentile),
         tr.label + (tr.category ? ' · ' + tr.category : ''), 'PGS');
  });
  if (!rows.length)
    return `<div class="card muted">${esc(t('web.genome.findings_none'))}</div>`;
  const body = rows.map(r => `<div class="list-item"${r.gene && !/:/.test(r.gene) ? ` data-gene-open="${esc(r.gene)}" style="cursor:pointer"` : ''}>
      <div class="row">${badge(r.badgeCls, r.badgeTxt)}${r.gene ? `<b>${esc(r.gene)}</b>` : ''}
        <span class="muted" style="margin-left:auto;font-size:12.5px">${esc(r.src)}</span></div>
      ${r.said ? `<div class="why">${esc(r.said)}</div>` : ''}</div>`).join('');
  return `<div class="meta mb-2">${esc(t('web.genome.findings_note'))}</div>${body}`;
}

// Everything the tab knows about ONE gene, in one card. The four sections answer
// by source; nobody answers by gene, so «what do I have on APOE» meant reading
// four of them and joining by eye.
function geneCard(d, cv, lng, lip, sys){
  if (!d || !d.gene) return genomeCard(d);
  // The honest entry from the genome's side: not «what this gene means» —
  // the product does not answer that — but «in which systems' genetic half it
  // is named, and by whom», from the same index the system cards are built on.
  const named = sys && sys.genes_index ? (sys.genes_index[d.gene] || []) : null;
  const inSystems = named === null ? '' : `<div class="meta">${named.length
      ? esc(t('system.of_gene',{systems:''})) + named.map(k=>systemLinkHtml(k, t('radar.domain.'+k))).join(', ')
      : esc(t('system.of_gene_none'))}</div>`;
  const loci = d.loci || [];
  const ids = new Set(loci.map(x => x.rsid));
  const cvRows = (cv && cv.status === 'ok' ? (cv.hits || []) : []).filter(h => ids.has(h.rsid));
  const lngRows = (lng && lng.available ? (lng.known || []) : []).filter(k => k.gene === d.gene);

  const cell = (head, body) => `<div class="cell"><div class="cellhead">${esc(head)}</div>${body}</div>`;

    return `<div><code>${esc(x.rsid)}</code> ${g ? '<b>' + esc(g) + '</b>' : '—'}`
      + `${dp != null ? ` <span class="muted">${esc(t('web.genome.coverage', {value: dp}))}</span>` : ''}</div>`;
  }).join('') || '—';
  return `<div class="card" style="border-color:var(--accent);margin-bottom:14px">
    <div class="row"><b style="font-size:17px">${esc(d.gene)}</b>
      <span class="muted">${esc(t('web.genome.loci'))} ${loci.length}</span>
      <button class="ghost" id="gc-close" style="margin-left:auto">${esc(t('web.common.close'))}</button></div>
    <div class="row4">
      ${cell(t('web.genome.genotype'), lociHTML)}
      ${cell('ClinVar', cvRows.length ? cvRows.map(h =>
        `<div>${esc(clnsigText(h.clnsig))}${h.disease ? ' — ' + esc(diseaseText(h.disease)) : ''}</div>`).join('') : '—')}
      ${cell(t('web.genome.nav_longevity'), lngRows.length ? lngRows.map(k =>
        `<div>${esc(k.note || '')}</div>`).join('') : '—')}
      ${cell(t('web.genome.nav_lipids'), lipRows.length ? lipRows.map(x =>
        `<div>${esc(x.verdict || x.label || '')}</div>`).join('') : '—')}
    </div>${inSystems}</div>`;
}

// The second entry, on the page. The classes are listed beside the answer and
// not behind it: a reader shown only the answer for one class cannot tell a
// class this build holds nothing for from one it looked at and found nothing in.
function screenVerdictLine(v){
  if(!v)return '';

    let s=t('screen.finding',{n:v.n||0,genes:(v.genes||[]).join(', ')});

}
function renderScreen(scr){
  if(!scr)return `<div class="card muted">${esc(t('web.common.error'))}</div>`;

async function viewGenome(root){
  const [st,cv,prs,lng,upd,lip,scr,wb]=await Promise.all([

    api('/api/genome-updates'),api('/api/lipid-genetics').catch(()=>null),
    api('/api/screen').catch(()=>null),api('/api/limits/bed').catch(()=>null)]);
  const sb=await sourceBar(['genome_vcf','catalog','ensembl','clinvar']);
  // Seven headings on one scroll, all open, was the tab. The reader met the
  // maintenance block («update the databases») before any finding, and the same
  // gene appeared in four places without any of them saying so. One pane at a
  // time, findings first, maintenance last.
  const n = x => x==null?'':`<span class="cnt">${x}</span>`;

    ['clin', t('web.genome.nav_clinvar'), n(cv&&cv.status==='ok'?cv.count:null), ()=>renderClinvar(cv)],
    ['screen',t('web.genome.nav_screen'), '', ()=>renderScreen(scr)+weakBedHtml(wb)],
    ['lip',  t('web.genome.nav_lipids'), '', ()=>renderLipidGenetics(lip)||`<div class="card muted">${esc(t('web.genome.db_after_script'))}</div>`],
    ['locus',t('web.genome.nav_locus'), '', ()=>`<div class="row"><input id="g-in" placeholder="${esc(t('web.genome.locus_placeholder'))}" style="flex:1 1 240px"><button class="act" id="g-go">${esc(t('web.genome.find'))}</button></div>
      <div class="drugchips" id="g-chips"></div>`],
    ['src',  t('web.genome.nav_sources'), '', ()=>`${sb.replace('<details class="srcfoot">','<details class="srcfoot" open>')}

    showLoader(box);
    const r=await api('/api/screen?class='+encodeURIComponent(b.getAttribute('data-cls')));
    box.innerHTML=screenClassHtml(r);
  });
  const gfacts=[
    factHtml(st.ready?'✓':'—',st.ready?t('web.genome.db_connected'):t('web.genome.db_not_connected'),st.ready?'c-good':'c-muted'),
    cv&&cv.status==='ok'?factHtml(String(cv.actionable||0),t('web.genome.fact_actionable'),''):'',
    prs&&prs.available?factHtml(String((prs.stats||{}).high||0),t('web.genome.fact_prs_high'),''):'',
    lng&&lng.available?factHtml(String((lng.stats||{}).significant_genes??'—'),t('web.genome.fact_long'),''):'',
  ];
  root.innerHTML=`${pageHead(t('web.tab.genome'),t('web.page.genome.q'),gfacts)}

    <div class="subnav" role="tablist">${panes.map(([id,label,cnt],i)=>
      `<button role="tab" data-pane="${id}" aria-selected="${i===0}">${esc(label)}${cnt}</button>`).join('')}</div>

    ${panes.map(([id,_l,_c,body],i)=>`<div class="gpane" id="gp-${id}"${i?' hidden':''}>${body()}</div>`).join('')}

  const card=$('#g-card',root);

    pollUpdate(root);
  };
  // the check is already running (the tab was re-entered) — pick the status up
  if(upd&&upd.running){showPane('src');pollUpdate(root);}
}

<style>
  :root{
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --accent:#3987e5;
    --r:14px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);font-size:17px;line-height:1.58}
  a{color:var(--accent)}
  header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
  header .sub{color:var(--muted);font-size:14.5px}
  .disclaimer{color:var(--muted);font-size:13.5px;padding:9px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
  nav{display:flex;gap:4px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;background:var(--plane);z-index:5}
  nav button{background:transparent;border:1px solid transparent;color:var(--ink-2);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:15.5px}
  nav button:hover{background:var(--surface-2)}
  nav button.active{background:var(--surface-2);color:var(--ink);border-color:var(--border)}
  main{padding:22px 24px;max-width:1100px;margin:0 auto}
  h2.section{font-size:15.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:6px 0 14px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px}
  .card .label{font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .card .value{font-size:32px;font-weight:700;margin:6px 0 8px}
  .card .value small{font-size:14.5px;color:var(--muted);font-weight:400}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid transparent}
  .badge .dot{width:8px;height:8px;border-radius:50%}
  .b-critical{background:rgba(208,59,59,.14);color:#f0908f;border-color:rgba(208,59,59,.35)}
  .b-warning{background:rgba(250,178,25,.14);color:#f4c65a;border-color:rgba(250,178,25,.30)}
  .b-good{background:rgba(12,163,12,.13);color:#5ec95e;border-color:rgba(12,163,12,.30)}
  /* "at the edge": formally within range, but the value is pressed against the wall of the
     corridor. Blue rather than yellow — so that it differs from b-warning in tone and not
     only in wording for a colour-blind reader. */
  .b-near{background:rgba(72,133,214,.14);color:#8ab4f8;border-color:rgba(72,133,214,.32)}
  .b-unknown{background:rgba(137,135,129,.14);color:#b7b5ac;border-color:rgba(137,135,129,.30)}
  .meta{color:var(--muted);font-size:13.5px;margin-top:9px}
  .trend{color:var(--ink-2);font-size:13.5px;margin-left:4px}
  .glink{color:var(--accent);font-size:13.5px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spark{margin-top:10px}
  .sparkwrap{margin-top:10px}
  .sparkdates{display:flex;justify-content:space-between;width:168px;font-size:11.5px;color:var(--muted);margin-top:3px}
  .sparkwrap .spark{margin-top:0}
  .stat{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .stat .s{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;min-width:120px}
  .stat .s b{font-size:28px;display:block;font-weight:700}
  .stat .s span{font-size:13.5px;color:var(--muted)}
  input,select,button.act{font-family:inherit;font-size:15.5px}

<body>
<header>
  <h1><img src="/dna.svg" alt="" style="height:22px;width:auto;vertical-align:-4px;margin-right:6px">Scholion</h1>
  <span class="sub" id="subhead"></span>
  <span class="sub" id="localbadge"
        style="margin-left:auto;font-size:12px;cursor:pointer;border:1px solid var(--border);border-radius:999px;padding:3px 11px;white-space:nowrap"></span>
  <span class="sub" id="ver" style="margin-left:12px;font-size:12px;opacity:.7"></span>
  <span class="sub" id="langswitch" style="margin-left:12px;display:inline-flex;gap:4px"></span>
</header>
<div class="disclaimer" id="disclaimer"></div>

<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
const API = "";
const $ = (s,el=document)=>el.querySelector(s);
const el = (h)=>{const tpl=document.createElement('template');tpl.innerHTML=h.trim();return tpl.content.firstChild;};
const esc = (s)=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------------- Language ----------------
// The language is a display preference of THIS browser tab and of nothing else. It is
// kept in the address bar (so that a reload and a bookmark keep it) and in
// sessionStorage (so that it survives moving between tabs of the interface); the
// server is told which language to answer in on every call and forgets it as soon as
// the reply is sent. Two tabs may therefore read the same profile in two languages.
let LANG='en', LANGS=['en'], MSG={};

// The same lookup rule as in the Python catalogue: named placeholders only, and a key
// with no phrase behind it shows up as the identifier in brackets rather than as an
// empty space, so that a hole in the catalogue cannot be mistaken for a design choice.
function t(key,vars){
  const s=MSG[key];
  if(s==null) return '⟦'+key+'⟧';
  return vars ? s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?String(vars[k]):m) : s;
}
// Plural forms by suffix, the same three as in the catalogue: English takes two,
// Russian three, and the choice is made here so that no call site has to know the rule.
function plural(n,key,vars){
  let form;
  if(LANG==='ru'){
    const h=n%100, u=n%10;
    form=(h>=11&&h<=14)?'many':(u===1?'one':(u>=2&&u<=4?'few':'many'));
  }else{
    form=(n===1)?'one':'many';
  }
  return t(key+'.'+form,{n:n,...(vars||{})});
}
// Numbers: a decimal comma in Russian, a decimal point in English. A formatting rule,
// not a phrase — it has no place in the catalogue.
const fmtNum=v=>LANG==='ru'?String(v).replace('.',','):String(v);

function wantedLang(){
  const q=new URLSearchParams(location.search).get('lang');
  let stored=null;
  try{stored=sessionStorage.getItem('scholion.lang');}catch(e){}
  return (q||stored||'en').slice(0,2).toLowerCase();
}
async function loadLang(code){
  const r=await fetch(API+'/api/i18n?lang='+encodeURIComponent(code));
  const d=await r.json();
  LANG=d.lang||'en'; LANGS=d.available||[LANG]; MSG=d.messages||{};
  document.documentElement.lang=LANG;
  try{sessionStorage.setItem('scholion.lang',LANG);}catch(e){}
}
const withLang=(path)=>path+(path.indexOf('?')>=0?'&':'?')+'lang='+encodeURIComponent(LANG);
async function api(path,opts){const r=await fetch(API+withLang(path),opts);return r.json();}
async function post(path,body){const r=await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});_sources=null;return r;}
function toast(m){const box=$('#toast');box.textContent=m;box.classList.add('show');setTimeout(()=>box.classList.remove('show'),2200);}

// ---------------- Data sources (date + provenance) ----------------
let _sources=null;
async function sources(){if(!_sources)_sources=await api('/api/sources');return _sources;}
// labs.json is NOT picked by hand — it is assembled from the folder of studies (PDF).
// Only the source folders are picked.
const PICKABLE={medications:'medications',metrics:'metrics',genome_vcf:'genome'};
function srcChip(s,key){
  if(!s)return '';
  const icon=s.kind==='local'?'🔒':'🌍';
  const parts=[];
  if(s.release)parts.push(t('web.source.release',{release:esc(s.release)}));
  if(s.updated)parts.push(t((s.kind==='public'&&s.origin&&s.origin.indexOf('ClinVar')>=0)?'web.source.synced':'web.source.updated',{date:esc(s.updated)}));
  else if(s.present===false)parts.push(t('web.source.absent'));
  const tail=parts.length?' · '+parts.join(' · '):'';
  const dom=PICKABLE[key];
  let pick='';
  if(s.kind==='local'&&dom){
    pick=` <button class="pickbtn" data-pick="${dom}" title="${esc(t('web.source.pick_title'))}">📁 ${esc(t('web.source.pick_btn'))}</button>`;
    if(s.custom)pick+=`<button class="pickbtn" data-clear="${dom}" title="${esc(t('web.source.reset_title'))}">↺</button>`;
  }
  return `<span class="srcchip ${s.kind}">${icon} ${esc(s.label)}: <b>${esc(s.origin)}</b>${tail}${pick}</span>`;
}
async function sourceBar(keys){
  const all=await sources();
  const html=keys.map(k=>srcChip(all[k],k)).filter(Boolean).join('');
  return html?`<div class="srcbar">${html}</div>`:'';
}
async function overviewSourceBar(){
  const s=await sources();
  const locDates=['labs','medications','metrics'].map(k=>s[k]&&s[k].present?s[k].updated:null).filter(Boolean).sort();
  const locDate=locDates.length?locDates[locDates.length-1]:null;
  const pub=[];
  if(s.pgx)pub.push('CPIC/PharmGKB');
  if(s.catalog)pub.push('Ensembl GRCh38');
  if(s.clinvar&&s.clinvar.present)pub.push('ClinVar'+(s.clinvar.release?' '+s.clinvar.release:''));
  return `<div class="srcbar">
    <span class="srcchip local">🔒 ${esc(t('web.source.local_label'))}: <b>${esc(t('web.source.local_kinds'))}</b>${locDate?' · '+esc(t('web.source.profile_updated',{date:locDate})):''}</span>
    <span class="srcchip public">🌍 ${esc(t('web.source.public_label'))}: <b>${esc(pub.join(', ')||'CPIC, Ensembl')}</b></span>
  </div>`;
}

// The status vocabulary is stored as KEYS, not as phrases: the tables are built once at
// load time, while the language may change afterwards without a reload.
const FLAG = {
  high:{cls:'b-critical', key:'web.flag.high'},
  low:{cls:'b-warning', key:'web.flag.low'},
  ok:{cls:'b-good', key:'web.flag.ok'},
  near:{cls:'b-near', key:'web.flag.near'},
  unknown:{cls:'b-unknown', key:'web.flag.unknown'},
};
const LEVEL = {
  high:{cls:'b-critical', key:'web.level.high'},
  moderate:{cls:'b-warning', key:'web.level.moderate'},
  low:{cls:'b-good', key:'web.level.low'},
  unknown:{cls:'b-unknown', key:'web.level.unknown'},
};
const PRIO = {high:'b-critical', moderate:'b-warning', low:'b-good'};

function badge(cls,txt){return `<span class="badge ${cls}"><span class="dot" style="background:currentColor"></span>${esc(txt)}</span>`;}

// the chart window: the last ~3 years, but never fewer than the last 3 points
function windowSeries(series){
  if(!series||series.length<=3) return series||[];
  const s=series.slice().sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  const latest=s[s.length-1].date;
  const cutoff=(parseInt(latest.slice(0,4),10)-3)+latest.slice(4);   // "2026-03" -> "2023-03"
  const within=s.filter(p=>p.date>=cutoff).length;
  return s.slice(-Math.max(3,within));
}
function sparkline(series,win){
  if(win!==false) series=windowSeries(series);
  if(!series||series.length<2) return '';
  const w=168,h=40,pad=5;
  const ys=series.map(p=>p.value);
  const mn=Math.min(...ys),mx=Math.max(...ys),rng=(mx-mn)||1;
  const X=i=>pad+(w-2*pad)*(i/(series.length-1));
  const Y=v=>h-pad-(h-2*pad)*((v-mn)/rng);
  const pts=series.map((p,i)=>`${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(' ');
  // points with the date on hover — the date each measurement was taken
  const dots=series.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="${i===series.length-1?3.2:2.3}" fill="var(--accent)"><title>${esc(p.date)}: ${p.value}</title></circle>`).join('');
  const d0=series[0].date, dN=series[series.length-1].date;
  return `<div class="sparkwrap">
    <svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
      ${dots}
    </svg>
    <div class="sparkdates"><span>${esc(d0)}</span>${series.length>2?`<span>${esc(series[Math.floor((series.length-1)/2)].date)}</span>`:''}<span>${esc(dN)}</span></div>
  </div>`;
}

// ---------------- The goal dashboard (on the "Overview" tab) ----------------
let _goalMarksReady=false, _goalCharts=[];
function goalSetup(){
  if(typeof Chart==='undefined') return false;
  if(_goalMarksReady) return true;
  const marks={ id:"marks",
    beforeDraw(chart){ const o=chart.options.plugins.marks; if(!o) return;
      const {ctx,chartArea:a,scales}=chart;
      if(o.band){ const lb=chart.data.labels;
        const fi=lb.findIndex(x=>x>=o.band.from), tiRev=[...lb].reverse().findIndex(x=>x<=o.band.to);
        if(fi>=0){ const li=tiRev>=0?lb.length-1-tiRev:lb.length-1;

    afterDraw(chart){ const o=chart.options.plugins.marks; if(!o||!o.targets) return;
      const {ctx,chartArea:a,scales}=chart;
      o.targets.forEach(mk=>{ const sc=scales[mk.axis||"y"]; if(!sc) return;
        const y=sc.getPixelForValue(mk.value);

  Chart.register(marks);

  Chart.defaults.font.family="system-ui,-apple-system,Segoe UI,sans-serif";
  Chart.defaults.font.size=11;

// ---------------- Focus of attention ----------------
// The single task the owner is concentrating on right now. The track shows the path
// "baseline -> now -> target"; the green zone is the stretch already covered.
// The levers are observations from the owner's own data, not prescriptions: the
// assistant does not change therapy.
const FCMARK={primary:'▶',secondary:'·',hypothesis:'?'};
function fcTrack(m){
  const lo=m.baseline, hi=m.target, cur=(m.mean_30!=null?m.mean_30:m.raw);
  if(lo==null||hi==null||cur==null) return '';
  const min=Math.min(lo,hi,cur), max=Math.max(lo,hi,cur), pad=(max-min)*0.15||1;
  const a=min-pad, b=max+pad, pc=v=>Math.max(0,Math.min(100,(v-a)/(b-a)*100));
  const better = m.dir!=='lower' ? cur>=lo : cur<=lo;
  const col = better? 'var(--good)':'var(--critical)';
  const z0=Math.min(pc(lo),pc(cur)), z1=Math.max(pc(lo),pc(cur));
  return `<div class="fctrack" title="${esc(t('web.focus.track_tip',{base:lo,now:cur,target:hi}))}">
      <div class="zn" style="left:${z0.toFixed(1)}%;width:${(z1-z0).toFixed(1)}%"></div>
      <div class="mk" style="left:${pc(lo).toFixed(1)}%"></div>
      <div class="mk" style="left:${pc(hi).toFixed(1)}%"></div>
      <div class="dt" style="left:${pc(cur).toFixed(1)}%;background:${col}"></div>
    </div>
    <div class="fcscale"><span>${esc(t('web.focus.baseline',{value:m.baseline_txt||lo}))}</span><span>${esc(t('web.focus.target',{value:m.target_txt||hi,unit:m.unit||''}))}</span></div>`;
}

// The flag, taking the "at the edge" level into account (within range, but in the last
// 10 % before the wall of the corridor).
function flagOf(m){ return (m && m.near_limit && m.flag==='ok') ? FLAG.near : (FLAG[m&&m.flag]||FLAG.ok); }
function decisionNote(m, context){
  const ds=(m&&m.decisions)||[]; const hit=ds.filter(d=>d.crossed);
  if(hit.length) return hit.map(d=>`<div class="why" style="color:var(--critical)">❗${esc(t('web.decision.crossed',{label:d.label,sign:d.side==='high'?'≥':'≤',value:d.value}))} — ${esc(d.action||'')} <span class="muted">[${esc(d.source||'')}]</span></div>`).join('');
  if(context && ds.length){const d=ds[0];return `<div class="why muted">${esc(t('web.decision.not_reached',{value:d.value,label:d.label}))}</div>`;}
  return '';
}
function nearNote(m){
  const nl = m && m.near_limit; if(!nl || m.flag!=='ok') return '';
  const side = t(nl.side==='high' ? 'near.upper' : 'near.lower');
  const cp = nl.corridor_pct!=null ? ', '+t('web.near.corridor',{pct:nl.corridor_pct}) : '';
  const mv = nl.movement ? `; ${esc(nl.movement)}` : '';
  return `<span class="trend">${esc(t('web.near.margin',{pct:nl.margin_pct,side:side,bound:nl.bound}))}${esc(cp)}${mv}</span>`;
}
function refText(m){
  return (m.ref_low!=null&&m.ref_high!=null)?t('ref.range',{low:m.ref_low,high:m.ref_high})
    :(m.ref_high!=null?t('ref.max',{high:m.ref_high})
    :(m.ref_low!=null?t('ref.min',{low:m.ref_low}):''));
}

function markerCard(m){
  const f = flagOf(m);
  let tr=nearNote(m);
  if(m.trend){const a={up:'↑',down:'↓',flat:'→'}[m.trend.direction];const pct=m.trend.pct!=null?` ${m.trend.pct>0?'+':''}${m.trend.pct}%`:'';tr=`<span class="trend">${a}${pct} (${m.trend.from_date}→${m.trend.to_date})</span>`;}
  return el(`<div class="card">
    <div class="label">${esc(m.name)}</div>
    <div class="value">${m.value} <small>${esc(m.unit)}</small></div>
    <div class="row">${badge(f.cls,t(f.key))}${m.date?`<span class="muted" style="font-size:12.5px">${esc(m.date)}</span>`:''}${tr}</div>
    ${m.series&&m.series.length>1?sparkline(m.series):''}
    <div class="meta">${esc(refText(m))}${m.genome_link?` · <span class="glink">${esc(t('web.labs.genome_link',{text:m.genome_link}))}</span>`:''}${m.note?` · ${esc(m.note)}`:''}</div>
  </div>`);
}

function doseHTML(dc){

function rxCard(r){
  if(r.status!=='ok')return `<div class="card muted">${esc(r.message||t('web.common.error'))}</div>`;
  const ov=SEV[r.overall]||SEV.low;
  const id=r.identified||{};
  const idLine=id.source==='none'?`<span class="muted">${esc(t('web.rx.not_identified'))}</span>`
    :`${id.source==='rxnorm'?'🌍 RxNorm':'📗 '+esc(t('web.rx.local_db'))}${id.atc?' · '+esc(id.atc):''}${id.reference?' · <a href="'+esc(id.reference)+'" target="_blank" rel="noopener">RxNav ↗</a>':''}`;
  // 🧬 the patient's genome
  const g=r.genome||{};
  let genomeHtml;
  if(!g.genes||!g.genes.length){
    // An unreachable source and an empty answer are different facts — see the note
    // on cpic_lookup(). Only the second one licenses «this drug has none».
    const cp=g.cpic||{};
    genomeHtml=cp.asked
      ?`<div class="muted">${esc(t('web.rx.no_pgx'))}</div>`
      :`<div class="muted">${esc(t('web.rx.pgx_unchecked',{why:t('pgx_unchecked.'+(cp.reason||'unreachable'))}))}</div>`;
  }else{
    genomeHtml=g.genes.map(ge=>{
      const lvl=ge.cpic_level===t('web.rx.curated_value')?esc(t('source.local')):('CPIC '+esc(ge.cpic_level));
      let body;
      if(ge.computable){
        body=`${esc(t('web.rx.your_phenotype'))} <b>${esc(ge.phenotype)}</b>${ge.label?' — <span class="muted">'+esc(ge.label)+'</span>':''}`;
      }else{
        const mk=(ge.markers||[]).map(m=>`<code>${esc(m.rsid)}</code> ${esc(m.genotype||'')}`).join(', ');
        body=(mk?(esc(t('web.rx.your_variants'))+' '+mk+'<div class="meta" style="margin-top:3px">'+esc(ge.label||'')+'</div>'):'<span class="muted">'+esc(ge.label||'')+'</span>');
      }
      return `<div class="list-item"><div class="row"><b>${esc(ge.gene)}</b> <span class="badge b-unknown">${lvl}</span>${ge.actionable?' '+badge('b-warning',t('web.rx.actionable')):''}</div><div class="why">${body}</div></div>`;
    }).join('');
  }
  // 🧪 the patient's labs
  const lb=r.labs||{};
  let labsHtml;
  if(!lb.markers||!lb.markers.length){
    const lbb=lb.basis||{};
    labsHtml=!(lbb.classes||[]).length
      ?`<div class="muted">${esc(t('web.rx.labs_class_unknown'))}</div>`
      :(!(lbb.with_rules||[]).length
        ?`<div class="muted">${esc(t('web.rx.labs_no_rule',{classes:r.class_display||'—'}))}</div>`
        :`<div class="muted">${esc(t('web.rx.no_lab_control'))}</div>`);
  }else{
    labsHtml=lb.markers.map(m=>{const f=m.present?flagOf(m):FLAG.unknown;
      const val=m.present?`${m.value} ${esc(m.unit)}`:esc(t('web.rx.not_taken_yet'));
      return `<div class="list-item"><div class="row">${badge(f.cls,t(f.key))}<b>${esc(m.name)}</b> <span class="muted">${val}</span></div>${m.present?nearNote(m)+decisionNote(m,true):''}</div>`;}).join('');
    if(lb.reason)labsHtml=`<div class="meta" style="margin-bottom:8px">${esc(t('web.rx.monitor_while',{text:lb.reason}))}</div>`+labsHtml;
    if(lb.near&&lb.near.length)labsHtml=`<div class="why" style="margin-bottom:8px">🔵 ${t('web.rx.near_note',{names:'<b>'+esc(lb.near.map(w=>w.name).join(', '))+'</b>'})}</div>`+labsHtml;
    if(lb.watch&&lb.watch.length)labsHtml=`<div class="why" style="margin-bottom:8px;color:var(--warning)">⚠️ ${t('web.rx.watch_note',{names:'<b>'+esc(lb.watch.map(w=>w.name).join(', '))+'</b>'})}</div>`+labsHtml;
  }
  // 🔗 interactions with the current prescriptions
  const inter=(r.interactions&&r.interactions.interactions)||[];
  let interHtml;
  if(inter.length){
    interHtml=inter.map(it=>{const s=SEV[it.severity]||SEV.low;
      return `<div class="list-item"><div class="row">${badge(s.cls,t(s.key))}<b>${esc(it.effect)}</b></div>
        <div class="why">${esc(t('web.rx.with_yours'))} <b>${esc((it.with_meds||[]).join(', ')||it.with_class)}</b> · ${esc(t('web.rx.mechanism',{text:it.mechanism||''}))}</div>
        <div class="spec">${esc(t('web.rx.what_to_do',{text:it.manage||''}))}</div></div>`;}).join('');
  }else if(r.interactions&&(r.interactions.status==='no_rules'||r.interactions.status==='unknown_class')){
    interHtml=`<div class="muted">${esc(r.interactions.message||'')}</div>`;
  }else{
    // Named, not merely counted: a comparison that skipped part of the list may not
    // print the same sentence as one that covered all of it.
    const unrec=((r.interactions||{}).baseline||{}).unclassified||[];
    interHtml=`<div class="muted">${esc(unrec.length
      ?t('web.rx.no_interactions_partial',{names:unrec.slice(0,6).join(', ')})
      :t('web.rx.no_interactions'))}</div>`;
  }
  // 🧬 ClinVar findings for this drug (drug_response and the rest)
  const cv=(r.clinvar&&r.clinvar.hits)||[];
  const TI={drug:'💊',pathogenic:'🔴',risk:'🟠',protective:'🟢'};
  let cvHtml='';
  if(cv.length){
    cvHtml=cv.slice(0,12).map(h=>{
      const via=h.gene?t('web.rx.via_gene',{gene:h.gene}):t('web.rx.via_drug_name');
      const sig=(h.clnsig||'').replace(/[|_]/g,' ');
      return `<div class="list-item"><div class="row">${TI[h.tier]||'•'} <code>${esc(h.rsid||'')}</code> ${badge(h.tier==='pathogenic'?'b-critical':'b-warning',sig)} <span class="muted">${esc(t('web.rx.genotype',{genotype:h.genotype||'?'}))} · ${esc(via)}</span></div>${h.disease?`<div class="why">${esc(h.disease)}</div>`:''}</div>`;
    }).join('');
  }
  const cvSection=cvHtml?`<div class="so-h">🧬 ${esc(t('web.rx.clinvar_h'))} <span class="muted" style="font-weight:400;font-size:13px">· ${esc(t('web.rx.clinvar_note'))}</span></div>${cvHtml}`:'';
  return `<div class="card" style="margin-bottom:14px">
      <div class="row"><b style="font-size:18px">${esc(t('web.rx.title',{drug:r.drug}))}</b> ${badge(ov.cls,t('web.rx.overall',{level:t(ov.key)}))}</div>
      <div class="meta" style="margin-top:6px">${esc(t('web.rx.class',{name:r.class_display||'—'}))} · ${idLine}</div>
      ${(r.unresolved&&r.unresolved.length)?`<div class="meta" style="margin-top:10px"><b>${esc(t('prescription.unresolved_h'))}</b><ul style="margin:4px 0 0;padding-left:18px">${r.unresolved.map(u=>`<li>${esc(u.gene?t('prescription.unresolved_gene',{detail:u.detail||u.what,gene:u.gene}):(u.detail||u.what))}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="so-h">🧬 ${esc(t('web.rx.h_genome'))}</div>${genomeHtml}
    <div class="so-h">🧪 ${esc(t('web.rx.h_labs'))}</div>${labsHtml}
    <div class="so-h">🔗 ${esc(t('web.rx.h_meds'))}</div>${interHtml}
    ${cvSection}
    ${doseHTML(r.dose_context)}
    <div class="meta" style="margin-top:12px">${esc(r.disclaimer||'')}</div>`;
}

// ---------------- Second opinion ----------------
const DSTAT={good:'var(--good)',warning:'var(--warning)',critical:'var(--critical)',nodata:'var(--muted)'};
function dArrow(dl){ // the delta of the score: ↑ better, ↓ worse
  if(dl==null||dl===0)return {txt:'',col:'var(--muted)',word:t('web.delta.unchanged')};
  return dl>0?{txt:'▲'+dl,col:'var(--good)',word:t('web.delta.better',{n:dl})}
             :{txt:'▼'+Math.abs(dl),col:'var(--critical)',word:t('web.delta.worse',{n:Math.abs(dl)})};
}
function radarSVG(domains){
  const d=domains.filter(x=>x.score!=null);
  if(d.length<3)return `<div class="muted">${esc(t('web.radar.not_enough'))}</div>`;
  const W=600,H=430,cx=300,cy=200,R=130,N=d.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,rad)=>[cx+rad*Math.cos(ang(i)),cy+rad*Math.sin(ang(i))];
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{const pts=d.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ');rings+=`<polygon points="${pts}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;});
  let axes='',labels='';
  d.forEach((dom,i)=>{
    const [x,y]=pt(i,R);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const [lx,ly]=pt(i,R+20);
    const anchor=Math.abs(lx-cx)<12?'middle':(lx>cx?'start':'end');
    const a=dArrow(dom.delta);
    labels+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="var(--ink-2)" font-size="13" text-anchor="${anchor}" dominant-baseline="middle">${esc(dom.label)}</text>`
      +`<text x="${lx.toFixed(1)}" y="${(ly+16).toFixed(1)}" font-size="12.5" font-weight="700" text-anchor="${anchor}" dominant-baseline="middle">`
      +`<tspan fill="${DSTAT[dom.status]}">${dom.score}</tspan>`
      +(a.txt?`<tspan fill="${a.col}" font-size="11.5"> ${a.txt}</tspan>`:'')+`</text>`;
  });
  // the previous measurement — a dashed outline behind
  const withPrev=d.filter(x=>x.prev_score!=null);
  let prevPoly='';
  if(withPrev.length){
    const ppts=d.map((dom,i)=>pt(i,R*(dom.prev_score!=null?dom.prev_score:dom.score)/100).map(n=>n.toFixed(1)).join(',')).join(' ');
    prevPoly=`<polygon points="${ppts}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>`;
  }
  const dpts=d.map((dom,i)=>pt(i,R*dom.score/100).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots=d.map((dom,i)=>{
    const [x,y]=pt(i,R*dom.score/100);
    const a=dArrow(dom.delta);
    const mv=(dom.moved||[]).map(m=>`\n  · ${m.name}: ${m.from_value} → ${m.to_value} ${m.unit||''}`).join('');
    const dyn=dom.prev_score!=null?'\n'+t('web.radar.was',{score:dom.prev_score,compared:dom.compared,date:dom.prev_date||t('web.radar.prev_measurement'),word:a.word})+mv:'\n'+t('web.radar.no_previous');
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${DSTAT[dom.status]}"><title>${esc(dom.measured!=null&&dom.measured<dom.total?t('web.radar.tip_partial',{label:dom.label,score:dom.score,ok:dom.ok,measured:dom.measured,total:dom.total}):t('web.radar.tip',{label:dom.label,score:dom.score,ok:dom.ok,total:dom.total}))}${esc(dyn)}</title></circle>`;
  }).join('');
  const legend=`<g font-size="12" dominant-baseline="middle">
    <line x1="188" y1="404" x2="216" y2="404" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="222" y="404" fill="var(--ink-2)">${esc(t('web.radar.now'))}</text>
    <line x1="288" y1="404" x2="316" y2="404" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="322" y="404" fill="var(--ink-2)">${esc(t('web.radar.previous'))}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:600px">${rings}${axes}${prevPoly}
    <polygon points="${dpts}" fill="rgba(57,135,229,.18)" stroke="var(--accent)" stroke-width="2.5"/>${dots}${labels}${withPrev.length?legend:''}</svg>`;
}

// ---------------- Lifestyle: a single dashboard ----------------
// The reading order of the page: how things are -> what to do -> how far the goal is ->
// the detail per metric -> the reasoning -> the alarms called off -> the workouts.
// The workout types come from Garmin as identifiers, so the key is the identifier.
const WKT=['Running','Tennis','Swimming','Cycling','Walking','Hiking','SnowSports',
  'HighIntensityIntervalTraining','TraditionalStrengthTraining','FunctionalStrengthTraining',
  'Pickleball','Golf','Rowing','Yoga','Pilates','MindAndBody','MixedCardio','Elliptical',
  'PaddleSports','Other'];
const wkName=type=>WKT.indexOf(type)>=0?t('web.workout.'+type):type;

// --- the bullet bar "now -> goal" -------------------------------------------
// The shape is chosen for the question "how far is the goal across many metrics":
// one track = one metric, the fill = the current value, the notch = the goal.
// Three status levels, not four: the pair warning<->serious is indistinguishable to
// normal vision (dE 13.6 < 15). Colour is never the only carrier — a number, a caption
// and the goal always stand next to it.
function bulletStatus(s){
  // Three levels, and each of them means something concrete:
  //   good — the goal is reached, or there is no goal and the value is within range;
  //   warn — within the corridor, but the goal is not reached;
  //   crit — outside the laboratory reference corridor.
  // The thresholds are not invented: the red one is set by the laboratory, the yellow
  // one by the distance to the goal.
  if(s.raw==null) return 'none';
  const bad = (s.status==='high'||s.status==='low'||s.status==='bad');
  if(bad) return 'crit';
  if(s.target_value==null) return 'good';          // no goal — judged by the corridor alone
  const better=s.dir==='higher';
  return (better? s.raw>=s.target_value : s.raw<=s.target_value) ? 'good' : 'warn';
}
// Where the goal comes from is worth showing: some goals are personal (the shape of
// 2021–2022), some are the walls of the laboratory corridor, some are general advice.
const SRCTXT={goal:'web.bullet.src_goal',ref:'web.bullet.src_ref',norm:'web.bullet.src_norm',own:'web.bullet.src_own'};
const BLTCOL={good:'var(--good)',warn:'var(--warning)',crit:'var(--critical)',none:'var(--muted)'};
const BLTTXT={good:'web.bullet.good',warn:'web.bullet.warn',crit:'web.bullet.crit',none:'web.bullet.none'};
function bulletRow(s){
  const st=bulletStatus(s), col=BLTCOL[st];
  const pct=v=>(v==null||s.min==null||s.max==null)?null
    :Math.max(0,Math.min(100,(v-s.min)/((s.max-s.min)||1)*100));
  const pv=pct(s.raw), pt=pct(s.target_value);
  // The goal zone: the side of the scale on which the metric counts as good is filled in.
  // "Longer" then stops reading as "better" — the direction is visible from the zone itself.
  let zone='';
  if(pt!=null) zone = s.dir==='higher'
    ? `<div class="z" style="left:${pt.toFixed(1)}%;right:0"></div>`
    : `<div class="z" style="left:0;width:${pt.toFixed(1)}%"></div>`;
  const tgt = s.target_value==null ? t('web.bullet.no_target')
    : t('web.bullet.target',{value:fmtNum(s.target_value)})+(s.source?' — '+t(SRCTXT[s.source]||'web.bullet.src_norm'):'');
  const tip=`${s.label}: ${fmtNum(s.raw)} ${s.unit} · ${tgt} · ${t(BLTTXT[st])}${s.date?' · '+s.date:''}${s.note?'\n'+s.note:''}`;
  const track = pv==null
    ? `<div class="t"></div>`
    : `<div class="t" title="${esc(tip)}">${zone}
         ${pt==null?'':`<span class="m" style="left:${pt.toFixed(1)}%"></span>`}
         <span class="d" style="left:${pv.toFixed(1)}%;background:${col}"></span>
       </div>`;
  return `<div class="blt">
    <div class="l">${esc(s.label)}</div>
    ${track}
    <div class="v">${s.raw==null?'—':esc(fmtNum(s.raw))} <s>${esc(s.unit)} · ${s.target_value==null?esc(t('web.bullet.no_target')):esc(t('web.bullet.target',{value:fmtNum(s.target_value)}))}</s></div>
  </div>`;
}
// The grouping matches the LABELS that arrive from the profile, so the lists of labels
// are a matching table and not a phrase: they read identically in both catalogues, and
// only the group headings are translated.
const BLTGROUPS=[
  ['web.bullet.group.body',       'web.bullet.match.body'],
  ['web.bullet.group.metabolism', 'web.bullet.match.metabolism'],
  ['web.bullet.group.bones',      'web.bullet.match.bones'],
  ['web.bullet.group.fitness',    'web.bullet.match.fitness'],
];
function bulletBoard(snap){
  if(!snap||!snap.length) return '';
  const by=Object.fromEntries(snap.map(s=>[s.label,s]));
  const grouped=BLTGROUPS.map(([titleKey,matchKey])=>[titleKey,t(matchKey).split('|')]);
  let out='';
  grouped.forEach(([titleKey,labels])=>{
    const rows=labels.map(l=>by[l]).filter(Boolean);
    if(!rows.length) return;
    out+=`<div class="bltgrp">${esc(t(titleKey))}</div>`+rows.map(bulletRow).join('');
  });
  const rest=snap.filter(s=>!grouped.some(([,ls])=>ls.includes(s.label)));
  if(rest.length) out+=`<div class="bltgrp">${esc(t('web.bullet.group.other'))}</div>`+rest.map(bulletRow).join('');
  const lgd=['good','warn','crit'].map(k=>`<span><i style="background:${BLTCOL[k]};border-radius:50%"></i>${esc(t(BLTTXT[k]))}</span>`).join('');
  return `<h2 class="section">${esc(t('web.bullet.title'))}</h2>
    <div class="bltbox">${out}
      <div class="bltlgd">${lgd}<span><i style="background:var(--ink-2);width:2px;height:12px;border-radius:1px"></i>${esc(t('web.bullet.legend_notch'))}</span><span><i style="background:rgba(12,163,12,.20)"></i>${esc(t('web.bullet.legend_zone'))}</span></div>
    </div>`;
}

function briefSections(b){
  if(!b||!b.available||!b.sections||!b.sections.length) return '';
  return `<h2 class="section">${esc(t('web.brief.sections_h'))}</h2>`+

function genomeCard(r){
  if(r.status==='unknown_rsid') return `<div class="card muted">${esc(r.message)}</div>`;
  if(r.status==='unknown_gene') return `<div class="card muted">${esc(t('web.genome.unknown_gene'))}</div>`;
  if(r.status==='no_genome'){const l=r.locus||{};return `<div class="card"><div class="row">⚪ <b>${esc(r.rsid)}</b> <span class="muted">${esc(l.gene||'')} · ${esc(l.chrom)}:${esc(l.pos)}</span></div><div class="meta">${esc(r.message||'')}</div></div>`;}
  if(r.gene&&r.loci){return `<div class="card"><b>${esc(r.gene)}</b> — ${esc(t('web.genome.loci'))}<ul class="meta">${r.loci.map(x=>{const g=(x.result||{}).genotype;return `<li><code>${esc(x.rsid)}</code>${x.star?' '+esc(x.star):''} ${x.chrom?esc(x.chrom)+':'+esc(x.pos):''} — ${g?esc(t('web.genome.genotype'))+' <b>'+esc(g)+'</b>':'—'}</li>`;}).join('')}</ul></div>`;}
  const res=r.result||{};
  // All three confidence levels are named, and the note about THIS read is shown.
  // `res.note` ("depth is low (4 reads) — the call is unreliable") reached no
  // channel at all; `r.note` is the catalogue's remark and is the same for
  // everybody. The measurement leads, because it changes what the remark is worth.
  const CONF={called:'genome.called',confirmed_ref:'genome.confirmed_ref_short',assumed_ref:'web.genome.assumed_ref'};
  const conf=CONF[res.confidence]?t(CONF[res.confidence]):'';
  const dp=res.depth!=null?', '+t('web.genome.coverage',{value:res.depth}):'';
  return `<div class="card">
    <div class="row">🧬 <b style="font-size:17px">${esc(r.rsid)}</b>${r.star?' <span class="muted">'+esc(r.star)+'</span>':''} → ${esc(t('web.drug.gene'))} <b>${esc(r.gene)}</b> <span class="muted">${esc(r.chrom)}:${esc(r.pos)}</span></div>
    <div class="value" style="margin:10px 0">${esc(res.genotype||'?')} <small>${esc(conf)}${esc(dp)}</small></div>
    ${res.note?`<div class="meta">⚠️ ${esc(res.note)}</div>`:''}
    ${r.note?`<div class="meta">${esc(r.note)}</div>`:''}
  </div>`;
}

function renderClinvar(cv){

             ['long','web.genome.nav_longevity'],['clinvar','web.genome.nav_clinvar'],['locus','web.genome.nav_locus']];
  root.innerHTML=`<h2 class="section">${esc(t('web.genome.title'))}</h2>${sb}
    <div class="subnav">${nav.map(([id,key])=>`<a href="#gs-${id}">${esc(t(key))}</a>`).join('')}</div>

    <div id="gs-sum"><div class="card" style="margin-bottom:8px"><div class="row">${stBadge} <span class="muted">${st.ready?esc(st.vcf||''):esc(t('web.genome.db_after_script'))}</span></div>
      <div class="meta" style="margin-top:6px">${esc(t('web.genome.intro'))}</div></div></div>

    <h2 class="section" id="gs-upd" style="margin-top:22px">🔄 ${esc(t('web.genome.updates_h'))}</h2>
    <div class="row" style="margin-bottom:8px"><button class="act" id="upd-btn">🔄 ${esc(t('web.updates.check_btn'))}</button>
      <span class="muted" style="font-size:13px">${esc(t('web.genome.updates_note'))}</span></div>
    <div id="upd-box">${renderUpdates(upd)}</div>

    <h2 class="section" id="gs-risks" style="margin-top:24px">${esc(t('web.genome.prs_h'))}</h2>
    <div id="risks-box">${renderPRS(prs)}</div>

    <h2 class="section" id="gs-long" style="margin-top:24px">${esc(t('web.genome.longevity_h'))}</h2>
    <div id="long-box">${renderLongevity(lng)}</div>

    <h2 class="section" id="gs-clinvar" style="margin-top:24px">🩺 ${esc(t('web.genome.clinvar_h'))}</h2>
    <div id="clinvar-box">${renderClinvar(cv)}</div>

    <h2 class="section" id="gs-locus" style="margin-top:24px">${esc(t('web.genome.locus_h'))}</h2>
    <div class="row"><input id="g-in" placeholder="${esc(t('web.genome.locus_placeholder'))}" style="min-width:240px"><button class="act" id="g-go">${esc(t('web.genome.find'))}</button></div>
    <div class="drugchips" id="g-chips"></div>
    <div id="g-res" style="margin-top:14px"></div>`;
  // locus lookup
  const genes=['SLCO1B1','CYP2C9','CYP2C19','DPYD','APOE','FOXO3','VKORC1','MTHFR'];
  $('#g-chips',root).innerHTML=genes.map(g=>`<button data-gene="${g}">${g}</button>`).join('');
  $('#g-chips',root).querySelectorAll('button').forEach(b=>b.onclick=async()=>{const d=await api('/api/genome?gene='+encodeURIComponent(b.dataset.gene));$('#g-res',root).innerHTML=genomeCard(d);});
  async function go(){const rs=$('#g-in',root).value.trim();if(!rs)return;const d=await api('/api/genome?rsid='+encodeURIComponent(rs));$('#g-res',root).innerHTML=genomeCard(d);}
  $('#g-go',root).onclick=go;$('#g-in',root).addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  // updates: the button
  $('#upd-btn',root).onclick=async()=>{
    const r=await post('/api/run-update',{});
    if(r.error){toast(r.error);return;}
    pollUpdate(root);
  };
  // the check is already running (the tab was re-entered) — pick the status up
  if(upd&&upd.running)pollUpdate(root);
}

// ---------------- Assistant ----------------
// The tab answers two questions that are not obvious from the outside: does the
// application work without a model (yes) and how to connect one if it is wanted. The
// claim "the core makes no calls to language models" arrives from the backend as the
// result of a SCAN of its own code — a statement that checks itself and does not go
// stale at the next edit.
async function viewAssistant(root){
  const d=await api('/api/assistant');
  const a=d.audit||{};
  const col={ok:'b-good',ready:'b-near',missing:'b-unknown'};
  const mark={ok:'web.assistant.connected',ready:'web.assistant.ready',missing:'web.assistant.missing'};
  const eps=(d.entrypoints||[]).map(e=>`<div class="list-item">
      <div class="row">${badge(col[e.state]||'b-unknown',mark[e.state]?t(mark[e.state]):e.state)}<b>${esc(e.title)}</b>
        <span class="muted">${esc(e.detail)}</span></div>
      <div class="why">${esc(e.what)}</div>
      <div class="why"><code>${esc(e.how)}</code></div>
      ${e.id==='any'?`<div class="row" style="margin-top:8px"><button class="ghost" id="ctxbtn">📋 ${esc(t('web.assistant.collect_btn'))}</button><span class="muted" id="ctxinfo"></span></div>
        <div class="why">${esc(t('web.assistant.context_warning'))}</div>`:''}
    </div>`).join('');
  const cur=(d.curated||[]).map(c=>{
      const st=!c.exists?['b-unknown','web.assistant.absent']:(c.stale?['b-warning','web.assistant.stale']:['b-good','web.assistant.fresh']);
      return `<div class="list-item"><div class="row">${badge(st[0],t(st[1]))}<b>${esc(c.title)}</b>
        <span class="muted">${esc(c.updated?t('web.assistant.updated',{date:c.updated}):t('web.assistant.no_date'))} · ${esc(t('web.assistant.tab_of',{tab:c.tab}))}</span></div>
        ${c.note?`<div class="why">${esc(c.note)}</div>`:''}
        ${(c.stale_blocks||[]).length?`<div class="why">${esc(t('web.assistant.review_blocks',{blocks:c.stale_blocks.join(', ')}))}</div>`:''}
        <div class="why"><code>${esc(c.cmd)}</code></div></div>`;}).join('');
  root.innerHTML=`<h2 class="section">${esc(t('web.assistant.title'))}</h2>
    <div class="card">
      <div class="row">${badge('b-good',t('web.assistant.works_without'))}</div>
      <p style="margin:10px 0 0">${esc(t('web.assistant.everything_local'))}</p>
      <div class="why" style="margin-top:10px">${esc(t('web.assistant.scan_lead'))}
      ${esc((a.scanned||[]).join('; '))} — <b>${esc(a.verdict||'')}</b>.
      <br><br>${esc(t('web.assistant.network_lead'))}
      <b>${esc((a.network_hosts||[]).join(', ')||'—')}</b>.
      ${(a.ingest_hosts||[]).length?`<br>${esc(t('web.assistant.ingest_hosts',{hosts:(a.ingest_hosts||[]).join(', ')}))}`:''}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
      <div class="card"><b>${esc(t('web.assistant.engine_does'))}</b><div class="wl" style="margin-top:8px;font-size:13.5px">${(d.engine_does||[]).map(x=>`<div>· ${esc(x)}</div>`).join('')}</div></div>
      <div class="card"><b>${esc(t('web.assistant.adds'))}</b><div class="wl" style="margin-top:8px;font-size:13.5px">${(d.assistant_adds||[]).map(x=>`<div>· ${esc(x)}</div>`).join('')}</div></div>
    </div>
    <div class="so-h" style="margin-top:22px">${esc(t('web.assistant.curated_h'))}</div>
    <div class="muted" style="margin-bottom:8px">${esc(t('web.assistant.curated_note'))}</div>
    ${cur||'<div class="muted">—</div>'}
    <div class="so-h" style="margin-top:22px">${esc(t('web.assistant.connect_h'))}</div>
    ${eps}
    <div class="meta" style="margin-top:14px">${esc(d.planned||'')}</div>
    <div class="meta">${esc(d.disclaimer||'')}</div>`;
  const b=$('#ctxbtn');
  if(b) b.onclick=async()=>{
    b.disabled=true; const info=$('#ctxinfo'); info.textContent=t('web.assistant.collecting');
    try{
      const r=await post('/api/assistant/context',{});
      if(!r.ok){info.textContent=t('web.assistant.collect_failed');b.disabled=false;return;}
      let copied=false;
      try{ await navigator.clipboard.writeText(r.text); copied=true; }catch(e){}
      info.textContent=(copied?t('web.assistant.copied')+' · ':'')+t('web.assistant.collected',{chars:r.chars,path:r.saved});
      toast(copied?t('web.assistant.toast_clipboard'):t('web.assistant.toast_file'));
    }catch(e){ info.textContent=t('web.common.error_prefix')+esc(e.message); }
    b.disabled=false;
  };
}

// ---------------- Navigation ----------------
const TABS=[
  ['web.tab.overview',viewOverview],['web.tab.labs',viewLabs],['web.tab.drugs',viewDrug],['web.tab.genome',viewGenome],
  ['web.tab.lifestyle',viewLifestyle],['web.tab.tests',viewTests],['web.tab.second_opinion',viewSecond],['web.tab.prescriptions',viewMeds],
  ['web.tab.assistant',viewAssistant],
];
let current=0;
function buildNav(){
  $('#nav').innerHTML=TABS.map(([key])=>`<button>${esc(t(key))}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>mount(i));
}
function mount(i){
  current=i;
  $('#nav').querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));
  const v=$('#view');v.innerHTML=`<div class="muted">${esc(t('web.common.loading'))}</div>`;
  TABS[i][1](v).catch(e=>v.innerHTML=`<div class="card">${esc(t('web.common.error_prefix')+e.message)}</div>`);
}

// The parts of the page that live outside the tabs. Redrawn on a language switch, so
// that switching does not require a reload and does not lose the tab one is reading.
let _version=null;
function renderChrome(){
  $('#subhead').textContent=t('web.header.subtitle');
  const lb=$('#localbadge');
  lb.textContent='🔒 '+t('web.header.local_badge');
  lb.title=t('web.header.local_badge_hint');
  $('#disclaimer').textContent=t('web.header.disclaimer');
  $('#ver').textContent=_version?t('web.header.build',{version:_version}):'';
  $('#langswitch').innerHTML=LANGS.map(c=>
    `<button class="pickbtn" data-lang="${esc(c)}" title="${esc(t('web.header.language'))}"${c===LANG?' style="border-color:var(--accent);color:var(--ink)"':''}>${esc(t('web.lang.'+c))}</button>`).join('');
}
async function switchLang(code){
  if(code===LANG) return;
  await loadLang(code);
  const u=new URL(location.href); u.searchParams.set('lang',LANG);
  history.replaceState(null,'',u.pathname+u.search+u.hash);
  _sources=null;                      // the source chips are worded from the catalogue too
  renderChrome(); buildNav(); mount(current);
}

// picking a source folder from disk (the native macOS dialog) — a delegated handler
document.addEventListener('click',async e=>{
  const pick=e.target.closest('[data-pick]');
  const clr=e.target.closest('[data-clear]');
  const lng=e.target.closest('[data-lang]');
  if(lng){ switchLang(lng.getAttribute('data-lang')); return; }
  if(pick){
    const domain=pick.getAttribute('data-pick');
    pick.disabled=true;toast(t('web.common.opening_picker'));
    try{
      const r=await post('/api/pick-folder',{domain});
      if(r&&r.canceled){toast(t('web.common.canceled'));}
      else if(r&&r.ok){toast(t('web.common.folder_chosen'));_sources=null;mount(current);}
      else{toast(t('web.common.error_prefix')+((r&&r.error)||t('web.common.failed')));}
    }catch(err){toast(t('web.common.error_prefix')+err.message);}
    pick.disabled=false;
  }else if(clr){
    const domain=clr.getAttribute('data-clear');
    const r=await post('/api/clear-folder',{domain});
    if(r&&r.ok){toast(t('web.common.folder_reset'));_sources=null;mount(current);}
  }
});

(async function start(){
  // The catalogue is loaded BEFORE the first render: a page that flashes identifiers
  // and only then acquires words looks broken even when it is not.
  await loadLang(wantedLang());
  renderChrome();
  buildNav();
  {const lb=$('#localbadge');if(lb)lb.onclick=()=>mount(TABS.findIndex(x=>x[0]==='web.tab.assistant'));}
  mount(0);
  api('/api/ping').then(p=>{if(p&&p.version){_version=p.version;$('#ver').textContent=t('web.header.build',{version:_version});}}).catch(()=>{});
})();
</script>
